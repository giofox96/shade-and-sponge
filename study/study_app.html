<script>
const DATA = {"cards": [{"id": "c001", "chapter": "problem", "front": "Give the thesis in one sentence.", "back": "A computational method that chooses which species replace Porta's plane trees and where, scoring each layout on pedestrian heat stress (UTCI) and event runoff volume, and showing the trade-off (Pareto front).", "source": "notes/methodology.md"}, {"id": "c002", "chapter": "problem", "front": "Why will Barcelona replace many plane trees?", "back": "The tree master plan caps any species at 15%, and plane trees are ~29% of street trees.", "source": "notes/topic_decision.md"}, {"id": "c003", "chapter": "problem", "front": "How much did Barcelona's sealed surface grow, and when?", "back": "From 45% to 72% of the municipality, 1956–2009.", "source": "notes/topic_decision.md"}, {"id": "c004", "chapter": "problem", "front": "How often do intense storms hit Barcelona?", "back": "About 3 storms a year exceed 60 mm/h in their first 20 minutes (Barcelona Resilience Atlas).", "source": "notes/topic_decision.md"}, {"id": "c005", "chapter": "problem", "front": "What heat-health fact frames Barcelona's heat problem?", "back": "It carries one of Europe's highest urban-heat-island mortality burdens (Iungman et al. 2023).", "source": "notes/topic_decision.md"}, {"id": "c006", "chapter": "problem", "front": "Name the six replacement species the city names.", "back": "Celtis australis, Melia azedarach, Pyrus calleryana, Jacaranda mimosifolia, Tipuana tipu, Brachychiton populneus.", "source": "notes/topic_decision.md"}, {"id": "c007", "chapter": "problem", "front": "Which replacement species has a measured canopy-storage value?", "back": "Only Pyrus calleryana (Xiao & McPherson 2016). None of the six has a measured cooling value.", "source": "notes/topic_decision.md"}, {"id": "c008", "chapter": "problem", "front": "Which flood type does the thesis address, and which does it exclude?", "back": "Urban pluvial flooding from frequent, short storms. It excludes river (fluvial) floods and multi-day events on saturated soil.", "source": "notes/topic_decision.md"}, {"id": "c009", "chapter": "problem", "front": "Why was Bologna dropped as a flood case?", "back": "Its recent floods (Oct 2024, May 2023 Emilia-Romagna) were multi-day, saturated-soil or culvert events where trees have negligible influence.", "source": "notes/topic_decision.md"}, {"id": "c010", "chapter": "problem", "front": "Who is the primary user of the tool?", "back": "A computational designer working on the municipal street-tree replacement.", "source": "notes/topic_decision.md"}, {"id": "c011", "chapter": "problem", "front": "What is the risk the problem statement points to?", "back": "Replacement choices can trade away cooling or rain interception without anyone noticing, because most replacement species have no measured storage or cooling value.", "source": "notes/topic_decision.md"}, {"id": "c012", "chapter": "site", "front": "Where is the study site and how big is it?", "back": "Porta, Nou Barris, Barcelona; 0.84 km².", "source": "notes/site_selection.md"}, {"id": "c013", "chapter": "site", "front": "How many plane trees in Porta, and where are most?", "back": "832 plane trees (29% of 2,825 street trees); 194 on Av. Meridiana.", "source": "notes/site_selection.md"}, {"id": "c014", "chapter": "site", "front": "What were the two steps of site selection?", "back": "1) Eligibility: flood share, surface-heat anomaly and plane density all above the city's 60th percentile. 2) Ranking by the equal-weight mean of four normalised criteria.", "source": "notes/site_selection.md"}, {"id": "c015", "chapter": "site", "front": "What does 'non-compensatory' mean in the site selection?", "back": "A strong value on one hazard cannot make up for the absence of the other: every criterion must pass the threshold first.", "source": "notes/site_selection.md"}, {"id": "c016", "chapter": "site", "front": "How was the site choice tested for robustness?", "back": "Thresholds at the 50th, 60th and 70th percentiles: Porta is first at every threshold. 2,000 random (Dirichlet) weightings: Porta is in the top 3 in 53% of them.", "source": "notes/site_selection.md"}, {"id": "c017", "chapter": "site", "front": "Porta's ranks for flood, surface heat and heat vulnerability?", "back": "Flood #13, surface heat #11 (+1.36 °C), heat vulnerability #12 (91% of area in the top class).", "source": "notes/site_selection.md"}, {"id": "c018", "chapter": "site", "front": "What are the four site-selection criteria?", "back": "Pluvial flood hazard share, summer surface-temperature anomaly (Landsat), social heat vulnerability, plane-tree density.", "source": "notes/site_selection.md"}, {"id": "c019", "chapter": "site", "front": "Why is Sant Antoni not the main site?", "back": "It is #1 for flood but #38 for surface heat (below the city median), so it fails the both-hazards condition. It is the flood-dominant contrast site.", "source": "notes/site_selection.md"}, {"id": "c020", "chapter": "site", "front": "What is Florence's role?", "back": "Transfer test case: run the same method to see if trade-off pattern and species ranking hold.", "source": "notes/methodology.md"}, {"id": "c021", "chapter": "site", "front": "Why does it help that the replacement palette already grows in Porta?", "back": "Real crowns, heights and LAI of each species can be measured on site from LiDAR.", "source": "notes/site_selection.md"}, {"id": "c022", "chapter": "runoff", "front": "Describe the runoff chain in the model.", "back": "Rain → canopy interception (storage bucket) over crowns on sealed ground → remaining rain → SCS curve number → event runoff volume.", "source": "notes/methodology.md"}, {"id": "c023", "chapter": "runoff", "front": "Write the interception equation.", "back": "I = min(P, S), with S = s · LAI (P rain depth, S canopy storage in mm, s storage per unit LAI).", "source": "notes/methodology.md"}, {"id": "c024", "chapter": "runoff", "front": "What is the calibrated value of s and its source?", "back": "s = 1.75 mm per unit LAI, calibrated on Anys & Weiler (2024) Freiburg field data: 16 urban lime and maple trees, 51 storms.", "source": "notes/methodology.md"}, {"id": "c025", "chapter": "runoff", "front": "What is the lower bound of s in sensitivity runs, and why?", "back": "0.86 mm: surface storage only, without evaporation during events (Xiao & McPherson 2016).", "source": "notes/methodology.md"}, {"id": "c026", "chapter": "runoff", "front": "How much rain does a leafy crown hold at the start of a storm?", "back": "The first 2–4 mm (Kuehler et al. 2017).", "source": "notes/topic_decision.md"}, {"id": "c027", "chapter": "runoff", "front": "Curve numbers used for sealed and pervious surfaces?", "back": "98 for sealed surfaces and roofs; 74 for pervious (assumption: TR-55 open space, soil group C).", "source": "notes/methodology.md"}, {"id": "c028", "chapter": "runoff", "front": "Design storm depths (60 min) for T = 1, 2, 10 years?", "back": "19.6 mm, 31.9 mm, 62.5 mm (PDISBA city IDF).", "source": "notes/methodology.md"}, {"id": "c029", "chapter": "runoff", "front": "Why is the metric runoff volume, not peak flow?", "back": "In a paired-catchment field study, street trees cut runoff volume ~4% with no peak-flow effect (Selbig et al. 2021).", "source": "notes/topic_decision.md"}, {"id": "c030", "chapter": "runoff", "front": "What is the field benchmark for street-tree runoff reduction?", "back": "3.5–4% of runoff volume (Coville et al. 2022; Selbig et al. 2021).", "source": "notes/methodology.md"}, {"id": "c031", "chapter": "runoff", "front": "Why does the tree effect shrink as storms grow?", "back": "Canopy storage fills in the first few mm; the rest of a big storm passes through, so the intercepted share falls.", "source": "notes/topic_decision.md"}, {"id": "c032", "chapter": "runoff", "front": "What is the main trait driving interception?", "back": "Leaf area index (LAI) / leaf area density; storage capacity also varies threefold among 20 species (Xiao & McPherson 2016).", "source": "notes/topic_decision.md"}, {"id": "c033", "chapter": "runoff", "front": "Why are roots not in the scoring?", "back": "Only two lab studies (Bartens 2008; Zhang 2019): roots raise infiltration, but species differences are unclear (oak vs maple not significant).", "source": "notes/topic_decision.md"}, {"id": "c034", "chapter": "runoff", "front": "Why is stemflow ignored?", "back": "It is < 1% of rain (Anys & Weiler 2024).", "source": "notes/methodology.md"}, {"id": "c035", "chapter": "runoff", "front": "What is a return period T?", "back": "The average interval between storms of that size; T = 10 yr means about a 10% chance per year.", "source": "study/guide.md"}, {"id": "c036", "chapter": "runoff", "front": "What sewer design level does Barcelona use?", "back": "A 10-year return period.", "source": "notes/city_screening.md"}, {"id": "c037", "chapter": "heat", "front": "What is UTCI?", "back": "Universal Thermal Climate Index: the 'felt' temperature for a pedestrian, from air temperature, humidity, wind and mean radiant temperature.", "source": "notes/methodology.md"}, {"id": "c038", "chapter": "heat", "front": "Which UTCI input do trees change most?", "back": "Mean radiant temperature (MRT), through shade.", "source": "notes/methodology.md"}, {"id": "c039", "chapter": "heat", "front": "UTCI threshold for strong heat stress?", "back": "UTCI > 32 °C.", "source": "notes/methodology.md"}, {"id": "c040", "chapter": "heat", "front": "Write the canopy transmissivity formula.", "back": "τ = exp(−k · LAI), with k = 0.5 (Beer–Lambert).", "source": "notes/methodology.md"}, {"id": "c041", "chapter": "heat", "front": "What is Ladybug Tier 1?", "back": "Fast point-based UTCI at 1.1 m on a 2 m sidewalk grid, used for many layouts.", "source": "notes/methodology.md"}, {"id": "c042", "chapter": "heat", "front": "Two reasons Ladybug underestimates tree cooling.", "back": "Crowns are opaque without the τ correction (shade MRT off), and it has no evapotranspiration (~2–3 °C UTCI, Mannucci 2025).", "source": "notes/methodology.md"}, {"id": "c043", "chapter": "heat", "front": "What is Tier 2 in the heat module?", "back": "Honeybee UTCI comfort map (Radiance + EnergyPlus) with leaf-on/off transmittance, for a few final layouts.", "source": "notes/methodology.md"}, {"id": "c044", "chapter": "heat", "front": "What is Infrared City's role?", "back": "An AI surrogate API for UTCI in seconds (tutor co-founded it); would replace Tier 1 inside the optimiser. Access still to confirm.", "source": "notes/methodology.md"}, {"id": "c045", "chapter": "heat", "front": "Why does the optimiser need a heat proxy?", "back": "Ladybug costs minutes per layout (20–25 min for 42 trees, Shaamala 2025); 832 positions × many layouts is too slow.", "source": "notes/methodology.md"}, {"id": "c046", "chapter": "heat", "front": "Which is the stronger air-cooling term, shade or transpiration?", "back": "Transpiration (Park 2026: 1.15 °C vs shade 0.43 °C), but it needs soil water.", "source": "slides/outline_20oct.md"}, {"id": "c047", "chapter": "heat", "front": "What happened to Platanus in an extreme heatwave?", "back": "It lost roughly 30–50% of its plant area index after > 41 °C (Sanusi & Livesley 2020) → low-LAI plane variant in sensitivity.", "source": "notes/methodology.md"}, {"id": "c048", "chapter": "tradeoff", "front": "Which traits help both heat and runoff?", "back": "LAI and crown size.", "source": "notes/topic_decision.md"}, {"id": "c049", "chapter": "tradeoff", "front": "Which traits create the heat–runoff conflict?", "back": "Leaf habit (evergreen vs deciduous) and transpiration / water demand.", "source": "notes/topic_decision.md"}, {"id": "c050", "chapter": "tradeoff", "front": "Why did the leaf-on calendar not create a trade-off?", "back": "78% of intense storm days fall in May–Oct (Esbrí et al. 2026), when all palette species are in full leaf.", "source": "shade_sponge/README.md"}, {"id": "c051", "chapter": "tradeoff", "front": "What created the first real trade-off in tool v0?", "back": "Winter sun access: winter shade on sunlit open ground counted as a cost.", "source": "shade_sponge/README.md"}, {"id": "c052", "chapter": "tradeoff", "front": "Mnemonic for the trade-off finding?", "back": "Big crowns win both; leaves in winter split them.", "source": "study/guide.md"}, {"id": "c053", "chapter": "gap", "front": "What is the gap in one sentence?", "back": "No method selects species and positions using measured traits for both heat and runoff.", "source": "notes/topic_decision.md"}, {"id": "c054", "chapter": "gap", "front": "What is SylvCiT and what is missing?", "back": "A trait-based AI tree recommender (Nicol et al. 2026, Montreal); its runoff module is disabled, it has no heat, and it uses diversity traits.", "source": "notes/topic_decision.md"}, {"id": "c055", "chapter": "gap", "front": "What does Mannucci et al. 2025 do, and lack?", "back": "Grasshopper + Ladybug + Kangaroo assess UTCI and runoff, but for fixed scenarios, with no species traits and no optimisation.", "source": "notes/topic_decision.md"}, {"id": "c056", "chapter": "gap", "front": "Which works optimise trees for heat only?", "back": "Shaamala et al. 2025 and Peng et al. 2026 (Shaamala names water sensitivity as future work).", "source": "notes/topic_decision.md"}, {"id": "c057", "chapter": "gap", "front": "What is the closest precedent?", "back": "Tan & Liu 2026: NSGA-II + Random Forest surrogate in Grasshopper, species and positions of 30 trees for UTCI, CO2 and diversity.", "source": "notes/topic_decision.md"}, {"id": "c058", "chapter": "gap", "front": "What does this thesis add to Tan & Liu 2026?", "back": "Runoff, the city's own replacement palette, and the seasons (leaf calendar, winter sun). They used 4 Chicago species, US allometry, one summer hour.", "source": "slides/outline_20oct.md"}, {"id": "c059", "chapter": "gap", "front": "Why is the trait data gap itself a finding?", "back": "Most of the city's replacement species have no measured storage or cooling value; the method has to fill gaps with ranges, and the gap is reported.", "source": "notes/methodology.md"}, {"id": "c060", "chapter": "rq", "front": "State the research question (short form).", "back": "In Porta, which replacement species and positions jointly reduce UTCI (peak summer hour) and event runoff volume (1-, 2-, 10-yr storms), and how large is the trade-off vs current trees, like-for-like and single-objective layouts?", "source": "notes/topic_decision.md"}, {"id": "c061", "chapter": "rq", "front": "What is H1?", "back": "Synergy: with the same number and size class of trees, trait-based layouts beat like-for-like replacement on both UTCI and runoff, because crown size and LAI drive both.", "source": "notes/topic_decision.md"}, {"id": "c062", "chapter": "rq", "front": "What is H2?", "back": "Trade-off: heat-optimal and runoff-optimal layouts differ mainly in species (leaf habit, transpiration), not positions; the Pareto front is not a single point.", "source": "notes/topic_decision.md"}, {"id": "c063", "chapter": "rq", "front": "What is H3?", "back": "Validity boundary: the runoff benefit shrinks as the return period grows; extreme events (6 Sept 2018, ≈300-yr) are outside what trees can affect.", "source": "notes/topic_decision.md"}, {"id": "c064", "chapter": "rq", "front": "Mnemonic for the three hypotheses?", "back": "S-T-B: Synergy, Trade-off, Boundary.", "source": "study/guide.md"}, {"id": "c065", "chapter": "rq", "front": "Which comparison tests each hypothesis?", "back": "H1: S4 vs S1 on both objectives. H2: species of S2 vs S3. H3: runoff benefit vs return period.", "source": "notes/methodology.md"}, {"id": "c066", "chapter": "method", "front": "List scenarios S0–S4.", "back": "S0 current trees; S1 like-for-like palette; S2 heat-only optimum; S3 runoff-only optimum; S4 multi-objective Pareto set.", "source": "notes/methodology.md"}, {"id": "c067", "chapter": "method", "front": "Mnemonic for S0–S4?", "back": "Now, Swap, Hot, Wet, Both.", "source": "study/guide.md"}, {"id": "c068", "chapter": "method", "front": "Which optimiser is planned, and what does v0 use?", "back": "NSGA-II (pymoo or Wallacei); v0 uses a weighted-sum linear program (HiGHS).", "source": "notes/methodology.md"}, {"id": "c069", "chapter": "method", "front": "Optimisation constraints?", "back": "≤ 15% per species; Shannon diversity floor; no invasive or pest-host species; crown clearance from façades.", "source": "notes/methodology.md"}, {"id": "c070", "chapter": "method", "front": "Which LiDAR, and why is its date useful?", "back": "ICGC LiDAR flown 26 Sept 2021, leaf-on, ≥ 8 pts/m², CC BY 4.0: gives tree height, crown, LAI proxy, buildings and DTM.", "source": "notes/methodology.md"}, {"id": "c071", "chapter": "method", "front": "What does topo.py do?", "back": "Priority-Flood flow routing on the DTM + buildings: water convergence and flow distance to flood hotspots.", "source": "shade_sponge/README.md"}, {"id": "c072", "chapter": "method", "front": "What does heat.py compute?", "back": "Sun position, building shadows, elliptical shadows of ellipsoid crowns with opacity from LAI and leaf month; summer shade = benefit, winter shade = cost.", "source": "shade_sponge/README.md"}, {"id": "c073", "chapter": "method", "front": "What does season.py add?", "back": "A leaf-on calendar per species and storm months, so runoff is an expected value over the storm season.", "source": "shade_sponge/README.md"}, {"id": "c074", "chapter": "method", "front": "Rule for every parameter in tool code?", "back": "It is either sourced (cited) or marked ASSUMPTION.", "source": "CLAUDE.md"}, {"id": "c075", "chapter": "method", "front": "Name three ASSUMPTION parameters in the tool.", "back": "CAPTURE_M = 100 m (flow path to hotspot), OP_BARE = 0.35 (leafless crown opacity), R_OFF = 0.5 (leaf-off LAI ratio).", "source": "shade_sponge/README.md"}, {"id": "c076", "chapter": "method", "front": "What are the two front-ends of the tool?", "back": "Grasshopper (primary, computational designer, with Ladybug) and a later web app for non-technical users using the fast heat proxy.", "source": "CLAUDE.md"}, {"id": "c077", "chapter": "method", "front": "How are species without measurements handled?", "back": "Genus or leaf-habit class values with a range; every result re-run at the low and high end (sensitivity).", "source": "notes/methodology.md"}, {"id": "c078", "chapter": "results", "front": "How much do Porta's current street trees cut runoff (T2-60)?", "back": "1.85% of total runoff (2.9% on open space); range 0.4–4.0% across s and T.", "source": "notes/methodology.md"}, {"id": "c079", "chapter": "results", "front": "What happens to runoff during the transition to young trees?", "back": "Any young replacement ≈ +0.7% runoff ≈ 37% (more than a third) of the current street-tree benefit lost.", "source": "notes/methodology.md"}, {"id": "c080", "chapter": "results", "front": "What did Cortinovis et al. 2022 find for Barcelona?", "back": "20,170 new street trees raised runoff retention only from 50.18% to 50.76% for a 20 mm event (city-wide, trees as land cover).", "source": "notes/methodology.md"}, {"id": "c081", "chapter": "results", "front": "Optimised vs random palette, summer shade (tool v0)?", "back": "+14% summer shade; robust across 7 sensitivity variants.", "source": "shade_sponge/README.md"}, {"id": "c082", "chapter": "results", "front": "What is the no-regret swap?", "back": "Summer-only → balanced layout: ~100 Tipuana swapped for Jacaranda, same summer shade, 9% less winter shade.", "source": "shade_sponge/README.md"}, {"id": "c083", "chapter": "results", "front": "How does placement follow the buildings?", "back": "Winter-bare Jacaranda goes to positions sunny in winter; winter-leafed species go where buildings already shade the street.", "source": "shade_sponge/README.md"}, {"id": "c084", "chapter": "results", "front": "Did any replacement layout reach S0?", "back": "No: mature planes still give more shade than any replacement layout.", "source": "shade_sponge/README.md"}, {"id": "c085", "chapter": "results", "front": "Open problem found in tool v0?", "back": "Hotspot runoff does not follow the runoff weight; the per-position water potential predicts it poorly.", "source": "shade_sponge/README.md"}, {"id": "c086", "chapter": "limits", "front": "Name four limits to state openly.", "back": "Flood index not depth; LiDAR LAI proxy probably low; same s for all species; volume only (no sewer, routing to outlets or ponding). Also: airport EPW, no night effects.", "source": "notes/methodology.md"}, {"id": "c087", "chapter": "limits", "front": "Which TRL and innovation type should you claim?", "back": "TRL 3 (experimental proof of concept on Porta); process innovation delivered as a tool.", "source": "notes/research_method_guidelines.md"}, {"id": "c088", "chapter": "limits", "front": "What is missing according to the seminar checklist?", "back": "Stakeholder validation (interviews, user walkthrough), an actor map, and naming innovation type and TRL.", "source": "notes/research_method_guidelines.md"}, {"id": "c089", "chapter": "limits", "front": "Answer: 'Is a 2% effect worth a thesis?'", "back": "The thesis is the method and the trade-off, not a big runoff number; H3 states the limit openly, and the heat side may dominate.", "source": "slides/outline_20oct.md"}, {"id": "c090", "chapter": "limits", "front": "Answer: 'What if the scope is too narrow?'", "back": "Widen the tree into a system: add the tree pit as one design variable; soil as 2–3 literature options; carbon reported, not optimised.", "source": "slides/outline_20oct.md"}], "quiz": [{"id": "q001", "chapter": "problem", "question": "Why will many of Barcelona's plane trees be replaced?", "a": "The master plan caps any species at 15%", "b": "Plane trees are invasive", "c": "A pest outbreak kills them", "d": "They block flood flows", "answer": "a", "explanation": "Planes are ~29% of street trees; the cap is 15% per species."}, {"id": "q002", "chapter": "problem", "question": "Which flood type does the thesis address?", "a": "River (fluvial) floods", "b": "Pluvial floods from frequent short storms", "c": "Multi-day saturated-soil events", "d": "Coastal storm surge", "answer": "b", "explanation": "Trees only matter for frequent, short pluvial storms on sealed surfaces."}, {"id": "q003", "chapter": "problem", "question": "Which replacement species has a measured canopy-storage value in the reviewed literature?", "a": "Celtis australis", "b": "Jacaranda mimosifolia", "c": "Pyrus calleryana", "d": "Tipuana tipu", "answer": "c", "explanation": "Only Pyrus calleryana (Xiao & McPherson 2016); none has a measured cooling value."}, {"id": "q004", "chapter": "problem", "question": "Barcelona's sealed surface grew from … to … (1956–2009)", "a": "30% → 55%", "b": "45% → 72%", "c": "60% → 85%", "d": "45% → 60%", "answer": "b", "explanation": "45% to 72% of the municipality."}, {"id": "q005", "chapter": "site", "question": "Why is the site selection called non-compensatory?", "a": "Weights are all equal", "b": "Every criterion must pass a threshold before ranking", "c": "Only one criterion is used", "d": "It ignores social vulnerability", "answer": "b", "explanation": "A strong flood value cannot make up for missing heat."}, {"id": "q006", "chapter": "site", "question": "What is the eligibility threshold in the main site-selection run?", "a": "50th percentile", "b": "60th percentile", "c": "70th percentile", "d": "90th percentile", "answer": "b", "explanation": "60th; tested also at 50th and 70th, Porta first each time."}, {"id": "q007", "chapter": "site", "question": "Why is Sant Antoni the contrast site?", "a": "It has no plane trees", "b": "It is #1 for flood but below median for heat", "c": "It is outside Barcelona", "d": "It has no LiDAR", "answer": "b", "explanation": "#38 for surface heat → fails the both-hazards rule."}, {"id": "q008", "chapter": "site", "question": "How many plane trees are in Porta?", "a": "194", "b": "296", "c": "832", "d": "2,825", "answer": "c", "explanation": "832 (29%); 194 on Av. Meridiana; 2,825 street trees in total."}, {"id": "q009", "chapter": "runoff", "question": "In the storage bucket model, interception I equals …", "a": "P × S", "b": "min(P, S)", "c": "max(P, S)", "d": "S − P", "answer": "b", "explanation": "I = min(P, S), S = s · LAI."}, {"id": "q010", "chapter": "runoff", "question": "The calibrated storage per unit LAI is …", "a": "0.25 mm", "b": "0.86 mm", "c": "1.75 mm", "d": "4.0 mm", "answer": "c", "explanation": "1.75 mm per unit LAI, calibrated on Anys & Weiler (2024)."}, {"id": "q011", "chapter": "runoff", "question": "Why runoff volume instead of peak flow?", "a": "Peak flow needs no data", "b": "Field data show trees cut volume ~4% but not peak flow", "c": "Volume is always larger", "d": "The tutor asked for it", "answer": "b", "explanation": "Selbig et al. 2021 paired-catchment study."}, {"id": "q012", "chapter": "runoff", "question": "Curve number used for sealed surfaces?", "a": "74", "b": "85", "c": "98", "d": "100", "answer": "c", "explanation": "98 sealed and roofs; 74 pervious (assumption)."}, {"id": "q013", "chapter": "runoff", "question": "Design storm depth for T = 2 yr, 60 min (PDISBA)?", "a": "19.6 mm", "b": "31.9 mm", "c": "62.5 mm", "d": "21.2 mm", "answer": "b", "explanation": "T1 19.6, T2 31.9, T10 62.5 mm; T2-20 min is 21.2 mm."}, {"id": "q014", "chapter": "runoff", "question": "Why does the tree benefit shrink with the return period?", "a": "Trees lose leaves in big storms", "b": "Canopy storage fills in the first few mm", "c": "Sewers work better in big storms", "d": "SCS-CN is not valid for big storms", "answer": "b", "explanation": "Crowns hold the first 2–4 mm; the rest passes through."}, {"id": "q015", "chapter": "runoff", "question": "Why are roots left out of the species score?", "a": "Roots do not affect infiltration", "b": "Only two lab studies; species differences unclear", "c": "They are too deep to model", "d": "LiDAR cannot see them", "answer": "b", "explanation": "Bartens 2008 and Zhang 2019: roots help, species effect unclear."}, {"id": "q016", "chapter": "heat", "question": "Canopy transmissivity in the method is …", "a": "τ = 1 − LAI", "b": "τ = exp(−0.5 · LAI)", "c": "τ = 0.5 · LAI", "d": "τ = exp(LAI)", "answer": "b", "explanation": "Beer–Lambert with k = 0.5 (Peng et al. 2026)."}, {"id": "q017", "chapter": "heat", "question": "Which UTCI input do trees change most?", "a": "Air humidity", "b": "Wind speed", "c": "Mean radiant temperature", "d": "Air pressure", "answer": "c", "explanation": "Shade lowers MRT."}, {"id": "q018", "chapter": "heat", "question": "Strong heat stress starts at UTCI above …", "a": "26 °C", "b": "32 °C", "c": "38 °C", "d": "46 °C", "answer": "b", "explanation": "> 32 °C (Bröde et al. 2012)."}, {"id": "q019", "chapter": "heat", "question": "Why a heat proxy inside the optimiser?", "a": "Ladybug is inaccurate", "b": "Ladybug costs minutes per layout", "c": "UTCI is not defined at night", "d": "The tutor forbids Ladybug", "answer": "b", "explanation": "20–25 min per layout for 42 trees (Shaamala 2025)."}, {"id": "q020", "chapter": "heat", "question": "Which air-cooling effect is larger (Park 2026)?", "a": "Shade", "b": "Transpiration", "c": "Albedo", "d": "Wind", "answer": "b", "explanation": "1.15 °C vs 0.43 °C; transpiration needs soil water."}, {"id": "q021", "chapter": "tradeoff", "question": "Which traits help BOTH objectives?", "a": "Leaf habit and wood anatomy", "b": "LAI and crown size", "c": "Root depth and seed size", "d": "Flower colour and bark", "answer": "b", "explanation": "Big, dense crowns shade and intercept."}, {"id": "q022", "chapter": "tradeoff", "question": "What first created a real trade-off in tool v0?", "a": "Adding the leaf-on calendar", "b": "Winter sun access as a cost", "c": "Adding roots", "d": "Changing the storm depth", "answer": "b", "explanation": "78% of storm days are in May–Oct, so the calendar alone did not split the objectives."}, {"id": "q023", "chapter": "gap", "question": "Closest precedent to this thesis?", "a": "SylvCiT (Nicol 2026)", "b": "Tan & Liu 2026", "c": "Cortinovis 2022", "d": "Pacetti 2022", "answer": "b", "explanation": "Species + positions, NSGA-II + surrogate, UTCI/CO2/diversity, no runoff."}, {"id": "q024", "chapter": "gap", "question": "What is missing in SylvCiT?", "a": "Any trait data", "b": "The runoff module (disabled) and heat", "c": "A user interface", "d": "Open-source licence", "answer": "b", "explanation": "Runoff slider disabled; no heat; Montreal only."}, {"id": "q025", "chapter": "gap", "question": "Mannucci et al. 2025 assess UTCI and runoff, but …", "a": "only in Florence", "b": "with fixed scenarios, no species traits, no optimisation", "c": "without Grasshopper", "d": "only at night", "answer": "b", "explanation": "Scenario testing, not optimisation."}, {"id": "q026", "chapter": "rq", "question": "H2 states that heat- and runoff-optimal layouts differ mainly in …", "a": "positions", "b": "species", "c": "number of trees", "d": "tree age", "answer": "b", "explanation": "Leaf habit and transpiration → the Pareto front is not a point."}, {"id": "q027", "chapter": "rq", "question": "Which comparison tests H1?", "a": "S2 vs S3", "b": "S4 vs S1", "c": "S0 vs S0", "d": "T1 vs T10", "answer": "b", "explanation": "Trait-based (S4) vs like-for-like (S1) on both objectives."}, {"id": "q028", "chapter": "method", "question": "S1 is …", "a": "Current trees", "b": "Like-for-like replacement with the city palette", "c": "Heat-only optimum", "d": "Runoff-only optimum", "answer": "b", "explanation": "Now, Swap, Hot, Wet, Both."}, {"id": "q029", "chapter": "method", "question": "Which is NOT an optimisation constraint?", "a": "≤ 15% per species", "b": "Shannon diversity floor", "c": "Minimum flower count", "d": "Façade clearance", "answer": "c", "explanation": "Constraints: cap, diversity floor, no invasive/pest hosts, clearance."}, {"id": "q030", "chapter": "method", "question": "What does topo.py add?", "a": "Sun position", "b": "DTM flow routing to flood hotspots", "c": "Leaf calendar", "d": "Species palette", "answer": "b", "explanation": "Priority-Flood routing → water convergence, distance to hotspots."}, {"id": "q031", "chapter": "results", "question": "Runoff cut by Porta's current street trees at T2-60?", "a": "0.2%", "b": "1.85%", "c": "10%", "d": "25%", "answer": "b", "explanation": "1.85% total, 2.9% open space; field benchmark 3.5–4%."}, {"id": "q032", "chapter": "results", "question": "Benefit lost when planes are replaced by young trees?", "a": "≈ 5%", "b": "≈ 37%", "c": "≈ 75%", "d": "None", "answer": "b", "explanation": "≈ +0.7% runoff, more than a third of the current benefit."}, {"id": "q033", "chapter": "results", "question": "The no-regret swap is …", "a": "Planes → Celtis", "b": "Tipuana → Jacaranda", "c": "Melia → Pyrus", "d": "Brachychiton → Tipuana", "answer": "b", "explanation": "Same summer shade, 9% less winter shade."}, {"id": "q034", "chapter": "limits", "question": "Which TRL should the thesis claim?", "a": "TRL 1", "b": "TRL 3", "c": "TRL 6", "d": "TRL 9", "answer": "b", "explanation": "Experimental proof of concept on Porta; TRL 4 needs validation against measured data."}]};
const CH = {problem:"Problem", site:"Site", runoff:"Runoff", heat:"Heat", tradeoff:"Trade-off", gap:"Gap", rq:"RQ + H", method:"Method", results:"Results", limits:"Limits"};
const DAYS = [0, 1, 2, 4, 8];             // Leitner box → days until next review
const KEY = "shade-sponge-study-v1";
const today = () => Math.floor(Date.now() / 864e5);
let st = {};
try { st = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { st = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
st.boxes = st.boxes || {}; st.chap = st.chap || [];
let mode = "cards", queue = [], cur = null, shown = false, qScore = [0, 0], timer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inChap = x => !st.chap.length || st.chap.includes(x.chapter);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const boxOf = id => (st.boxes[id] || {b: 0}).b;
const isDue = c => { const r = st.boxes[c.id]; return !r || r.d + DAYS[r.b] <= today(); };

function countdown() {
  const d = Math.ceil((Date.UTC(2026, 9, 20) - Date.now()) / 864e5);
  $("count").textContent = d > 0 ? d + " days to the 20 Oct session" : "20 Oct session: done";
}

function chips() {
  $("chips").innerHTML = Object.entries(CH).map(([k, v]) =>
    `<button class="chip" data-k="${k}" aria-pressed="${st.chap.includes(k)}">${v}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    st.chap = st.chap.includes(k) ? st.chap.filter(x => x !== k) : [...st.chap, k];
    save(); chips(); start(mode);
  });
}

function start(m) {
  mode = m; clearInterval(timer);
  ["cards", "quiz", "say", "prog"].forEach(x => $("m-" + x).setAttribute("aria-pressed", x === m));
  if (m === "cards") {
    const pool = DATA.cards.filter(inChap);
    queue = shuffle(pool.filter(isDue));
    $("hint").textContent = "Try to answer before you reveal. 'Again' sends the card back to box 1; 'Knew it' moves it up a box (next review in 1, 2, 4, 8 days). Chapters filter all modes; none selected = all.";
    nextCard();
  } else if (m === "quiz") {
    queue = shuffle(DATA.quiz.filter(inChap)).slice(0, 10); qScore = [0, 0];
    $("hint").textContent = "10 mixed questions. Mixing chapters (interleaving) is harder, and that is the point.";
    nextQuiz();
  } else if (m === "say") {
    queue = shuffle(DATA.cards.filter(inChap));
    $("hint").textContent = "Explain the answer out loud in 30 seconds, as if to someone outside the field. Then reveal and compare.";
    nextSay();
  } else progress();
}

function nextCard() {
  shown = false; cur = queue.shift();
  if (!cur) {
    const left = DATA.cards.filter(inChap).length;
    $("stage").innerHTML = `<p class="q">Nothing due right now.</p><p class="note">All ${left} cards in this selection are scheduled for later days. Take the quiz, or come back tomorrow.</p><div class="row"><button class="btn" id="all">Review all anyway</button></div>`;
    $("all").onclick = () => { queue = shuffle(DATA.cards.filter(inChap)); nextCard(); };
    return;
  }
  drawCard();
}
function drawCard() {
  $("stage").innerHTML = `<div class="meta"><span>${CH[cur.chapter]}</span><span>box ${boxOf(cur.id) + 1} · ${queue.length} left</span></div>
    <p class="q">${esc(cur.front)}</p>
    ${shown ? `<div class="a">${esc(cur.back)}<div class="src">${esc(cur.source)}</div></div>
      <div class="row"><button class="btn again" id="again">Again</button><button class="btn good" id="good">Knew it</button></div>`
      : `<div class="row"><button class="btn primary" id="show">Show answer</button></div>`}`;
  if (shown) { $("again").onclick = () => grade(false); $("good").onclick = () => grade(true); $("good").focus(); }
  else { $("show").onclick = () => { shown = true; drawCard(); }; $("show").focus(); }
}
function grade(ok) {
  const b = ok ? Math.min(boxOf(cur.id) + 1, 4) : 0;
  st.boxes[cur.id] = {b, d: today()}; save();
  if (!ok) queue.splice(Math.min(3, queue.length), 0, cur);   // see it again in this session
  nextCard();
}

function nextQuiz() {
  cur = queue.shift();
  if (!cur) {
    const [r, n] = qScore;
    $("stage").innerHTML = `<p class="q">${r} / ${n} correct</p><p class="note">${r / Math.max(n, 1) >= 0.9 ? "Ready for this selection." : "Turn the questions you missed into card reviews: open Cards with the same chapters."}</p><div class="row"><button class="btn primary" id="again">New quiz</button></div>`;
    $("again").onclick = () => start("quiz"); return;
  }
  const opts = shuffle(["a", "b", "c", "d"].map(k => ({k, t: cur[k]})));
  $("stage").innerHTML = `<div class="meta"><span>${CH[cur.chapter]}</span><span>${qScore[1] + 1} / ${qScore[1] + queue.length + 1}</span></div>
    <p class="q">${esc(cur.question)}</p><div class="row">${opts.map(o => `<button class="btn opt" data-k="${o.k}">${esc(o.t)}</button>`).join("")}</div><div id="exp"></div>`;
  $("stage").querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const ok = b.dataset.k === cur.answer; qScore[1]++; if (ok) qScore[0]++;
    $("stage").querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.dataset.k === cur.answer) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    $("exp").innerHTML = `<div class="a">${ok ? "Correct. " : "Not quite. "}${esc(cur.explanation)}</div><div class="row" style="margin-top:12px"><button class="btn primary" id="nx">Next</button></div>`;
    $("nx").onclick = nextQuiz; $("nx").focus();
  });
}

function nextSay() {
  clearInterval(timer); cur = queue.shift();
  if (!cur) { queue = shuffle(DATA.cards.filter(inChap)); cur = queue.shift(); }
  let t = 30;
  $("stage").innerHTML = `<div class="meta"><span>${CH[cur.chapter]}</span><span>explain aloud</span></div>
    <p class="q">${esc(cur.front)}</p><div class="timer" id="t">0:30</div><div id="ans"></div>
    <div class="row"><button class="btn primary" id="rev">Reveal</button><button class="btn" id="skip">Next</button></div>`;
  timer = setInterval(() => { t--; $("t").textContent = "0:" + String(Math.max(t, 0)).padStart(2, "0"); if (t <= 0) clearInterval(timer); }, 1000);
  $("rev").onclick = () => { clearInterval(timer); $("ans").innerHTML = `<div class="a">${esc(cur.back)}<div class="src">${esc(cur.source)}</div></div>`; };
  $("skip").onclick = nextSay;
}

function progress() {
  const cards = DATA.cards.filter(inChap), counts = [0, 0, 0, 0, 0];
  cards.forEach(c => counts[boxOf(c.id)]++);
  const due = cards.filter(isDue).length;
  const rows = Object.entries(CH).filter(([k]) => !st.chap.length || st.chap.includes(k)).map(([k, v]) => {
    const cs = cards.filter(c => c.chapter === k); if (!cs.length) return "";
    const pct = Math.round(100 * cs.reduce((s, c) => s + boxOf(c.id), 0) / (4 * cs.length));
    return `<tr><td>${v}</td><td class="src">${cs.length} cards</td><td><div class="bar"><i style="width:${pct}%"></i></div></td></tr>`;
  }).join("");
  $("stage").innerHTML = `<div class="meta"><span>Leitner boxes</span><span>${due} due today</span></div>
    <div class="boxes">${counts.map((n, i) => `<div class="box"><b>${n}</b><small>box ${i + 1}${i ? " · " + DAYS[i] + " d" : " · daily"}</small></div>`).join("")}</div>
    <table class="ch-table">${rows}</table>
    <div class="row"><button class="btn" id="reset">Reset progress</button></div><p class="note" id="rnote"></p>`;
  $("hint").textContent = "Progress is saved in this browser only. Box 5 = known well; the bar shows how far each chapter has moved up.";
  let armed = false;
  $("reset").onclick = () => {
    if (!armed) { armed = true; $("reset").textContent = "Tap again to erase all progress"; return; }
    st.boxes = {}; save(); progress(); $("rnote").textContent = "Progress erased.";
  };
}

["cards", "quiz", "say", "prog"].forEach(m => $("m-" + m).onclick = () => start(m));
countdown(); chips(); start("cards");
</script>
