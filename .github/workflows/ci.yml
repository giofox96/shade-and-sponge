# Checks every push that touches Python: syntax errors / undefined names (ruff) and the data-free core tests.
# Docs-only pushes (notes, slides, CSVs) do not run it, to save Actions minutes.
name: CI
on:
  push:
    paths: ["**.py", "requirements.txt", ".github/workflows/ci.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 --output-format github shade_sponge scripts tests
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider tests
