" fill="#8C6A24" font-weight="normal" text-anchor="start">S1a 87.4</text><text x="1330" y="440" font-size="17" fill="#3F663E" font-weight="normal" text-anchor="start">Opt 98.3</text><text x="980" y="470" font-size="17" fill="#663825" font-weight="bold" text-anchor="start">Winter sun</text><text x="1200" y="470" font-size="17" fill="#8C6A24" font-weight="normal" text-anchor="start">S1a 99.7</text><text x="1330" y="470" font-size="17" fill="#3F663E" font-weight="normal" text-anchor="start">Opt 93.7</text><text x="980" y="500" font-size="17" fill="#283F66" font-weight="bold" text-anchor="start">Total runoff</text><text x="1200" y="500" font-size="17" fill="#8C6A24" font-weight="normal" text-anchor="start">S1a 99.7</text><text x="1330" y="500" font-size="17" fill="#3F663E" font-weight="normal" text-anchor="start">Opt 99.9</text><text x="980" y="530" font-size="17" fill="#283F66" font-weight="bold" text-anchor="start">Hotspot runoff</text><text x="1200" y="530" font-size="17" fill="#8C6A24" font-weight="normal" text-anchor="start">S1a 99.6</text><text x="1330" y="530" font-size="17" fill="#3F663E" font-weight="normal" text-anchor="start">Opt 100.0</text><text x="980" y="560" font-size="17" fill="#3F663E" font-weight="bold" text-anchor="start">Canopy cover</text><text x="1200" y="560" font-size="17" fill="#8C6A24" font-weight="normal" text-anchor="start">S1a 92.3</text><text x="1330" y="560" font-size="17" fill="#3F663E" font-weight="normal" text-anchor="start">Opt 95.3</text><text x="980" y="620" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="start">100 = today. Outward = better. Read axis by axis:</text><text x="980" y="644" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="start">the polygon's area means nothing.</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: databases/barcelona/tool_v0_summary_sizeexact_trunkTERCERA.csv (python -m shade_sponge porta --size=exact --trunk=TERCERA). Heat = effective-shade proxy, not yet UTCI. Runoff: T2-60 storm, season-weighted.</text><text x="60" y="869" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Traits at equal trunk size (TERCERA; Pyrus SEGONA). S1a = 2026 mix (press) placed at random within the sidewalk sizing rule, 10 seeds. Canopy = crown-disc model, compare between layouts only.</text></svg>