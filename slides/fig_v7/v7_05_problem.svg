<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">The problem</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Context, problem and gap, kept apart</text><rect x="60" y="220" width="1480" height="420" rx="16" fill="#2A2622" fill-opacity="0.05" stroke="none" stroke-width="2"/><text x="110" y="320" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">When Barcelona replaces a plane tree, the only documented rule for</text><text x="110" y="371" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">the new species is qualitative (district, sidewalk width,</text><text x="110" y="423" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">tradition). No rule quantifies heat or runoff, so thousands of</text><text x="110" y="474" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">replacements will change each street's shade and rain interception,</text><text x="110" y="525" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">and nobody measures by how much.</text><text x="60" y="720" font-size="18" fill="#665E4F" font-weight="bold" text-anchor="start">CONTEXT</text><text x="60" y="752" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">plane removal, 15% cap, one tree at a time</text><text x="560" y="720" font-size="18" fill="#663825" font-weight="bold" text-anchor="start">PROBLEM</text><text x="560" y="752" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">a qualitative rule, not visible in practice</text><text x="1060" y="720" font-size="18" fill="#283F66" font-weight="bold" text-anchor="start">GAP</text><text x="1060" y="752" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">no quantities for heat or runoff, per position</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: notes/topic_decision.md §10.1–10.2.</text></svg>