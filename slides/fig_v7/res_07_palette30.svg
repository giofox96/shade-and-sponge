ies; equal-</text><text x="60" y="869" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">trunk traits (TERCERA) from the city pool of LiDAR trees for every species. Heat = effective-shade proxy, not UTCI.</text></svg>