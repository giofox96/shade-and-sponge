<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">The gap</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Rules without numbers, and tools without species or without runoff</text><text x="60" y="200" font-size="20" fill="#663825" font-weight="bold" text-anchor="start">IN PRACTICE</text><rect x="60" y="240" width="720" height="97" rx="10" fill="#663825" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="90" y="274" font-size="22" fill="#2A2622" font-weight="normal" text-anchor="start">Rules for which species: catalogue, sidewalk size, 15%</text><text x="90" y="303" font-size="22" fill="#2A2622" font-weight="normal" text-anchor="start">cap</text><rect x="60" y="357" width="720" height="69" rx="10" fill="#663825" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="90" y="391" font-size="22" fill="#2A2622" font-weight="normal" text-anchor="start">No number for what a choice does to heat or runoff</text><text x="820" y="200" font-size="20" fill="#283F66" font-weight="bold" text-anchor="start">IN RESEARCH</text><rect x="820" y="240" width="720" height="97" rx="10" fill="#283F66" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="850" y="274" font-size="22" fill="#2A2622" font-weight="normal" text-anchor="start">Heat and runoff for fixed scenarios, without species</text><text x="850" y="303" font-size="22" fill="#2A2622" font-weight="normal" text-anchor="start">traits (Mannucci et al. 2025; Wu et al. 2024)</text><rect x="820" y="357" width="720" height="97" rx="10" fill="#283F66" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="850" y="391" font-size="22" fill="#2A2622" font-weight="normal" text-anchor="start">Optimisers for heat only (Shaamala et al. 2025; Peng</text><text x="850" y="420" font-size="22" fill="#2A2622" font-weight="normal" text-anchor="start">et al. 2026)</text><rect x="820" y="474" width="720" height="97" rx="10" fill="#283F66" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="850" y="508" font-size="22" fill="#2A2622" font-weight="normal" text-anchor="start">Trait-based recommender with the runoff module</text><text x="850" y="537" font-size="22" fill="#2A2622" font-weight="normal" text-anchor="start">switched off (SylvCiT; Nicol et al. 2026)</text><rect x="60" y="700" width="1480" height="80" rx="10" fill="#3F663E" fill-opacity="0.1" stroke="none" stroke-width="2"/><text x="90" y="750" font-size="24" fill="#3F663E" font-weight="bold" text-anchor="start">This method: trait-based, inside the city's rules, scored on heat and runoff, per position.</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: notes/topic_decision.md §7, §9.2; notes/lit/literature_matrix.csv.</text></svg>