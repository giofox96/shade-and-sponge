<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">Does the city already decide which tree goes where?</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Yes, on paper. Not with numbers, and not in practice</text><text x="60" y="190" font-size="18" fill="#3F663E" font-weight="bold" text-anchor="start">ON PAPER · Parcs i Jardins 2004 / 2005</text><rect x="60" y="220" width="700" height="78" rx="10" fill="#3F663E" fill-opacity="0.08" stroke="none" stroke-width="2"/><text x="84" y="267" font-size="24" fill="#2A2622" font-weight="bold" text-anchor="start">&lt; 3.5 m</text><text x="250" y="267" font-size="24" fill="#3F663E" font-weight="bold" text-anchor="start">Prunus cerasifera</text><text x="740" y="267" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="end">Nou Barris row</text><rect x="60" y="312" width="700" height="78" rx="10" fill="#3F663E" fill-opacity="0.08" stroke="none" stroke-width="2"/><text x="84" y="359" font-size="24" fill="#2A2622" font-weight="bold" text-anchor="start">3.5 – 6 m</text><text x="250" y="359" font-size="24" fill="#3F663E" font-weight="bold" text-anchor="start">Melia or Jacaranda</text><text x="740" y="359" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="end">Nou Barris row</text><rect x="60" y="404" width="700" height="78" rx="10" fill="#3F663E" fill-opacity="0.08" stroke="none" stroke-width="2"/><text x="84" y="451" font-size="24" fill="#2A2622" font-weight="bold" text-anchor="start">&gt; 6 m</text><text x="250" y="451" font-size="24" fill="#3F663E" font-weight="bold" text-anchor="start">keep the plane</text><text x="740" y="451" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="end">Nou Barris row</text><text x="60" y="535" font-size="20" fill="#2A2622" font-weight="normal" text-anchor="start">Criteria: tolerance, street type, tradition, technicians'</text><text x="60" y="561" font-size="20" fill="#2A2622" font-weight="normal" text-anchor="start">experience.</text><text x="60" y="600" font-size="30" fill="#663825" font-weight="bold" text-anchor="start">No heat. No runoff.</text><text x="60" y="650" font-size="19" fill="#665E4F" font-weight="normal" text-anchor="start">The 2011 guide, still in force, no longer prints the table: only a</text><text x="60" y="675" font-size="19" fill="#665E4F" font-weight="normal" text-anchor="start">species catalogue.</text><text x="860" y="190" font-size="18" fill="#8C6A24" font-weight="bold" text-anchor="start">IN PRACTICE · Porta, trees planted 2007–2026</text><text x="860" y="250" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="start">Narrow sidewalks · 58 trees planted</text><rect x="860" y="270" width="640" height="46" rx="6" fill="#DCD8CE" fill-opacity="1.0" stroke="none" stroke-width="2"/><rect x="860" y="270" width="66" height="46" rx="6" fill="#8C6A24" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="940" y="302" font-size="20" fill="#8C6A24" font-weight="bold" text-anchor="start">10% match the table</text><text x="860" y="400" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="start">Medium sidewalks · 112 trees planted</text><rect x="860" y="420" width="640" height="46" rx="6" fill="#DCD8CE" fill-opacity="1.0" stroke="none" stroke-width="2"/><rect x="860" y="420" width="63" height="46" rx="6" fill="#8C6A24" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="937" y="452" font-size="20" fill="#8C6A24" font-weight="bold" text-anchor="start">10% match the table</text><text x="860" y="560" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="start">Wide sidewalks · 198 trees planted, 11 of them planes</text><text x="860" y="600" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">Rebuilt streets and exceptions follow other lists and cannot be told</text><text x="860" y="622" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">apart in the inventory, so ~90% is an upper bound on non-compliance.</text><rect x="60" y="730" width="1480" height="70" rx="10" fill="#2A2622" fill-opacity="0.05" stroke="none" stroke-width="2"/><text x="84" y="774" font-size="21" fill="#2A2622" font-weight="bold" text-anchor="start">A rule exists, it is qualitative, and it is not visible in practice. Current list: asked the city (email sent 24 Oct).</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: Arbrat viari: selecció d'espècies (Parcs i Jardins 2002, rev. 2004) p. 11; Pla de gestió de l'arbrat viari (2005, rev. 2006) §3.4.3; Gestió de l'arbrat viari (2011) §11; scripts/replacement_rule_check.py;</text><text x="60" y="869" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">notes/tree_master_plan.md §5b.</text></svg>