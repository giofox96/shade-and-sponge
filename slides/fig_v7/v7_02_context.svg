<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">The decision is already taken</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Barcelona is replacing its plane trees, one at a time</text><rect x="60" y="200" width="470" height="300" rx="12" fill="#663825" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="200" width="8" height="300" fill="#663825"/><text x="94" y="278" font-size="52" fill="#663825" font-weight="bold" text-anchor="start">−56%</text><text x="94" y="320" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">Plane trees in ten years: 43,722 trees,</text><text x="94" y="345" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">27.45% of the stock → 12% (press, May</text><text x="94" y="369" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">2026)</text><rect x="565" y="200" width="470" height="300" rx="12" fill="#3F663E" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="565" y="200" width="8" height="300" fill="#3F663E"/><text x="599" y="278" font-size="52" fill="#3F663E" font-weight="bold" text-anchor="start">15% · 30%</text><text x="599" y="320" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">Master plan 2017–2037: no species above</text><text x="599" y="345" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">15%; tree cover up to 30% of the urban</text><text x="599" y="369" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">surface</text><rect x="1070" y="200" width="470" height="300" rx="12" fill="#8C6A24" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="1070" y="200" width="8" height="300" fill="#8C6A24"/><text x="1104" y="278" font-size="52" fill="#8C6A24" font-weight="bold" text-anchor="start">1 by 1</text><text x="1104" y="320" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">Each tree is replaced when it dies or</text><text x="1104" y="345" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">when its street is rebuilt: thousands of</text><text x="1104" y="369" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">decisions</text><text x="60" y="600" font-size="24" fill="#2A2622" font-weight="normal" text-anchor="start">This is the context, not the problem: the city has already decided how much of each species. What follows is</text><text x="60" y="631" font-size="24" fill="#2A2622" font-weight="normal" text-anchor="start">what it has not decided.</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: Nació Digital 4 May 2026 and Betevé 7 May 2026 (press); Arbres per viure, Pla director de l'arbrat 2017–2037, targets 1 and 3; notes/tree_master_plan.md.</text></svg>