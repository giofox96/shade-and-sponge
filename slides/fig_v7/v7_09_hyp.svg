<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">Hypotheses</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Two to test, one declared limit</text><rect x="60" y="200" width="1480" height="160" rx="12" fill="#3F663E" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="200" width="8" height="160" fill="#3F663E"/><text x="100" y="270" font-size="40" fill="#3F663E" font-weight="bold" text-anchor="start">H1</text><text x="340" y="266" font-size="28" fill="#2A2622" font-weight="bold" text-anchor="start">Trait-based layouts beat the city's rule on heat and on runoff</text><text x="340" y="310" font-size="20" fill="#665E4F" font-weight="normal" text-anchor="start">Runoff: a difference below Δmin = 91 m³ is 'not resolved'</text><rect x="60" y="390" width="1480" height="160" rx="12" fill="#8C6A24" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="390" width="8" height="160" fill="#8C6A24"/><text x="100" y="460" font-size="40" fill="#8C6A24" font-weight="bold" text-anchor="start">H2</text><text x="340" y="456" font-size="28" fill="#2A2622" font-weight="bold" text-anchor="start">The heat-best and runoff-best layouts differ in species</text><text x="340" y="500" font-size="20" fill="#665E4F" font-weight="normal" text-anchor="start">Tested on the Pareto front (SQ3)</text><rect x="60" y="580" width="1480" height="160" rx="12" fill="#665E4F" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="580" width="8" height="160" fill="#665E4F"/><text x="100" y="650" font-size="40" fill="#665E4F" font-weight="bold" text-anchor="start">Boundary</text><text x="340" y="646" font-size="28" fill="#2A2622" font-weight="bold" text-anchor="start">At extreme storms, street trees cannot matter</text><text x="340" y="690" font-size="20" fill="#665E4F" font-weight="normal" text-anchor="start">Was H3; true by construction of the model, so declared, not tested</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: notes/topic_decision.md §8, §9.5, §10.5.</text></svg>