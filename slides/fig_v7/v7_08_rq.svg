<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">The research question, scrutinised</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">One main question, four sub-questions, each with a metric</text><rect x="60" y="180" width="1480" height="190" rx="14" fill="#2A2622" fill-opacity="0.05" stroke="none" stroke-width="2"/><text x="90" y="235" font-size="29" fill="#2A2622" font-weight="bold" text-anchor="start">Can a trait-based layout method, inside Barcelona's tree rules, choose replacement species</text><text x="90" y="273" font-size="29" fill="#2A2622" font-weight="bold" text-anchor="start">for plane trees and new planting spots that retain and add more pedestrian cooling and</text><text x="90" y="310" font-size="29" fill="#2A2622" font-weight="bold" text-anchor="start">storm-water interception than the city's own practice?</text><rect x="60" y="410" width="720" height="125" rx="10" fill="#663825" fill-opacity="0.08" stroke="none" stroke-width="2"/><text x="86" y="454" font-size="22" fill="#663825" font-weight="bold" text-anchor="start">SQ1 · heat</text><text x="86" y="490" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">Mean UTCI 12–17 h on a hot design day</text><rect x="820" y="410" width="720" height="125" rx="10" fill="#283F66" fill-opacity="0.08" stroke="none" stroke-width="2"/><text x="846" y="454" font-size="22" fill="#283F66" font-weight="bold" text-anchor="start">SQ2 · runoff</text><text x="846" y="490" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">Total and at flood hotspots, 2-yr 60-min storm; larger than the</text><text x="846" y="515" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">model resolves (Δmin)?</text><rect x="60" y="560" width="720" height="125" rx="10" fill="#8C6A24" fill-opacity="0.08" stroke="none" stroke-width="2"/><text x="86" y="604" font-size="22" fill="#8C6A24" font-weight="bold" text-anchor="start">SQ3 · trade-off</text><text x="86" y="640" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">Do the heat-best and runoff-best layouts differ, and in which</text><text x="86" y="665" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">species?</text><rect x="820" y="560" width="720" height="125" rx="10" fill="#3F663E" fill-opacity="0.08" stroke="none" stroke-width="2"/><text x="846" y="604" font-size="22" fill="#3F663E" font-weight="bold" text-anchor="start">SQ4 · additions</text><text x="846" y="640" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">How much of the gap to 30% can new street trees close, and where?</text><text x="60" y="760" font-size="18" fill="#665E4F" font-weight="normal" text-anchor="start">Changed after scrutiny: 'reduce' → 'retain' (vs the city's rule, today as reference) · additions co-equal · 'not resolved' is an allowed answer</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: notes/topic_decision.md §10.5 (scrutiny table) and §10.6.</text></svg>