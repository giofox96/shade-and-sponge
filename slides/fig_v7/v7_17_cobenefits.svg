<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">Co-benefits not optimised (yet)</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Reported after 10 Nov, not objectives of the tool</text><rect x="60" y="190" width="1480" height="114" rx="12" fill="#8C6A24" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="190" width="8" height="114" fill="#8C6A24"/><text x="100" y="256" font-size="30" fill="#8C6A24" font-weight="bold" text-anchor="start">Pollen</text><text x="390" y="240" font-size="25" fill="#2A2622" font-weight="bold" text-anchor="start">Plane pollen gets the top allergen score (4 of 4) in a Spanish species index</text><text x="390" y="278" font-size="19" fill="#665E4F" font-weight="normal" text-anchor="start">Species index exists (IUGZA, Cariñanos et al. 2014). Replacing planes likely gains here; to compute per layout</text><rect x="60" y="322" width="1480" height="114" rx="12" fill="#2A2622" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="322" width="8" height="114" fill="#2A2622"/><text x="100" y="388" font-size="30" fill="#2A2622" font-weight="bold" text-anchor="start">Carbon</text><text x="390" y="372" font-size="25" fill="#2A2622" font-weight="bold" text-anchor="start">Storage grows steeply with trunk size, and the planes are large</text><text x="390" y="410" font-size="19" fill="#665E4F" font-weight="normal" text-anchor="start">The tool's mix may lose here at first. Urban allometry (McPherson et al. 2016); reported even if it loses</text><rect x="60" y="454" width="1480" height="114" rx="12" fill="#3F663E" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="454" width="8" height="114" fill="#3F663E"/><text x="100" y="520" font-size="30" fill="#3F663E" font-weight="bold" text-anchor="start">Diversity</text><text x="390" y="504" font-size="25" fill="#2A2622" font-weight="bold" text-anchor="start">The 15% cap and the local ceiling already act on it</text><text x="390" y="542" font-size="19" fill="#665E4F" font-weight="normal" text-anchor="start">Already computed (effective species, as in SylvCiT): to report per barri, before and after</text><rect x="60" y="586" width="1480" height="114" rx="12" fill="#665E4F" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="586" width="8" height="114" fill="#665E4F"/><text x="100" y="652" font-size="30" fill="#665E4F" font-weight="bold" text-anchor="start">Ozone · VOC</text><text x="390" y="636" font-size="25" fill="#2A2622" font-weight="bold" text-anchor="start">Some species emit isoprene; ozone also depends on local NOx</text><text x="390" y="674" font-size="19" fill="#665E4F" font-weight="normal" text-anchor="start">Not modelled: a declared limit</text><rect x="60" y="726" width="1480" height="70" rx="10" fill="#2A2622" fill-opacity="0.05" stroke="none" stroke-width="2"/><text x="84" y="770" font-size="21" fill="#2A2622" font-weight="bold" text-anchor="start">The master plan already lists allergies and VOC among the disservices to avoid, with no number per species.</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: Cariñanos, Casares-Porcel &amp; Quesada-Rubio 2014 (Landsc. Urban Plan. 123:134-144), Platanus ap = 4; McPherson, van Doorn &amp; Peper 2016 (PSW-GTR-253); Arbres per viure, Pla director de l'arbrat 2017–2037</text><text x="60" y="869" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">§1.3.4, p. 14; notes/cobenefits_plan.md.</text></svg>