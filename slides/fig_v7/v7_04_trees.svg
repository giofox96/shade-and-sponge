<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">Are there enough trees?</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Not in Porta, and the planes are the largest part of what it has</text><rect x="60" y="300" width="1400" height="90" rx="8" fill="#DCD8CE" fill-opacity="0.5" stroke="none" stroke-width="2"/><rect x="60" y="300" width="230" height="90" rx="8" fill="#663825" fill-opacity="1.0" stroke="none" stroke-width="2"/><rect x="290" y="300" width="574" height="90" rx="0" fill="#3F663E" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="175" y="356" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="middle">planes</text><text x="577" y="356" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="middle">all other canopy</text><line x1="864" y1="270" x2="864" y2="420" stroke="#2A2622" stroke-width="3" stroke-dasharray=""/><text x="864" y="258" font-size="22" fill="#2A2622" font-weight="bold" text-anchor="middle">Porta today 20.1%</text><line x1="1260" y1="270" x2="1260" y2="420" stroke="#3F663E" stroke-width="3" stroke-dasharray="8 5"/><text x="1260" y="258" font-size="22" fill="#3F663E" font-weight="bold" text-anchor="middle">City target 30%</text><text x="1062" y="356" font-size="22" fill="#3F663E" font-weight="bold" text-anchor="middle">−8.3 ha</text><text x="60" y="446" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="middle">0%</text><text x="260" y="446" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="middle">5%</text><text x="460" y="446" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="middle">10%</text><text x="660" y="446" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="middle">15%</text><text x="860" y="446" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="middle">20%</text><text x="1060" y="446" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="middle">25%</text><text x="1260" y="446" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="middle">30%</text><text x="1460" y="446" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="middle">35%</text><rect x="60" y="520" width="700" height="210" rx="12" fill="#663825" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="520" width="8" height="210" fill="#663825"/><text x="94" y="598" font-size="52" fill="#663825" font-weight="bold" text-anchor="start">≈ 29%</text><text x="94" y="640" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">of Porta's canopy is plane trees (5.75% of the area, 832 trees)</text><rect x="840" y="520" width="700" height="210" rx="12" fill="#3F663E" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="840" y="520" width="8" height="210" fill="#3F663E"/><text x="874" y="598" font-size="52" fill="#3F663E" font-weight="bold" text-anchor="start">16% ↔ 20%</text><text x="874" y="640" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">All planes replaced by a Brachychiton-size crown → ~16%; by a</text><text x="874" y="665" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">Tipuana or Jacaranda-size crown → roughly unchanged</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: ICGC LiDAR 26 Sept 2021, canopy = CHM &gt; 2 m (scripts/porta_canopy_cover.py); plan target 1 (30%); crown ratios at equal trunk size, notes/topic_decision.md §9.9 and §10.3.</text></svg>