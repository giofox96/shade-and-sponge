<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">Heat: a first independent check</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">UTCI from Ladybug and Honeybee, today's planes vs the tool's layout</text><text x="60" y="180" font-size="18" fill="#2A2622" font-weight="bold" text-anchor="start">Mean UTCI, 15 July 12–17 h, at 1.1 m on a 2 m grid</text><text x="60" y="252" font-size="18" fill="#2A2622" font-weight="bold" text-anchor="start">Honeybee (Tier 2, Radiance)</text><text x="60" y="270" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">Pg Andreu Nin, 80 trees, porous crowns</text><rect x="400" y="230" width="343" height="30" rx="3" fill="#665E4F" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="751" y="252" font-size="16" fill="#2A2622" font-weight="normal" text-anchor="start">S0 31.35 °C</text><rect x="400" y="270" width="321" height="30" rx="3" fill="#3F663E" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="729" y="292" font-size="16" fill="#2A2622" font-weight="normal" text-anchor="start">S4 31.19 °C</text><text x="940" y="275" font-size="30" fill="#3F663E" font-weight="bold" text-anchor="start">−0.15 °C</text><text x="60" y="402" font-size="18" fill="#2A2622" font-weight="bold" text-anchor="start">Ladybug chain in Python (Tier 1)</text><text x="60" y="420" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">Pg Andreu Nin, porous crowns τ =</text><text x="60" y="440" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">exp(−0.5·LAI)</text><rect x="400" y="380" width="264" height="30" rx="3" fill="#665E4F" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="672" y="402" font-size="16" fill="#2A2622" font-weight="normal" text-anchor="start">S0 30.80 °C</text><rect x="400" y="420" width="236" height="30" rx="3" fill="#3F663E" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="644" y="442" font-size="16" fill="#2A2622" font-weight="normal" text-anchor="start">S4 30.61 °C</text><text x="940" y="425" font-size="30" fill="#3F663E" font-weight="bold" text-anchor="start">−0.19 °C</text><text x="60" y="552" font-size="18" fill="#2A2622" font-weight="bold" text-anchor="start">Ladybug chain in Python (Tier 1)</text><text x="60" y="570" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">all Porta plane streets, 832 trees,</text><text x="60" y="590" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">21,352 points, porous</text><rect x="400" y="530" width="173" height="30" rx="3" fill="#665E4F" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="581" y="552" font-size="16" fill="#2A2622" font-weight="normal" text-anchor="start">S0 30.19 °C</text><rect x="400" y="570" width="159" height="30" rx="3" fill="#3F663E" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="567" y="592" font-size="16" fill="#2A2622" font-weight="normal" text-anchor="start">S4 30.09 °C</text><text x="940" y="575" font-size="30" fill="#3F663E" font-weight="bold" text-anchor="start">−0.10 °C</text><text x="940" y="210" font-size="16" fill="#665E4F" font-weight="bold" text-anchor="start">S4 − S0</text><text x="60" y="700" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">Axis from 29 °C. S0 = today's planes; S4 = the tool's species on the same spots. Weather: TMYx 2011–2025. The</text><text x="60" y="720" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">Python chain reproduces Ladybug in Grasshopper with opaque crowns (mean difference −0.02 °C, r = 0.998; also on</text><text x="60" y="739" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">4,271 Porta points), so it can add light through the crowns.</text><text x="1150" y="230" font-size="36" fill="#3F663E" font-weight="bold" text-anchor="start">r = −0.73</text><text x="1150" y="262" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">the shade proxy vs Ladybug UTCI across points:</text><text x="1150" y="284" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">the proxy ranks points correctly</text><text x="1150" y="380" font-size="36" fill="#3F663E" font-weight="bold" text-anchor="start">r = −0.82</text><text x="1150" y="412" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">on the S4 − S0 change per point (Pg Andreu</text><text x="1150" y="434" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Nin, opaque crowns)</text><text x="1150" y="530" font-size="36" fill="#8C6A24" font-weight="bold" text-anchor="start">≤ 0.2 °C</text><text x="1150" y="562" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">S4 − S0 on average, with a sign that depends</text><text x="1150" y="584" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">on opaque vs porous crowns</text><text x="1150" y="690" font-size="18" fill="#2A2622" font-weight="bold" text-anchor="start">Claim for the tool: for heat, no worse than</text><text x="1150" y="713" font-size="18" fill="#2A2622" font-weight="bold" text-anchor="start">today's planes within model uncertainty.</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: databases/barcelona/hb_utci_andreu_nin.csv, porous_utci_*_epw2011.csv, ladybug_vs_proxy_andreu_nin.csv (scripts/make_hb_model.py, run_hb_utci.py, porous_utci.py, compare_ladybug_proxy.py); Grasshopper runs</text><text x="60" y="869" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">by the author 2 Nov 2026 with mesh crowns (exchange/from_gh/). EPW: Barcelona El Prat TMYx 2011–2025 (climate.onebuilding.org). Porous crowns after Peng et al. 2026. 15 July is an ordinary July day, not the hot</text><text x="60" y="886" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">design day.</text></svg>