<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">Heat: a first independent check</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Ladybug UTCI on Pg Andreu Nin (80 street trees), today vs the tool's layout</text><text x="60" y="180" font-size="18" fill="#2A2622" font-weight="bold" text-anchor="start">Mean UTCI, 1,974 points, 15 July 12–17 h</text><text x="60" y="252" font-size="18" fill="#2A2622" font-weight="bold" text-anchor="start">Ladybug in Grasshopper</text><text x="60" y="278" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">opaque crowns</text><rect x="330" y="230" width="218" height="30" rx="3" fill="#665E4F" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="556" y="252" font-size="16" fill="#2A2622" font-weight="normal" text-anchor="start">S0 27.79 °C</text><rect x="330" y="270" width="342" height="30" rx="3" fill="#3F663E" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="680" y="292" font-size="16" fill="#2A2622" font-weight="normal" text-anchor="start">S4 28.24 °C</text><text x="940" y="275" font-size="30" fill="#663825" font-weight="bold" text-anchor="start">+0.45 °C</text><text x="60" y="402" font-size="18" fill="#2A2622" font-weight="bold" text-anchor="start">Same chain in Python</text><text x="60" y="428" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">opaque crowns</text><rect x="330" y="380"