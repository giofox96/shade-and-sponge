fill="#2A2622" font-weight="normal" text-anchor="start">the shade proxy vs Ladybug UTCI across points:</text><text x="1150" y="284" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">the proxy ranks points correctly</text><text x="1150" y="380" font-size="36" fill="#3F663E" font-weight="bold" text-anchor="start">r = −0.70</text><text x="1150" y="412" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">on the S4 − S0 change per point (opaque</text><text x="1150" y="434" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">crowns)</text><text x="1150" y="530" font-size="36" fill="#8C6A24" font-weight="bold" text-anchor="start">±0.5 °C</text><text x="1150" y="562" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">S4 − S0 on average, with a sign that depends</text><text x="1150" y="584" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">on how crowns are modelled</text><text x="1150" y="690" font-size="18" fill="#2A2622" font-weight="bold" text-anchor="start">Claim for the tool: for heat, no worse than</text><text x="1150" y="713" font-size="18" fill="#2A2622" font-weight="bold" text-anchor="start">today's planes within model uncertainty.</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: databases/barcelona/porous_utci_andreu_nin.csv, ladybug_vs_proxy_andreu_nin.csv (scripts/porous_utci.py, compare_ladybug_proxy.py); Grasshopper run by the author 2 Nov 2026 (exchange/from_gh/). EPW:</text><text x="60" y="869" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Barcelona El Prat TMYx (climate.onebuilding.org). Porous crowns after Peng et al. 2026. 15 July is an ordinary July day, not the hot design day.</text></svg>