<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">Two rules: a city cap and a local ceiling</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">The city's 15% fixes how much of each species; the local ceiling stops any barri ending more concentrated than today</text><rect x="60" y="170" width="620" height="200" rx="12" fill="#3F663E" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="170" width="620" height="6" rx="0" fill="#3F663E" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="84" y="210" font-size="18" fill="#3F663E" font-weight="bold" text-anchor="start">1. CITY CAP: how much of each species</text><text x="84" y="244" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">No species above 15% of the city's street trees (tree master</text><text x="84" y="267" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">plan). The headroom left today is shared across barris pro</text><text x="84" y="291" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">rata to the planes each replaces (ASSUMPTION).</text><rect x="60" y="410" width="620" height="230" rx="12" fill="#8C6A24" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="410" width="620" height="6" rx="0" fill="#8C6A24" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="84" y="450" font-size="18" fill="#8C6A24" font-weight="bold" text-anchor="start">2. LOCAL CEILING: no barri more concentrated than today</text><text x="84" y="484" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">In each barri, no species ends with more trees than the</text><text x="84" y="507" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">barri has planes today. Without it, the city cap alone put</text><text x="84" y="531" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Tipuana at 48.5% of Diagonal Mar's street trees; with it,</text><text x="84" y="554" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">37.2% (17-barri run). It costs little shade.</text><text x="60" y="690" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="start">Limit found: where few planes are replaced the ceiling can leave no</text><text x="60" y="711" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="start">species that fits a position (Baró de Viver, 15 planes; la Trinitat</text><text x="60" y="732" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="start">Vella, 167). These barris need a different ceiling.</text><text x="760" y="180" font-size="18" fill="#2A2622" font-weight="bold" text-anchor="start">Trees planted against each species' cap, all 28 barris</text><text x="760" y="224" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Celtis</text><rect x="960" y="204" width="33" height="26" rx="3" fill="#DCD8CE" fill-opacity="1.0" stroke="none" stroke-width="2"/><rect x="960" y="204" width="33" height="26" rx="3" fill="#663825" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1001" y="224" font-size="15" fill="#663825" font-weight="bold" text-anchor="start">1,318 / 1,318  at cap</text><text x="760" y="294" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Styphnolobium</text><rect x="960" y="274" width="257" height="26" rx="3" fill="#DCD8CE" fill-opacity="1.0" stroke="none" stroke-width="2"/><rect x="960" y="274" width="134" height="26" rx="3" fill="#3F663E" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1225" y="294" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">5,300 / 10,142</text><text x="760" y="364" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Tipuana</text><rect x="960" y="344" width="288" height="26" rx="3" fill="#DCD8CE" fill-opacity="1.0" stroke="none" stroke-width="2"/><rect x="960" y="344" width="288" height="26" rx="3" fill="#663825" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1256" y="364" font-size="15" fill="#663825" font-weight="bold" text-anchor="start">11,348 / 11,348  at cap</text><text x="760" y="434" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Melia</text><rect x="960" y="414" width="295" height="26" rx="3" fill="#DCD8CE" fill-opacity="1.0" stroke="none" stroke-width="2"/><rect x="960" y="414" width="148" height="26" rx="3" fill="#3F663E" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1263" y="434" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">5,851 / 11,642</text><text x="760" y="504" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Brachychiton</text><rect x="960" y="484" width="315" height="26" rx="3" fill="#DCD8CE" fill-opacity="1.0" stroke="none" stroke-width="2"/><rect x="960" y="484" width="31" height="26" rx="3" fill="#3F663E" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1283" y="504" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">1,206 / 12,438</text><text x="760" y="574" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Jacaranda</text><rect x="960" y="554" width="355" height="26" rx="3" fill="#DCD8CE" fill-opacity="1.0" stroke="none" stroke-width="2"/><rect x="960" y="554" width="101" height="26" rx="3" fill="#3F663E" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1323" y="574" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">3,966 / 14,024</text><text x="760" y="644" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Pyrus</text><rect x="960" y="624" width="420" height="26" rx="3" fill="#DCD8CE" fill-opacity="1.0" stroke="none" stroke-width="2"/><rect x="960" y="624" width="66" height="26" rx="3" fill="#3F663E" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1388" y="644" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">2,591 / 16,569</text><text x="760" y="710" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="start">Celtis and Tipuana hit the city cap (Celtis has little headroom left: it is already</text><text x="760" y="731" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="start">common). Within the cap the LP decides which barri gets them.</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: databases/barcelona/citylp_local_summary.csv and citylp_local_species.csv (scripts/city_lp.py --local-ceiling, joint layout S4_s1.00_w0.00_r0.00); outlines: Ajuntament de Barcelona, Open Data BCN (CC BY</text><text x="60" y="869" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">4.0). Heat = effective-shade proxy, not UTCI; city mix = S1a, the city's 2026 replacement mix placed by its sidewalk rule. Cap: floor(15% × 140,404 street trees) minus each species today, pro rata to 31,580 of</text><text x="60" y="886" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">40,137 city planes.</text></svg>