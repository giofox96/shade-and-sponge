50" y="532" font-size="16" fill="#2A2622" font-weight="bold" text-anchor="middle">Verdict per hypothesis</text><text x="800" y="830" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="middle">Thresholds are fixed before the runs: a difference below what the model resolves is reported as "not resolved".</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: notes/methodology.md §4b, §5; notes/decisions/hypothesis_tests.md; notes/citywide_plan.md §3–4.</text></svg>