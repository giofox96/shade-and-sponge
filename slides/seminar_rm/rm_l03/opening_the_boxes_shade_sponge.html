/* Layout: a reasoning network. Two branches from the big topic meet in one idea, narrow to the gap and the question, then loop back up */
:root {

}
:root { color-scheme: light; }

body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.4;

header { max-width: 1240px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 32px; }

.lede { margin: 6px 0 0; font-size: 24px; font-weight: 600; line-height: 1.2; text-wrap: balance; max-width: 32ch; }

.scroll { overflow-x: auto; max-width: 1240px; margin: 0 auto; }

path.e { fill: none; stroke: var(--line); stroke-width: 2; }
path.warn { fill: none; stroke: var(--pink); stroke-width: 2; stroke-dasharray: 7 6; }
path.gap { fill: none; stroke: var(--pink); stroke-width: 2.5; }
path.loop { fill: none; stroke: var(--cyan); stroke-width: 2.5; stroke-dasharray: 2 6; stroke-linecap: round; }
.m-e { fill: var(--line); } .m-warn { fill: var(--pink); } .m-loop { fill: var(--cyan); }

.n { box-sizing: border-box; width: 100%; height: 100%; padding: 12px 16px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; gap: 4px; font-family: var(--sans); color: var(--ink); overflow: hidden; }
.n .k { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.n .t { font-size: 17px; font-weight: 600; line-height: 1.25; }
.n .r { font-size: 12px; font-style: italic; color: var(--muted); }
.n .no { font-size: 14px; font-weight: 600; color: var(--pink); }
.topic { text-align: center; align-items: center; }
.topic .big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }
.ev { background: var(--card); border: 1px solid var(--line); }
.ins { background: var(--card); border: 2px solid var(--ink); }
.opt { background: var(--amber-tint); }
.opt .k { color: var(--amber); }
.prob { background: var(--pink-tint); }
.prob .k { color: var(--pink); }
.tg { background: var(--tree-tint); border-radius: 60px; padding-inline: 26px; }
.tg .k { color: var(--tree); }
.idea { background: var(--card); border: 2px dashed var(--tree); }
.idea .k { color: var(--tree); }
.idea .t { font-size: 19px; }
.gap { background: var(--card); border: 2.5px dashed var(--pink); }
.gap .k { color: var(--pink); }
.gap .f { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
.gap .f b { font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
.gap .f b.z { color: var(--pink); }
.rq { background: var(--core); color: var(--core-ink); border-radius: 14px; }
.rq .k { color: #B3BAB9; }
.rq .t { font-size: 21px; }
.h { background: var(--card); border: 1px solid var(--line); border-radius: 999px; text-align: center; align-items: center; font-size: 15px; padding: 8px 22px; }
.h b { color: var(--cyan); }
.case { background: var(--card); border: 1.5px solid var(--cyan); }
.case .k { color: var(--cyan); }
.step { background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; flex-direction: row; align-items: center; justify-content: center; gap: 8px; font-size: 15px; color: var(--body); }
.step b { font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
.step.zero { border: 2px dashed var(--pink); }
.step.zero b { color: var(--pink); }
.why { background: var(--pink-tint); border: 1px solid var(--pink); }
.why .k { color: var(--pink); }
.why ul { margin: 2px 0 0; padding-left: 16px; font-size: 12.5px; line-height: 1.3; color: var(--body); display: flex; flex-direction: column; gap: 1px; }
.why b { color: var(--ink); }
.case ul { margin: 2px 0 0; padding-left: 18px; font-size: 14px; color: var(--body); display: flex; flex-direction: column; gap: 2px; }

.lab { display: flex; justify-content: center; align-items: center; height: 100%; font-family: var(--sans); }
.lab span { background: var(--bg); padding: 3px 10px; border-radius: 999px; font-size: 13px; font-style: italic; color: var(--ink); border: 1px dashed var(--line); white-space: nowrap; }
.lab-warn span { color: var(--pink); border-color: var(--pink); }
.lab-loop span { color: var(--cyan); border-color: var(--cyan); font-style: normal; font-weight: 600; white-space: normal; text-align: center; max-width: 185px; }
.foot { max-width: 1240px; margin: 14px auto 0; font-size: 14px; color: var(--muted); }
</style>
