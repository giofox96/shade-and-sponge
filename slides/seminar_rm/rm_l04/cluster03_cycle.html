<circle cx="900" cy="640" r="112" fill="#1f2a30"/><foreignObject x="40" y="20" width="1100" height="52"><div class="title" style="">Cluster 03 – Data-driven decision making</div></foreignObject>
<foreignObject x="40" y="72" width="1100" height="26"><div class="sub" style="">Elena’s six steps as one cycle · each of us enters at a different step · shared themes on the edges</div></foreignObject>
<foreignObject x="40" y="110" width="400" height="122"><div class="plain" style=""><div class="k">In plain words</div>Someone has to choose between options: a tree, a route, a planting. Data predicts what each option does before it exists, but data does not say which result is better: the model does. <b>Cities decide with data, but what counts as “correct” is a choice.</b> <span class="src">(Jaton 2021)</span></div></foreignObject>
<foreignObject x="800" y="575" width="200" height="130"><div class="centre" style=""><div class="cs0">DATA-DRIVEN DECISION</div>WHICH NUMBER DECIDES?<div class="cs">usually: one average person, one target</div></div></foreignObject>
<foreignObject x="765.0" y="293.0" width="270" height="124"><div class="step" style=""><div class="nt">01 Define</div><div class="lens">what counts as correct? · who is it for?</div><div class="li"><span class="d" style="background:#3fb1d8"></span>anticipated sensory comfort, from a photo</div><div class="li"><span class="d" style="background:#f0a500"></span>what the rules allow</div><div class="li"><span class="d" style="background:#e2466a"></span>better than today, for the water it costs</div></div></foreignObject>
<foreignObject x="790.0" y="175.0" width="220" height="44"><div class="q" style=""><span class="qm">?</span> Could the people affected redefine what counts as correct?</div></foreignObject>
<foreignObject x="1059.448637286709" y="435.5" width="270" height="124"><div class="step" style=""><div class="nt">02 Collect data</div><div class="lens">whose data, how much? · at what grain?</div><div class="li"><span class="d" style="background:#3fb1d8"></span>30–40 people, 20 photos</div><div class="li"><span class="d" style="background:#f0a500"></span>every street tree: inventory + LiDAR</div><div class="li"><span class="d" style="background:#e2466a"></span>a few points, 10:00–15:00</div></div></foreignObject>
<foreignObject x="1234.448637286709" y="407.5" width="220" height="44"><div class="q" style=""><span class="qm">?</span> Who is missing: night, winter, people who stay home?</div></foreignObject>
<foreignObject x="1059.448637286709" y="720.5" width="270" height="124"><div class="step" style=""><div class="nt">03 Clean and prepare</div><div class="lens">which features stand in? · what is lost?</div><div class="li"><span class="d" style="background:#3fb1d8"></span>16 visible elements per sense</div><div class="li"><span class="d" style="background:#f0a500"></span>crown size, leaf area</div><div class="li"><span class="d" style="background:#e2466a"></span>47 native plants audited</div></div></foreignObject>
<foreignObject x="1234.448637286709" y="842.5" width="220" height="44"><div class="q" style=""><span class="qm">?</span> What is dropped as noise, and who calls it noise?</div></foreignObject>
<foreignObject x="765.0" y="863.0" width="270" height="124"><div class="step" style=""><div class="nt">04 Analyse</div><div class="lens">which model, for whom? · checked against?</div><div class="li"><span class="d" style="background:#3fb1d8"></span>a vision-language persona</div><div class="li"><span class="d" style="background:#f0a500"></span>shade × leaf area; runoff</div><div class="li"><span class="d" style="background:#e2466a"></span>UTCI: vegetation vs water</div></div></foreignObject>
<foreignObject x="790.0" y="1030.0" width="220" height="44"><div class="q" style=""><span class="qm">?</span> Can a model of averages stand in for one person or one site?</div></foreignObject>
<foreignObject x="470.5513627132908" y="720.5" width="270" height="124"><div class="step" style="border:2.5px solid #6b4fc8"><div class="nt">05 Decide</div><div class="lens">which number wins? · who decides?</div><div class="li"><span class="d" style="background:#3fb1d8"></span>a personal comfort score</div><div class="li"><span class="d" style="background:#f0a500"></span>UTCI; runoff must not worsen</div><div class="li"><span class="d" style="background:#e2466a"></span>UTCI next to litres</div></div></foreignObject>
<foreignObject x="345.5513627132908" y="842.5" width="220" height="44"><div class="q" style=""><span class="qm">?</span> When comfort and water disagree, who weighs them?</div></foreignObject>
<foreignObject x="470.5513627132909" y="435.5" width="270" height="124"><div class="step" style=""><div class="nt">06 Act</div><div class="lens">what does a decider see? · better than what?</div><div class="li"><span class="d" style="background:#3fb1d8"></span>a personal map of routes</div><div class="li"><span class="d" style="background:#f0a500"></span>a species for each tree to replace</div><div class="li"><span class="d" style="background:#e2466a"></span>comfort and water per scenario</div></div></foreignObject>
<foreignObject x="345.5513627132909" y="407.5" width="220" height="44"><div class="q" style=""><span class="qm">?</span> After building, does anyone check the prediction held?</div></foreignObject>
<foreignObject x="570" y="390" width="150" height="40"><div class="ll" style="">evaluate and learn: back to Define</div></foreignObject>
<foreignObject x="180" y="248" width="300" height="104"><div class="pair" style=""><div class="bar" style="background:linear-gradient(90deg,#3fb1d8 0.0% 50.0%,#f0a500 50.0% 100.0%)"></div><div class="nt">The average vs the single case</div><div class="li"><span class="d" style="background:#3fb1d8"></span>personas from labels → each person</div><div class="li"><span class="d" style="background:#f0a500"></span>a city table → each tree position</div><div class="li"><span class="d" style="background:#3fb1d8"></span><span class="d" style="background:#f0a500"></span>the same UTCI engine: Infrared.city</div></div></foreignObject>
<foreignObject x="180" y="958" width="300" height="104"><div class="pair" style=""><div class="bar" style="background:linear-gradient(90deg,#3fb1d8 0.0% 50.0%,#e2466a 50.0% 100.0%)"></div><div class="nt">“Cooler” ≠ “more comfortable”</div><div class="li"><span class="d" style="background:#3fb1d8"></span>perceived comfort</div><div class="li"><span class="d" style="background:#e2466a"></span>thermal comfort, not air temperature</div></div></foreignObject>
<foreignObject x="1440" y="368" width="300" height="104"><div class="pair" style=""><div class="bar" style="background:linear-gradient(90deg,#f0a500 0.0% 50.0%,#e2466a 50.0% 100.0%)"></div><div class="nt">Same index, same points, same hours</div><div class="li"><span class="d" style="background:#f0a500"></span>UTCI, scenarios S0–S4</div><div class="li"><span class="d" style="background:#e2466a"></span>UTCI, scenarios E0–E3</div></div></foreignObject>
<foreignObject x="1440" y="513" width="300" height="104"><div class="pair" style=""><div class="bar" style="background:linear-gradient(90deg,#f0a500 0.0% 50.0%,#e2466a 50.0% 100.0%)"></div><div class="nt">Water: kept or spent?</div><div class="li"><span class="d" style="background:#f0a500"></span>runoff held back by crowns</div><div class="li"><span class="d" style="background:#e2466a"></span>litres per season</div></div></foreignObject>
<foreignObject x="1440" y="658" width="300" height="104"><div class="pair" style=""><div class="bar" style="background:linear-gradient(90deg,#f0a500 0.0% 50.0%,#e2466a 50.0% 100.0%)"></div><div class="nt">A limit declared in advance</div><div class="li"><span class="d" style="background:#f0a500"></span>gain shrinks as storms grow</div><div class="li"><span class="d" style="background:#e2466a"></span>humidity can cancel the cooling</div></div></foreignObject>
<foreignObject x="40" y="555" width="330" height="215"><div class="topic" style="border-top:5px solid #3fb1d8"><div class="tn" style="color:#3fb1d8">ELENA · enters at 01 Define</div><div class="tt">How will a place feel to my senses?</div><div class="tp">optimal against the individual</div><div class="tg"><b>Empirical gap</b> no test of whether a persona matches one person’s own sensory comfort ratings of public space</div></div></foreignObject>
<foreignObject x="1440" y="110" width="330" height="240"><div class="topic" style="border-top:5px solid #f0a500"><div class="tn" style="color:#c98a00">GIOVANNI · enters at 06 Act</div><div class="tt">Which tree replaces which tree, when a project must replace trees?</div><div class="tp">optimal against the rules · validated case: the plane tree (Platanus)</div><div class="tg"><b>Methodological gap</b> no method picks species per tree position on heat and runoff together, inside a city’s replacement rules · runoff: do not worsen</div></div></foreignObject>
<foreignObject x="1440" y="950" width="330" height="225"><div class="topic" style="border-top:5px solid #e2466a"><div class="tn" style="color:#e2466a">DAVID · enters at 05 Decide</div><div class="tt">Does water add walking comfort, for the water it costs?</div><div class="tp">optimal against the water the site has · Tobia, Colombia</div><div class="tg"><b>Empirical gap</b> nobody tests the same native planting with and without water, with UTCI and litres</div></div></foreignObject>
<foreignObject x="40" y="1200" width="1730" height="82"><div class="strip" style=""><div class="k">Evaluate and learn · what each gives back</div><div class="row"><span style="border-color:#3fb1d8"><b>Elena</b> “Rate this place” feeds the persona; participants check the findings</span><span style="border-color:#f0a500"><b>Giovanni</b> the city’s rule-following replacement becomes the baseline; the cost of the 15% cap</span><span style="border-color:#e2466a"><b>David</b> a seasonal water budget next to every cooling claim</span></div></div></foreignObject></svg></body></html>
