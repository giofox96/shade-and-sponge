<foreignObject x="40" y="78" width="1000" height="28"><div class="sub" style="">Shared themes in the middle, pairs on the edges, each topic outside · Elena · Giovanni · David</div></foreignObject>
<foreignObject x="40" y="120" width="400" height="118"><div class="plain" style=""><div class="k">In plain words</div>Someone chooses between options. Data predicts what each option does before it exists; the model decides which result counts as better. <b>“What makes it correct is a model decision.”</b> <span class="src">(Iacopo, RM_L04)</span></div></foreignObject>
<foreignObject x="800" y="585" width="200" height="110"><div class="centre" style="">DATA-DRIVEN<br>DECISION<br>MAKING<div class="cs">what counts as “better”?</div></div></foreignObject>
<foreignObject x="772" y="321" width="256" height="108"><div class="inner" style=""><div class="nt">Comfort in public space</div><div class="li"><span class="d" style="background:#3fb1d8"></span>how one person feels in a place</div><div class="li"><span class="d" style="background:#f0a500"></span>shade to walk in, a dry street</div><div class="li"><span class="d" style="background:#e2466a"></span>thermal comfort outdoors</div></div></foreignObject>
<foreignObject x="502" y="451" width="256" height="108"><div class="inner" style=""><div class="nt">Predict before building</div><div class="li"><span class="d" style="background:#3fb1d8"></span>photo ratings</div><div class="li"><span class="d" style="background:#f0a500"></span>shade proxy + runoff model</div><div class="li"><span class="d" style="background:#e2466a"></span>UTCI simulation</div></div></foreignObject>
<foreignObject x="502" y="721" width="256" height="108"><div class="inner" style=""><div class="nt">Check against reality</div><div class="li"><span class="d" style="background:#3fb1d8"></span>participants’ ratings</div><div class="li"><span class="d" style="background:#f0a500"></span>measured rain interception</div><div class="li"><span class="d" style="background:#e2466a"></span>measured air temp., humidity, wind</div></div></foreignObject>
<foreignObject x="772" y="851" width="256" height="108"><div class="inner" style=""><div class="nt">Beat the simple rule</div><div class="li"><span class="d" style="background:#3fb1d8"></span>a group average</div><div class="li"><span class="d" style="background:#f0a500"></span>the city’s replacement rule</div><div class="li"><span class="d" style="background:#e2466a"></span>today’s conditions</div></div></foreignObject>
<foreignObject x="1042" y="721" width="256" height="108"><div class="inner" style=""><div class="nt">What is left out?</div><div class="li"><span class="d" style="background:#3fb1d8"></span>senses a photo cannot carry</div><div class="li"><span class="d" style="background:#f0a500"></span>roots, tree pit, hot nights</div><div class="li"><span class="d" style="background:#e2466a"></span>one value per scenario</div></div></foreignObject>
<foreignObject x="1042" y="451" width="256" height="108"><div class="inner" style=""><div class="nt">A tool for those who decide</div><div class="li"><span class="d" style="background:#3fb1d8"></span>web app for sensory needs</div><div class="li"><span class="d" style="background:#f0a500"></span>Grasshopper + web app</div><div class="li"><span class="d" style="background:#e2466a"></span>QGIS + Python workflow</div></div></foreignObject>
