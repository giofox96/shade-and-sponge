<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">Where new trees go</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Free spots from the sidewalk geometry and the city's rules; then the same solver picks the species</text><text x="230" y="185" font-size="17" fill="#665E4F" font-weight="bold" text-anchor="middle">MEASURE THE SIDEWALK</text><text x="620" y="185" font-size="17" fill="#665E4F" font-weight="bold" text-anchor="middle">STREET-TREE GUIDE</text><text x="1000" y="185" font-size="17" fill="#665E4F" font-weight="bold" text-anchor="middle">CLEAR OF STREET OBJECTS</text><text x="1370" y="185" font-size="17" fill="#665E4F" font-weight="bold" text-anchor="middle">SPECIES</text><rect x="90" y="250" width="280" height="70" rx="2" fill="#DCD8CE" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="230" y="292" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">building</text><rect x="90" y="320" width="280" height="90" rx="0" fill="#FFFFFF" fill-opacity="1.0" stroke="none" stroke-width="2"/><line x1="90" y1="410" x2="370" y2="410" stroke="#2A2622" stroke-width="3"/><text x="366" y="432" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="end">kerb</text><text x="230" y="470" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">road</text><line x1="105" y1="322" x2="105" y2="404" stroke="#283F66" stroke-width="1.2" stroke-opacity="0.6"/><line x1="127" y1="322" x2="127" y2="404" stroke="#283F66" stroke-width="1.2" stroke-opacity="0.6"/><line x1="149" y1="322" x2="149" y2="404" stroke="#283F66" stroke-width="1.2" stroke-opacity="0.6"/><line x1="171" y1="322" x2="171" y2="404" stroke="#283F66" stroke-width="1.2" stroke-opacity="0.6"/><line x1="193" y1="322" x2="193" y2="404" stroke="#283F66" stroke-width="1.2" stroke-opacity="0.6"/><line x1="215" y1="322" x2="215" y2="404" stroke="#283F66" stroke-width="1.2" stroke-opacity="0.6"/><line x1="237" y1="322" x2="237" y2="404" stroke="#283F66" stroke-width="1.2" stroke-opacity="0.6"/><line x1="259" y1="322" x2="259" y2="404" stroke="#283F66" stroke-width="1.2" stroke-opacity="0.6"/><line x1="281" y1="322" x2="281" y2="404" stroke="#283F66" stroke-width="1.2" stroke-opacity="0.6"/><line x1="303" y1="322" x2="303" y2="404" stroke="#283F66" stroke-width="1.2" stroke-opacity="0.6"/><line x1="325" y1="322" x2="325" y2="404" stroke="#283F66" stroke-width="1.2" stroke-opacity="0.6"/><line x1="347" y1="322" x2="347" y2="404" stroke="#283F66" stroke-width="1.2" stroke-opacity="0.6"/><line x1="369" y1="322" x2="369" y2="404" stroke="#283F66" stroke-width="1.2" stroke-opacity="0.6"/><text x="82" y="370" font-size="18" fill="#283F66" font-weight="bold" text-anchor="end">w</text><circle cx="125" cy="392" r="13" fill="#3F663E"/><circle cx="315" cy="392" r="13" fill="#3F663E"/><circle cx="190" cy="392" r="13" fill="#FFFFFF" stroke="#3F663E" stroke-width="2.5" stroke-dasharray="4 3"/><circle cx="250" cy="392" r="13" fill="#FFFFFF" stroke="#3F663E" stroke-width="2.5" stroke-dasharray="4 3"/><circle cx="110" cy="530" r="9" fill="#3F663E"/><text x="126" y="535" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">existing tree</text><circle cx="250" cy="530" r="9" fill="#FFFFFF" stroke="#3F663E" stroke-width="2.5" stroke-dasharray="4 3"/><text x="266" y="535" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">free spot</text><text x="230" y="590" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">A ray every 2 m from each façade</text><text x="230" y="610" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">to the kerb gives the sidewalk width;</text><text x="230" y="630" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">the spot sits 0.7 m in from the kerb</text><rect x="470" y="265" width="300" height="70" rx="10" fill="#F2F0EA" fill-opacity="1.0" stroke="#8C6A24" stroke-width="2"/><text x="620" y="296" font-size="16" fill="#8C6A24" font-weight="bold" text-anchor="middle">Sidewalk ≥ 2.5 m</text><text x="620" y="317" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="middle">narrower: no tree</text><rect x="470" y="370" width="300" height="70" rx="10" fill="#F2F0EA" fill-opacity="1.0" stroke="#3F663E" stroke-width="2"/><text x="620" y="401" font-size="16" fill="#3F663E" font-weight="bold" text-anchor="middle">Size class by width</text><text x="620" y="422" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="middle">&lt; 3.5 small · 3.5–6 medium · &gt; 6 large</text><rect x="470" y="475" width="300" height="70" rx="10" fill="#F2F0EA" fill-opacity="1.0" stroke="#3F663E" stroke-width="2"/><text x="620" y="506" font-size="16" fill="#3F663E" font-weight="bold" text-anchor="middle">Spacing 7 / 9 / 13 m</text><text x="620" y="527" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="middle">by class, from every tree and spot</text><text x="620" y="640" font-size="22" fill="#2A2622" font-weight="bold" text-anchor="middle">267 spots</text><rect x="845" y="248" width="310" height="64" rx="10" fill="#F2F0EA" fill-opacity="1.0" stroke="#663825" stroke-width="2"/><text x="1000" y="276" font-size="16" fill="#663825" font-weight="bold" text-anchor="middle">Crossings, signals, signs</text><text x="1000" y="297" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="middle">3 m</text><rect x="845" y="336" width="310" height="64" rx="10" fill="#F2F0EA" fill-opacity="1.0" stroke="#663825" stroke-width="2"/><text x="1000" y="364" font-size="16" fill="#663825" font-weight="bold" text-anchor="middle">Lamps</text><text x="1000" y="385" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="middle">half the guide: 1.5 / 2.25 / 3.25 m</text><rect x="845" y="424" width="310" height="64" rx="10" fill="#F2F0EA" fill-opacity="1.0" stroke="#663825" stroke-width="2"/><text x="1000" y="452" font-size="16" fill="#663825" font-weight="bold" text-anchor="middle">Bus stops · garage entrances</text><text x="1000" y="473" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="middle">8 m · 3 m</text><rect x="845" y="512" width="310" height="64" rx="10" fill="#F2F0EA" fill-opacity="1.0" stroke="#663825" stroke-width="2"/><text x="1000" y="540" font-size="16" fill="#663825" font-weight="bold" text-anchor="middle">Bollards, benches, fountains</text><text x="1000" y="561" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="middle">1 m</text><text x="1000" y="640" font-size="22" fill="#2A2622" font-weight="bold" text-anchor="middle">267 → 232 → 152 spots</text><text x="1000" y="664" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="middle">OSM, then the city's own object data</text><text x="1000" y="686" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="middle">Guide: signals, signs, lamp distance. Others: declared assumptions</text><rect x="1220" y="298" width="300" height="64" rx="6" fill="#2A2622" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1370" y="327" font-size="17" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Same solver as replacements</text><text x="1370" y="347" font-size="13" fill="#FFFFFF" font-weight="normal" text-anchor="middle">HiGHS · one species per spot</text><text x="1370" y="405" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">Score: summer shade, winter sun,</text><text x="1370" y="429" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">water kept from flood hotspots</text><text x="1370" y="463" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">Only species that fit the size class</text><text x="1370" y="487" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">15% cap on the larger stock</text><text x="1370" y="560" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="middle">Porta: 152 spots</text><text x="1370" y="586" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">82 small · 23 medium · 47 large</text><path d="M385,380 C425,380 425,380 465,380" fill="none" stroke="#665E4F" stroke-width="1.8" marker-end="url(#arr)"/><path d="M775,380 C808,380 808,380 840,380" fill="none" stroke="#665E4F" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1160,380 C1188,380 1188,380 1215,380" fill="none" stroke="#665E4F" stroke-width="1.8" marker-end="url(#arr)"/><rect x="90" y="700" width="1420" height="100" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="120" y="735" font-size="16" fill="#2A2622" font-weight="bold" text-anchor="start">Criterion:</text><text x="220" y="735" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="start">a spot is wherever the city's own guide allows a tree today. The tool does not rank spots: it fills each one</text><text x="220" y="760" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="start">with the species that scores best there. Upper bound: driveways and underground services are not in the data.</text><text x="120" y="788" font-size="16" fill="#2A2622" font-weight="bold" text-anchor="start">Porta, replace + add: 101.7% of today's summer shade (city rule + add: 90.1%) · every spot planted: +0.4 points of canopy</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: Ajuntament de Barcelona: Gestió de l'arbrat viari de Barcelona (2011), Mapa base topogràfic 1:1000, Open Data BCN street-object inventories; OpenStreetMap contributors (ODbL); HiGHS (Huangfu &amp; Hall 2018).</text></svg>