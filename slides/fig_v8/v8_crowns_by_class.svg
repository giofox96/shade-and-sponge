<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">Why it matters: the crowns differ</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Crown area as a share of a plane's, same trunk size</text><line x1="480" y1="170" x2="480" y2="690" stroke="#DCD8CE" stroke-width="1"/><text x="480" y="715" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="middle">0%</text><line x1="685" y1="170" x2="685" y2="690" stroke="#DCD8CE" stroke-width="1"/><text x="685" y="715" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="middle">25%</text><line x1="890" y1="170" x2="890" y2="690" stroke="#DCD8CE" stroke-width="1"/><text x="890" y="715" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="middle">50%</text><line x1="1095" y1="170" x2="1095" y2="690" stroke="#DCD8CE" stroke-width="1"/><text x="1095" y="715" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="middle">75%</text><line x1="1300" y1="170" x2="1300" y2="690" stroke="#DCD8CE" stroke-width="1"/><text x="1300" y="715" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="middle">100%</text><line x1="1300" y1="170" x2="1300" y2="690" stroke="#2A2622" stroke-width="2" stroke-dasharray="6 4"/><text x="60" y="208" font-size="22" fill="#2A2622" font-weight="bold" text-anchor="start" font-style="italic">Platanus × acerifolia</text><text x="60" y="232" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">plane (reference)</text><rect x="480" y="184" width="820" height="15" rx="4" fill="#2A2622" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="1314" y="197" font-size="14" fill="#2A2622" font-weight="bold" text-anchor="start">100%  (n = 326)</text><rect x="480" y="202" width="820" height="15" rx="4" fill="#2A2622" fill-opacity="0.35" stroke="none" stroke-width="2"/><text x="1314" y="215" font-size="14" fill="#2A2622" font-weight="normal" text-anchor="start">100%  (n = 341)</text><text x="60" y="280" font-size="22" fill="#3F663E" font-weight="bold" text-anchor="start" font-style="italic">Tipuana tipu</text><rect x="480" y="256" width="877" height="15" rx="4" fill="#3F663E" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="1371" y="269" font-size="14" fill="#3F663E" font-weight="bold" text-anchor="start">107%  (n = 62)</text><rect x="480" y="274" width="746" height="15" rx="4" fill="#3F663E" fill-opacity="0.35" stroke="none" stroke-width="2"/><text x="1314" y="287" font-size="14" fill="#3F663E" font-weight="normal" text-anchor="start">91%  (n = 58)</text><text x="60" y="352" font-size="22" fill="#3F663E" font-weight="bold" text-anchor="start" font-style="italic">Jacaranda mimosifolia</text><rect x="480" y="328" width="730" height="15" rx="4" fill="#3F663E" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="1314" y="341" font-size="14" fill="#3F663E" font-weight="bold" text-anchor="start">89%  (n = 73)</text><rect x="480" y="346" width="787" height="15" rx="4" fill="#3F663E" fill-opacity="0.35" stroke="none" stroke-width="2"/><text x="1314" y="359" font-size="14" fill="#3F663E" font-weight="normal" text-anchor="start">96%  (n = 55)</text><text x="60" y="424" font-size="22" fill="#3F663E" font-weight="bold" text-anchor="start" font-style="italic">Melia azedarach</text><rect x="480" y="400" width="582" height="15" rx="4" fill="#3F663E" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="1072" y="413" font-size="14" fill="#3F663E" font-weight="bold" text-anchor="start">71%  (n = 33)</text><rect x="480" y="418" width="664" height="15" rx="4" fill="#3F663E" fill-opacity="0.35" stroke="none" stroke-width="2"/><text x="1154" y="431" font-size="14" fill="#3F663E" font-weight="normal" text-anchor="start">81%  (n = 70)</text><text x="60" y="496" font-size="22" fill="#3F663E" font-weight="bold" text-anchor="start" font-style="italic">Celtis australis</text><rect x="480" y="472" width="262" height="15" rx="4" fill="#3F663E" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="752" y="485" font-size="14" fill="#3F663E" font-weight="bold" text-anchor="start">32%  (n = 149)</text><rect x="480" y="490" width="426" height="15" rx="4" fill="#3F663E" fill-opacity="0.35" stroke="none" stroke-width="2"/><text x="916" y="503" font-size="14" fill="#3F663E" font-weight="normal" text-anchor="start">52%  (n = 79)</text><text x="60" y="568" font-size="22" fill="#3F663E" font-weight="bold" text-anchor="start" font-style="italic">Pyrus calleryana</text><rect x="480" y="544" width="287" height="15" rx="4" fill="#3F663E" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="777" y="557" font-size="14" fill="#3F663E" font-weight="bold" text-anchor="start">35%  (n = 48)</text><text x="60" y="640" font-size="22" fill="#3F663E" font-weight="bold" text-anchor="start" font-style="italic">Brachychiton populneus</text><rect x="480" y="616" width="197" height="15" rx="4" fill="#3F663E" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="687" y="629" font-size="14" fill="#3F663E" font-weight="bold" text-anchor="start">24%  (n = 55)</text><rect x="480" y="634" width="221" height="15" rx="4" fill="#3F663E" fill-opacity="0.35" stroke="none" stroke-width="2"/><text x="711" y="647" font-size="14" fill="#3F663E" font-weight="normal" text-anchor="start">27%  (n = 25)</text><rect x="1150" y="120" width="30" height="14" rx="3" fill="#3F663E" fill-opacity="0.85" stroke="none" stroke-width="2"/><text x="1190" y="133" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">41–80 cm trunk perimeter (young)</text><rect x="1150" y="145" width="30" height="14" rx="3" fill="#3F663E" fill-opacity="0.35" stroke="none" stroke-width="2"/><text x="1190" y="158" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">81–110 cm (established)</text><text x="60" y="760" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">Crown area as a share of a plane's of the same trunk class, as the trees stand in Porta (LiDAR 2021); n = trees measured. Equal trunk size is not equal age, and</text><text x="60" y="782" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">street trees are pruned: this is not mature potential.</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: ICGC, LiDAR flight of 26 Sept 2021; Ajuntament de Barcelona, arbrat viari (trunk class).</text></svg>