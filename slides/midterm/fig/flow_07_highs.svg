<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">HiGHS: the solver that picks every species</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">One exact solve: the best layout that obeys every rule, and a proof that no other layout scores higher</text><text x="230" y="185" font-size="17" fill="#665E4F" font-weight="bold" text-anchor="middle">SCORE TABLE</text><text x="620" y="185" font-size="17" fill="#665E4F" font-weight="bold" text-anchor="middle">CITY RULES</text><text x="960" y="185" font-size="17" fill="#665E4F" font-weight="bold" text-anchor="middle">EXACT SOLVER</text><text x="1340" y="185" font-size="17" fill="#665E4F" font-weight="bold" text-anchor="middle">ANSWER</text><text x="211" y="278" font-size="17" fill="#3F663E" font-weight="bold" text-anchor="middle">A</text><text x="273" y="278" font-size="17" fill="#8C6A24" font-weight="bold" text-anchor="middle">B</text><text x="335" y="278" font-size="17" fill="#283F66" font-weight="bold" text-anchor="middle">C</text><text x="110" y="323" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">1</text><text x="128" y="323" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">wide</text><rect x="183" y="293" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#3F663E" stroke-width="2"/><text x="211" y="323" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.9</text><rect x="245" y="293" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#8C6A24" stroke-width="2"/><text x="273" y="323" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.6</text><rect x="307" y="293" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#283F66" stroke-width="2"/><text x="335" y="323" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.3</text><text x="110" y="375" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">2</text><text x="128" y="375" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">wide</text><rect x="183" y="345" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#3F663E" stroke-width="2"/><text x="211" y="375" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.8</text><rect x="245" y="345" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#8C6A24" stroke-width="2"/><text x="273" y="375" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.7</text><rect x="307" y="345" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#283F66" stroke-width="2"/><text x="335" y="375" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.3</text><text x="110" y="427" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">3</text><text x="128" y="427" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">wide</text><rect x="183" y="397" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#3F663E" stroke-width="2"/><text x="211" y="427" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.7</text><rect x="245" y="397" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#8C6A24" stroke-width="2"/><text x="273" y="427" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.4</text><rect x="307" y="397" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#283F66" stroke-width="2"/><text x="335" y="427" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.2</text><text x="110" y="479" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">4</text><text x="128" y="479" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">medium</text><rect x="183" y="449" width="56" height="46" rx="4" fill="#DCD8CE" fill-opacity="0.5" stroke="none" stroke-width="2"/><text x="211" y="479" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="middle">✗</text><rect x="245" y="449" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#8C6A24" stroke-width="2"/><text x="273" y="479" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.6</text><rect x="307" y="449" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#283F66" stroke-width="2"/><text x="335" y="479" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.5</text><text x="110" y="531" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">5</text><text x="128" y="531" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">narrow</text><rect x="183" y="501" width="56" height="46" rx="4" fill="#DCD8CE" fill-opacity="0.5" stroke="none" stroke-width="2"/><text x="211" y="531" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="middle">✗</text><rect x="245" y="501" width="56" height="46" rx="4" fill="#DCD8CE" fill-opacity="0.5" stroke="none" stroke-width="2"/><text x="273" y="531" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="middle">✗</text><rect x="307" y="501" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#283F66" stroke-width="2"/><text x="335" y="531" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.4</text><text x="230" y="600" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">Each species at each position:</text><text x="230" y="620" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">shade + winter sun + water held, weighted</text><text x="230" y="640" font-size="15" fill="#2A2622" font-weight="bold" text-anchor="middle">Porta: 832 positions × 30 species</text><rect x="485" y="293" width="270" height="74" rx="10" fill="#F2F0EA" fill-opacity="1.0" stroke="#2A2622" stroke-width="2"/><text x="620" y="326" font-size="16" fill="#2A2622" font-weight="bold" text-anchor="middle">One species per position</text><text x="620" y="347" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="middle">every tree gets exactly one</text><rect x="485" y="408" width="270" height="74" rx="10" fill="#F2F0EA" fill-opacity="1.0" stroke="#8C6A24" stroke-width="2"/><text x="620" y="441" font-size="16" fill="#8C6A24" font-weight="bold" text-anchor="middle">Only species that fit</text><text x="620" y="462" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="middle">✗ = sidewalk too narrow</text><rect x="485" y="523" width="270" height="74" rx="10" fill="#F2F0EA" fill-opacity="1.0" stroke="#663825" stroke-width="2"/><text x="620" y="556" font-size="16" fill="#663825" font-weight="bold" text-anchor="middle">No species above its cap</text><text x="620" y="577" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="middle">15% in Porta; here at most 2 of 5</text><polygon points="850,530 835,430 905,345 1020,330 1080,410 1045,525" fill="#3F663E" fill-opacity="0.12" stroke="#3F663E" stroke-width="2"/><line x1="850" y1="530" x2="835" y2="430" stroke="#2A2622" stroke-width="3" marker-end="url(#arr)"/><line x1="835" y1="430" x2="905" y2="345" stroke="#2A2622" stroke-width="3" marker-end="url(#arr)"/><line x1="905" y1="345" x2="1020" y2="330" stroke="#2A2622" stroke-width="3" marker-end="url(#arr)"/><circle cx="850" cy="530" r="5" fill="#F2F0EA" stroke="#3F663E" stroke-width="2"/><circle cx="835" cy="430" r="5" fill="#F2F0EA" stroke="#3F663E" stroke-width="2"/><circle cx="905" cy="345" r="5" fill="#F2F0EA" stroke="#3F663E" stroke-width="2"/><circle cx="1020" cy="330" r="5" fill="#F2F0EA" stroke="#3F663E" stroke-width="2"/><circle cx="1080" cy="410" r="5" fill="#F2F0EA" stroke="#3F663E" stroke-width="2"/><circle cx="1045" cy="525" r="5" fill="#F2F0EA" stroke="#3F663E" stroke-width="2"/><circle cx="1020" cy="330" r="9" fill="#663825"/><text x="1034" y="320" font-size="16" fill="#663825" font-weight="bold" text-anchor="start">best</text><text x="842" y="554" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="middle">start</text><text x="960" y="590" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">Every layout that obeys the rules</text><text x="960" y="610" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">is a point in this shape; the best is a corner.</text><text x="960" y="634" font-size="15" fill="#2A2622" font-weight="bold" text-anchor="middle">HiGHS finds the highest corner</text><text x="960" y="654" font-size="15" fill="#2A2622" font-weight="bold" text-anchor="middle">and proves that no corner is higher.</text><text x="1321" y="278" font-size="17" fill="#3F663E" font-weight="bold" text-anchor="middle">A</text><text x="1383" y="278" font-size="17" fill="#8C6A24" font-weight="bold" text-anchor="middle">B</text><text x="1445" y="278" font-size="17" fill="#283F66" font-weight="bold" text-anchor="middle">C</text><text x="1220" y="323" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">1</text><text x="1238" y="323" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">wide</text><rect x="1293" y="293" width="56" height="46" rx="4" fill="#3F663E" fill-opacity="1" stroke="none" stroke-width="2"/><text x="1321" y="323" font-size="17" fill="#FFFFFF" font-weight="bold" text-anchor="middle">0.9</text><rect x="1355" y="293" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#8C6A24" stroke-width="2"/><text x="1383" y="323" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.6</text><rect x="1417" y="293" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#283F66" stroke-width="2"/><text x="1445" y="323" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.3</text><text x="1220" y="375" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">2</text><text x="1238" y="375" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">wide</text><rect x="1293" y="345" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#3F663E" stroke-width="2"/><text x="1321" y="375" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.8</text><rect x="1355" y="345" width="56" height="46" rx="4" fill="#8C6A24" fill-opacity="1" stroke="none" stroke-width="2"/><text x="1383" y="375" font-size="17" fill="#FFFFFF" font-weight="bold" text-anchor="middle">0.7</text><rect x="1417" y="345" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#283F66" stroke-width="2"/><text x="1445" y="375" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.3</text><text x="1220" y="427" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">3</text><text x="1238" y="427" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">wide</text><rect x="1293" y="397" width="56" height="46" rx="4" fill="#3F663E" fill-opacity="1" stroke="none" stroke-width="2"/><text x="1321" y="427" font-size="17" fill="#FFFFFF" font-weight="bold" text-anchor="middle">0.7</text><rect x="1355" y="397" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#8C6A24" stroke-width="2"/><text x="1383" y="427" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.4</text><rect x="1417" y="397" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#283F66" stroke-width="2"/><text x="1445" y="427" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.2</text><text x="1220" y="479" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">4</text><text x="1238" y="479" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">medium</text><rect x="1293" y="449" width="56" height="46" rx="4" fill="#DCD8CE" fill-opacity="0.5" stroke="none" stroke-width="2"/><text x="1321" y="479" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="middle">✗</text><rect x="1355" y="449" width="56" height="46" rx="4" fill="#8C6A24" fill-opacity="1" stroke="none" stroke-width="2"/><text x="1383" y="479" font-size="17" fill="#FFFFFF" font-weight="bold" text-anchor="middle">0.6</text><rect x="1417" y="449" width="56" height="46" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#283F66" stroke-width="2"/><text x="1445" y="479" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="middle">0.5</text><text x="1220" y="531" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">5</text><text x="1238" y="531" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">narrow</text><rect x="1293" y="501" width="56" height="46" rx="4" fill="#DCD8CE" fill-opacity="0.5" stroke="none" stroke-width="2"/><text x="1321" y="531" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="middle">✗</text><rect x="1355" y="501" width="56" height="46" rx="4" fill="#DCD8CE" fill-opacity="0.5" stroke="none" stroke-width="2"/><text x="1383" y="531" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="middle">✗</text><rect x="1417" y="501" width="56" height="46" rx="4" fill="#283F66" fill-opacity="1" stroke="none" stroke-width="2"/><text x="1445" y="531" font-size="17" fill="#FFFFFF" font-weight="bold" text-anchor="middle">0.4</text><text x="1340" y="600" font-size="15" fill="#2A2622" font-weight="bold" text-anchor="middle">Total 3.3: the best possible</text><text x="1340" y="620" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">A goes where its lead is largest (1, 3);</text><text x="1340" y="640" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="middle">position 2 takes B, losing only 0.1</text><path d="M360,440 C420,440 420,440 480,440" fill="none" stroke="#665E4F" stroke-width="1.8" marker-end="url(#arr)"/><path d="M760,440 C795,440 795,440 830,440" fill="none" stroke="#665E4F" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1095,440 C1150,440 1150,440 1205,440" fill="none" stroke="#665E4F" stroke-width="1.8" marker-end="url(#arr)"/><rect x="110" y="700" width="1380" height="92" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="140" y="735" font-size="16" fill="#2A2622" font-weight="bold" text-anchor="start">Best-per-position (greedy):</text><text x="470" y="735" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="start">A, A, A, B, C: breaks the cap.</text><text x="140" y="770" font-size="16" fill="#2A2622" font-weight="bold" text-anchor="start">Trial and error (genetic, ant colony):</text><text x="470" y="770" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="start">obeys the rules, but never knows if it found the best.</text><text x="1060" y="735" font-size="16" fill="#2A2622" font-weight="bold" text-anchor="start">Porta, 30 species: about 0.2 s</text><text x="1060" y="770" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="start">Answer is always whole trees</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: HiGHS: open-source solver for linear programming (LP) and mixed-integer programming (MIP); the name has no official expansion (highs.dev; Huangfu &amp; Hall 2018, Math. Prog. Comp. 10:119–142), called through</text><text x="60" y="869" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">SciPy. Example scores are illustrative.</text></svg>