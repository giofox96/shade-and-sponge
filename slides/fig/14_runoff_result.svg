<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">First result: the runoff module runs</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">Porta, 2-year 1-hour design storm (31.9 mm); canopy storage calibrated on 16 trees and 51 storms in Freiburg</text><image x="60" y="150" width="1480" height="520" preserveAspectRatio="xMidYMid meet" href="../../notes/figures/runoff_results_v1.png"/><rect x="60" y="690" width="355" height="112" rx="12" fill="#2F6DB5" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="690" width="355" height="6" rx="0" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="80" y="736" font-size="30" fill="#2F6DB5" font-weight="bold" text-anchor="start">−1.85%</text><text x="80" y="762" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">runoff from the street trees standing today,</text><text x="80" y="780" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">at T = 2 (−2.9% on open ground, i.e.</text><text x="80" y="798" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">everything but roofs)</text><rect x="435" y="690" width="355" height="112" rx="12" fill="#3B7F4A" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="435" y="690" width="355" height="6" rx="0" fill="#3B7F4A" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="455" y="736" font-size="30" fill="#3B7F4A" font-weight="bold" text-anchor="start">3.5–4%</text><text x="455" y="762" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">the field benchmark: 4% measured by removal</text><text x="455" y="780" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">(Selbig 2021), 3.5% in the calibrated re-</text><text x="455" y="798" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">analysis (Coville 2022)</text><rect x="810" y="690" width="355" height="112" rx="12" fill="#B7791F" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="810" y="690" width="355" height="6" rx="0" fill="#B7791F" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="830" y="736" font-size="30" fill="#B7791F" font-weight="bold" text-anchor="start">≈ 37%</text><text x="830" y="762" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">of that benefit lost during the transition:</text><text x="830" y="780" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">any young replacement gives about +0.7%</text><text x="830" y="798" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">runoff</text><rect x="1185" y="690" width="355" height="112" rx="12" fill="#1F2933" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="1185" y="690" width="355" height="6" rx="0" fill="#1F2933" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1205" y="736" font-size="30" fill="#1F2933" font-weight="bold" text-anchor="start">0.4–4.0%</text><text x="1205" y="762" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">the whole effect across s = 0.86–2.2 mm per</text><text x="1205" y="780" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">unit LAI and T = 1–10 yr</text><text x="60" y="814" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">Volume only: no sewer, no routing to outlets, no ponding, no peak flow. The benefit falls from 3.16% at T = 1 to 0.90% at T = 10 — arithmetic, because every crown is full at every design storm,</text><text x="60" y="834" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">which is why H3 was withdrawn on 19 Oct and the shrinking benefit is now stated as a boundary of the method.</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: notes/methodology.md section 4b; scripts/runoff_model.py, calibrate_interception.py, plot_runoff.py; databases/barcelona/runoff_scenarios.csv and runoff_sensitivity_storage.csv; calibration data Anys &amp; Weiler 2024</text><text x="60" y="869" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">(FreiDok); benchmark Selbig et al. 2021, Coville et al. 2022.</text></svg>