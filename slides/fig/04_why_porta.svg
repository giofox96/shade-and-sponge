<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">Porta, Nou Barris: both hazards, and the planes to replace</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">0.84 km² · chosen by a rule written before the data was ranked</text><image x="60" y="150" width="1000" height="389" preserveAspectRatio="xMidYMid meet" href="../../notes/figures/porta_profile.png"/><text x="60" y="572" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="start">Pluvial flood hazard  ·  summer surface-heat anomaly  ·  street trees, the 832 planes in green</text><rect x="1100" y="150" width="440" height="404" rx="12" fill="#2A2622" fill-opacity="0.05" stroke="none" stroke-width="2"/><rect x="1100" y="150" width="440" height="6" rx="0" fill="#2A2622" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1124" y="188" font-size="16" fill="#2A2622" font-weight="bold" text-anchor="start">THE RULE, FIXED FIRST</text><text x="1124" y="220" font-size="16" fill="#2A2622" font-weight="normal" text-anchor="start">A neighbourhood qualifies only if flood</text><text x="1124" y="241" font-size="16" fill="#2A2622" font-weight="normal" text-anchor="start">hazard, surface heat and plane density are all</text><text x="1124" y="262" font-size="16" fill="#2A2622" font-weight="normal" text-anchor="start">above the city's 60th percentile. Non-</text><text x="1124" y="282" font-size="16" fill="#2A2622" font-weight="normal" text-anchor="start">compensatory: one strong hazard cannot buy the</text><text x="1124" y="303" font-size="16" fill="#2A2622" font-weight="normal" text-anchor="start">absence of the other.</text><text x="1124" y="320" font-size="13" fill="#665E4F" font-weight="bold" text-anchor="start">SCREENED</text><text x="1124" y="344" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">73 neighbourhoods, 72 with complete data</text><text x="1124" y="376" font-size="13" fill="#665E4F" font-weight="bold" text-anchor="start">ELIGIBLE</text><text x="1124" y="400" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">12 at the 50th percentile, 7 at the 60th, 2</text><text x="1124" y="422" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">at the 70th</text><text x="1124" y="454" font-size="13" fill="#665E4F" font-weight="bold" text-anchor="start">PORTA</text><text x="1124" y="478" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">first of the eligible set at every</text><text x="1124" y="500" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">threshold</text><text x="1124" y="536" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">#2 overall on the equal-weight score; top 3 in 53% of</text><text x="1124" y="553" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">2,000 random weightings.</text><rect x="60" y="616" width="355" height="150" rx="12" fill="#3F663E" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="616" width="355" height="6" rx="0" fill="#3F663E" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="80" y="676" font-size="38" fill="#3F663E" font-weight="bold" text-anchor="start">832</text><text x="80" y="706" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">plane trees, 994 per km² (#15 of 72),</text><text x="80" y="726" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">inside 2,825 street trees of 53 taxa</text><rect x="435" y="616" width="355" height="150" rx="12" fill="#283F66" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="435" y="616" width="355" height="6" rx="0" fill="#283F66" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="455" y="676" font-size="38" fill="#283F66" font-weight="bold" text-anchor="start">#13</text><text x="455" y="706" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">flood hazard: share of area with the</text><text x="455" y="726" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">index ≥ 40 (Barcelona Regional)</text><rect x="810" y="616" width="355" height="150" rx="12" fill="#663825" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="810" y="616" width="355" height="6" rx="0" fill="#663825" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="830" y="676" font-size="38" fill="#663825" font-weight="bold" text-anchor="start">#11</text><text x="830" y="706" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">surface heat, +1.36 °C above the city</text><text x="830" y="726" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">median · #12 heat vulnerability, 91% of</text><text x="830" y="745" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">the area in the top class</text><rect x="1185" y="616" width="355" height="150" rx="12" fill="#2A2622" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="1185" y="616" width="355" height="6" rx="0" fill="#2A2622" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1205" y="676" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">7 of 7</text><text x="1205" y="706" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">candidate species already grow here:</text><text x="1205" y="726" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">the six the city names, plus</text><text x="1205" y="745" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">Styphnolobium</text><text x="60" y="796" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">Why not Sant Antoni, which scores higher if you let the criteria compensate: it is #1 for flood hazard but #38 for surface heat — below the city median — so it</text><text x="60" y="818" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">fails the both-hazards gate. It stays as the flood-dominant contrast site.</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: notes/site_selection.md sections 2-4; scripts/bcn_site_screening.py, bcn_heat_check.py, bcn_site_select.py; databases/barcelona/site_selection.csv. Map: notes/figures/porta_profile.png (flood index via the</text><text x="60" y="869" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Barcelona Resilience Atlas; Landsat 8/9 summer LST anomaly, 31 scenes 2022-2025; arbrat-viari, 1 Oct 2026).</text></svg>