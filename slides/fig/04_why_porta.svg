<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">Porta, Nou Barris: both hazards, and the planes to replace</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">0.84 km² · chosen by a rule written before the data was ranked</text><image x="60" y="150" width="1000" height="389" preserveAspectRatio="xMidYMid meet" href="../../notes/figures/porta_profile.png"/><text x="60" y="572" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Pluvial flood hazard  ·  summer surface-heat anomaly  ·  street trees, the 832 planes in green</text><rect x="1100" y="150" width="440" height="404" rx="12" fill="#1F2933" fill-opacity="0.05" stroke="none" stroke-width="2"/><rect x="1100" y="150" width="440" height="6" rx="0" fill="#1F2933" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1124" y="188" font-size="16" fill="#1F2933" font-weight="bold" text-anchor="start">THE RULE, FIXED FIRST</text><text x="1124" y="220" font-size="16" fill="#1F2933" font-weight="normal" text-anchor="start">A neighbourhood qualifies only if flood hazard,</text><text x="1124" y="241" font-size="16" fill="#1F2933" font-weight="normal" text-anchor="start">surface heat and plane density are all above the</text><text x="1124" y="262" font-size="16" fill="#1F2933" font-weight="normal" text-anchor="start">city's 60th percentile. Non-compensatory: one</text><text x="1124" y="282" font-size="16" fill="#1F2933" font-weight="normal" text-anchor="start">strong hazard cannot buy the absence of the</text><text x="1124" y="303" font-size="16" fill="#1F2933" font-weight="normal" text-anchor="start">other.</text><text x="1124" y="320" font-size="13" fill="#6B7280" font-weight="bold" text-anchor="start">SCREENED</text><text x="1124" y="344" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">73 neighbourhoods, 72 with complete data</text><text x="1124" y="376" font-size="13" fill="#6B7280" font-weight="bold" text-anchor="start">ELIGIBLE</text><text x="1124" y="400" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">12 at the 50th percentile, 7 at the 60th, 2 at</text><text x="1124" y="422" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">the 70th</text><text x="1124" y="454" font-size="13" fill="#6B7280" font-weight="bold" text-anchor="start">PORTA</text><text x="1124" y="478" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">first of the eligible set at every threshold</text><text x="1124" y="514" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">#2 overall on the equal-weight score; top 3 in 53% of 2,000</text><text x="1124" y="531" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">random weightings.</text><rect x="60" y="616" width="355" height="150" rx="12" fill="#3B7F4A" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="616" width="355" height="6" rx="0" fill="#3B7F4A" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="80" y="676" font-size="38" fill="#3B7F4A" font-weight="bold" text-anchor="start">832</text><text x="80" y="706" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">plane trees, 994 per km² (#15 of 72),</text><text x="80" y="726" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">inside 2,825 street trees of 53 taxa</text><rect x="435" y="616" width="355" height="150" rx="12" fill="#2F6DB5" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="435" y="616" width="355" height="6" rx="0" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="455" y="676" font-size="38" fill="#2F6DB5" font-weight="bold" text-anchor="start">#13</text><text x="455" y="706" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">flood hazard: share of area with the index</text><text x="455" y="726" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">≥ 40 (Barcelona Regional)</text><rect x="810" y="616" width="355" height="150" rx="12" fill="#D9622B" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="810" y="616" width="355" height="6" rx="0" fill="#D9622B" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="830" y="676" font-size="38" fill="#D9622B" font-weight="bold" text-anchor="start">#11</text><text x="830" y="706" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">surface heat, +1.36 °C above the city</text><text x="830" y="726" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">median · #12 heat vulnerability, 91% of</text><text x="830" y="745" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">the area in the top class</text><rect x="1185" y="616" width="355" height="150" rx="12" fill="#1F2933" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="1185" y="616" width="355" height="6" rx="0" fill="#1F2933" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1205" y="676" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">7 of 7</text><text x="1205" y="706" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">candidate species already grow here: the</text><text x="1205" y="726" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">six the city names, plus Styphnolobium</text><text x="60" y="796" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">Why not Sant Antoni, which scores higher if you let the criteria compensate: it is #1 for flood hazard but #38 for surface heat — below the city median — so it fails the</text><text x="60" y="818" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">both-hazards gate. It stays as the flood-dominant contrast site.</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: notes/site_selection.md sections 2-4; scripts/bcn_site_screening.py, bcn_heat_check.py, bcn_site_select.py; databases/barcelona/site_selection.csv. Map: notes/figures/porta_profile.png (flood index via the Barcelona</text><text x="60" y="869" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Resilience Atlas; Landsat 8/9 summer LST anomaly, 31 scenes 2022-2025; arbrat-viari, 1 Oct 2026).</text></svg>