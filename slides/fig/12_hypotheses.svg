<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">Two hypotheses — and the one I took out</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">H1 and H2 are testable; H3 was withdrawn on 19 Oct because the model cannot fail it</text><rect x="60" y="158" width="1480" height="185" rx="12" fill="#3F663E" fill-opacity="0.07" stroke="none" stroke-width="2"/><rect x="60" y="158" width="8" height="185" rx="0" fill="#3F663E" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="96" y="198" font-size="17" fill="#3F663E" font-weight="bold" text-anchor="start">H1  ·  SYNERGY</text><text x="96" y="236" font-size="25" fill="#2A2622" font-weight="bold" text-anchor="start">Both goals at once</text><text x="430" y="202" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">For the same number and size class of trees, trait-</text><text x="430" y="227" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">based layouts beat a like-for-like replacement on</text><text x="430" y="251" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">both objectives: crown size and LAI drive shading</text><text x="430" y="276" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">and interception alike.</text><text x="990" y="188" font-size="14" fill="#665E4F" font-weight="bold" text-anchor="start">TEST</text><text x="990" y="216" font-size="18" fill="#665E4F" font-weight="normal" text-anchor="start">S4 against S1, on both objectives.</text><text x="430" y="304" font-size="17" fill="#3F663E" font-weight="bold" text-anchor="start">Decision rule fixed first: Δmin = 91 m³. Today's exploratory best is 78 m³ → it would be reported "not resolved".</text><rect x="60" y="360" width="1480" height="185" rx="12" fill="#663825" fill-opacity="0.07" stroke="none" stroke-width="2"/><rect x="60" y="360" width="8" height="185" rx="0" fill="#663825" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="96" y="400" font-size="17" fill="#663825" font-weight="bold" text-anchor="start">H2  ·  TRADE-OFF</text><text x="96" y="438" font-size="25" fill="#2A2622" font-weight="bold" text-anchor="start">Species, not places</text><text x="430" y="404" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">The heat-optimal and the runoff-optimal layout</text><text x="430" y="429" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">differ mainly in species — leaf habit and</text><text x="430" y="453" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">transpiration — so the Pareto front is not a single</text><text x="430" y="478" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">point.</text><text x="990" y="390" font-size="14" fill="#665E4F" font-weight="bold" text-anchor="start">TEST</text><text x="990" y="418" font-size="18" fill="#665E4F" font-weight="normal" text-anchor="start">Species composition of S2 against S3, at the same</text><text x="990" y="441" font-size="18" fill="#665E4F" font-weight="normal" text-anchor="start">fixed positions.</text><text x="430" y="506" font-size="17" fill="#663825" font-weight="bold" text-anchor="start">Positions are given, so this is a claim about composition, measured by a dissimilarity fixed in advance.</text><rect x="60" y="562" width="1480" height="185" rx="12" fill="#665E4F" fill-opacity="0.05" stroke="none" stroke-width="2"/><rect x="60" y="562" width="8" height="185" rx="0" fill="#665E4F" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="96" y="602" font-size="17" fill="#665E4F" font-weight="bold" text-anchor="start">H3  ·  WITHDRAWN, 19 Oct</text><text x="96" y="640" font-size="25" fill="#665E4F" font-weight="bold" text-anchor="start">Benefit shrinks with T</text><line x1="96" y1="632" x2="382" y2="632" stroke="#665E4F" stroke-width="2.5"/><text x="430" y="606" font-size="19" fill="#665E4F" font-weight="normal" text-anchor="start">It was a hypothesis until the model showed it is an</text><text x="430" y="631" font-size="19" fill="#665E4F" font-weight="normal" text-anchor="start">identity: with I = min(P, S) and every crown full</text><text x="430" y="655" font-size="19" fill="#665E4F" font-weight="normal" text-anchor="start">at every design storm, the falling percentage is</text><text x="430" y="680" font-size="19" fill="#665E4F" font-weight="normal" text-anchor="start">arithmetic, not a result.</text><text x="990" y="592" font-size="14" fill="#665E4F" font-weight="bold" text-anchor="start">WHAT HAPPENS TO IT</text><text x="990" y="620" font-size="18" fill="#665E4F" font-weight="normal" text-anchor="start">Kept as a declared validity boundary: the benefit is</text><text x="990" y="643" font-size="18" fill="#665E4F" font-weight="normal" text-anchor="start">small at the sewer design level (T = 10 yr), and</text><text x="990" y="667" font-size="18" fill="#665E4F" font-weight="normal" text-anchor="start">extreme events such as 6 Sept 2018 are outside what</text><text x="990" y="690" font-size="18" fill="#665E4F" font-weight="normal" text-anchor="start">trees can affect.</text><rect x="60" y="752" width="900" height="70" rx="12" fill="#2A2622" fill-opacity="0.06" stroke="none" stroke-width="2"/><text x="84" y="780" font-size="19" fill="#2A2622" font-weight="bold" text-anchor="start">Removing it is a result, not a retreat</text><text x="84" y="808" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">a claim the model cannot fail is not a hypothesis</text><rect x="990" y="752" width="550" height="70" rx="12" fill="#8C6A24" fill-opacity="0.1" stroke="none" stroke-width="2"/><text x="1014" y="780" font-size="17" fill="#8C6A24" font-weight="bold" text-anchor="start">Question for the tutor</text><text x="1014" y="808" font-size="19" fill="#2A2622" font-weight="normal" text-anchor="start">is declaring it a boundary the right call?</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: notes/topic_decision.md section 8 (v5, user decision 19 Oct); notes/decisions/hypothesis_tests.md; notes/decisions/runoff_metric_sensitivity.md; notes/methodology.md section 7.</text></svg>