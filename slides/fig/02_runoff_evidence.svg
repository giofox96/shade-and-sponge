<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">Trees intercept rain: species differ, and the effect fades with storm size</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">Runoff side of the review (bucket B1-B2)</text><text x="60" y="175" font-size="22" fill="#2F6DB5" font-weight="bold" text-anchor="start">Rain intercepted by the crown (% of rainfall)</text><line x1="400" y1="195" x2="400" y2="639" stroke="#E5E7EB" stroke-width="1"/><text x="400" y="661" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="middle">0%</text><line x1="515" y1="195" x2="515" y2="639" stroke="#E5E7EB" stroke-width="1"/><text x="515" y="661" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="middle">20%</text><line x1="630" y1="195" x2="630" y2="639" stroke="#E5E7EB" stroke-width="1"/><text x="630" y="661" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="middle">40%</text><line x1="745" y1="195" x2="745" y2="639" stroke="#E5E7EB" stroke-width="1"/><text x="745" y="661" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="middle">60%</text><line x1="860" y1="195" x2="860" y2="639" stroke="#E5E7EB" stroke-width="1"/><text x="860" y="661" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="middle">80%</text><line x1="537" y1="195" x2="537" y2="639" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 5"/><text x="537" y="683" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="middle">global median 23.9%, forests (de Mello 2024*)</text><text x="60" y="229" font-size="20" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Tilia cordata</text><text x="60" y="250" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">event mean, street trees, Freiburg (Anys &amp; Weiler 2024)</text><rect x="804" y="215" width="8" height="24" rx="4" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="814" y="234" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">70.3%</text><text x="60" y="291" font-size="20" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Acer platanoides</text><text x="60" y="312" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">event mean, street trees, Freiburg (Anys &amp; Weiler 2024)</text><rect x="715" y="277" width="8" height="24" rx="4" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="725" y="296" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">54.8%</text><text x="60" y="353" font-size="20" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Quercus ilex</text><text x="60" y="374" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">annual, isolated trees, Spain (Hassan et al. 2017*)</text><rect x="664" y="339" width="29" height="24" rx="4" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="703" y="358" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">46-51%</text><text x="60" y="415" font-size="20" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Quercus nigra</text><text x="60" y="436" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">range by rain depth, Alabama (Bean et al. 2021)</text><rect x="572" y="401" width="115" height="24" rx="4" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="698" y="420" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">30-50%</text><text x="60" y="477" font-size="20" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Pinus nigra</text><text x="60" y="498" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">share of rainfall, Ljubljana (Zabret et al. 2019*)</text><rect x="659" y="463" width="8" height="24" rx="4" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="669" y="482" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">45%</text><text x="60" y="539" font-size="20" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Betula pendula</text><text x="60" y="560" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">share of rainfall, Ljubljana (Zabret et al. 2019*)</text><rect x="532" y="525" width="8" height="24" rx="4" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="542" y="544" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">23%</text><text x="60" y="601" font-size="20" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Quercus pyrenaica</text><text x="60" y="622" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">annual, isolated trees, Spain (Hassan et al. 2017*)</text><rect x="458" y="587" width="34" height="24" rx="4" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="502" y="606" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">10-16%</text><text x="60" y="719" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Surface storage varies threefold across 20 urban species, 0.51-1.81 mm per unit leaf + stem area;</text><text x="60" y="740" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Platanus 0.87, Pyrus calleryana 0.51 (Xiao &amp; McPherson 2016). Metrics differ (event vs annual): read</text><text x="60" y="761" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">as ranges, not as a ranking.</text><text x="960" y="175" font-size="22" fill="#2F6DB5" font-weight="bold" text-anchor="start">...but the benefit fades as storms grow</text><rect x="960" y="200" width="580" height="130" rx="8" fill="#2F6DB5" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="960" y="200" width="6" height="130" rx="0" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="988" y="248" font-size="32" fill="#2F6DB5" font-weight="bold" text-anchor="start">31-49% → 26-46%</text><text x="988" y="282" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">runoff cut by green infrastructure, 0.25-yr → 1-yr storm</text><text x="988" y="310" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">Liu et al. 2026*, dense catchment, no trees</text><rect x="960" y="348" width="580" height="130" rx="8" fill="#2F6DB5" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="960" y="348" width="6" height="130" rx="0" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="988" y="396" font-size="32" fill="#2F6DB5" font-weight="bold" text-anchor="start">28% → 14%</text><text x="988" y="430" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">runoff cut by combined NbS, 2-yr → 50-yr storm</text><text x="988" y="458" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">Esraz-Ul-Zannat et al. 2024, review</text><rect x="960" y="496" width="580" height="130" rx="8" fill="#2F6DB5" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="960" y="496" width="6" height="130" rx="0" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="988" y="544" font-size="32" fill="#2F6DB5" font-weight="bold" text-anchor="start">-4% volume</text><text x="988" y="578" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">after removing 31 street trees; peak flow not affected</text><text x="988" y="606" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">Selbig et al. 2021*, paired catchment</text><rect x="960" y="644" width="580" height="130" rx="8" fill="#2F6DB5" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="960" y="644" width="6" height="130" rx="0" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="988" y="692" font-size="32" fill="#2F6DB5" font-weight="bold" text-anchor="start">85% → 62%</text><text x="988" y="726" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">rain held by a 40-yr Zelkova crown, 2-yr → 25-yr 5-min storm</text><text x="988" y="754" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">Xiao &amp; McPherson 2016, model; leaf-off only 16-26%</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: notes/lit/species_measurements.csv; literature_matrix.csv rows 1-3, 7-10, 24, 32, 34. * abstract only.</text></svg>