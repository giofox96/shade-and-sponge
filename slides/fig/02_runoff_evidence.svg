" fill="#1F2933" font-weight="bold" text-anchor="start" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">10-16%</text><text x="60" y="781" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Surface storage varies threefold across 20 urban species, 0.51-1.81 mm per unit leaf + stem area;</text><text x="60" y="802" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Platanus 0.87, Pyrus calleryana 0.51 (Xiao &amp; McPherson 2016). Metrics differ (event vs annual): read</text><text x="60" y="823" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">as ranges, not as a ranking.</text><text x="960" y="175" font-size="22" fill="#2F6DB5" font-weight="bold" text-anchor="start">...but the benefit fades as storms grow</text><rect x="960" y="200" width="580" height="130" rx="8" fill="#2F6DB5" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="960" y="200" width="6" height="130" rx="0" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="988" y="248" font-size="32" fill="#2F6DB5" font-weight="bold" text-anchor="start">31-49% → 26-46%</text><text x="988" y="282" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">runoff cut by green infrastructure, 0.25-yr → 1-yr storm</text><text x="988" y="310" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">Liu et al. 2026, dense catchment, no trees</text><rect x="960" y="348" width="580" height="130" rx="8" fill="#2F6DB5" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="960" y="348" width="6" height="130" rx="0" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="988" y="396" font-size="32" fill="#2F6DB5" font-weight="bold" text-anchor="start">28% → 14%</text><text x="988" y="430" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">runoff cut by combined NbS, 2-yr → 50-yr storm</text><text x="988" y="458" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">Esraz-Ul-Zannat et al. 2024, review</text><rect x="960" y="496" width="580" height="130" rx="8" fill="#2F6DB5" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="960" y="496" width="6" height="130" rx="0" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="988" y="544" font-size="32" fill="#2F6DB5" font-weight="bold" text-anchor="start">3.5-4% of runoff</text><text x="988" y="578" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">avoided by 31 street trees (shown by removal); peak flow unchanged</text><text x="988" y="606" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">Selbig et al. 2021; Coville et al. 2022, paired catchment</text><rect x="960" y="644" width="580" height="130" rx="8" fill="#2F6DB5" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="960" y="644" width="6" height="130" rx="0" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="988" y="692" font-size="32" fill="#2F6DB5" font-weight="bold" text-anchor="start">85% → 62%</text><text x="988" y="726" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">rain held by a 40-yr Zelkova crown, 2-yr → 25-yr 5-min storm</text><text x="988" y="754" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">Xiao &amp; McPherson 2016, model; leaf-off only 16-26%</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: notes/lit/species_measurements.csv (first-hand values only); literature_matrix.csv rows 1-3, 5, 7-11, 24, 32, 34. * abstract only.</text></svg>