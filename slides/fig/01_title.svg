<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><rect width="1600" height="900" fill="#283F2A"/><defs><linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#283F2A" stop-opacity="0.86"/><stop offset="0.52" stop-color="#283F2A" stop-opacity="0.52"/><stop offset="1" stop-color="#283F2A" stop-opacity="0.04"/></linearGradient><linearGradient id="foot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#283F2A" stop-opacity="0"/><stop offset="1" stop-color="#283F2A" stop-opacity="0.75"/></linearGradient></defs><image x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid slice" href="01_title_photo.webp"/><rect width="1600" height="900" fill="url(#scrim)"/><rect x="0" y="750" width="1600" height="150" fill="url(#foot)"/><rect x="80" y="300" width="88" height="6" rx="0" fill="#8C6A24" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="80" y="410" font-size="86" fill="#F2F0EA" font-weight="bold" text-anchor="start">Shade and Sponge</text><text x="80" y="470" font-size="28" fill="#F2F0EA" font-weight="normal" text-anchor="start">A computational method for choosing which species</text><text x="80" y="506" font-size="28" fill="#F2F0EA" font-weight="normal" text-anchor="start">replace Barcelona's plane trees, and where — scored on</text><text x="80" y="543" font-size="28" fill="#F2F0EA" font-weight="normal" text-anchor="start">summer heat and on storm runoff.</text><text x="80" y="596" font-size="22" fill="#B3BAB9" font-weight="normal" text-anchor="start">MaCAD, IAAC  ·  Tutor session, 20 October 2026</text><text x="80" y="820" font-size="17" fill="#B3BAB9" font-weight="normal" text-anchor="start">Horts urbans de Porta, Carrer d'Alcúdia × Carrer de la Maladeta, Nou Barris — the bare crowns in the foreground are the plane trees this thesis is about.</text></svg>