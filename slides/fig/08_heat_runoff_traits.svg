<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">Same tree, two jobs: which traits help both, and where they conflict</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Heat and runoff evidence side by side (buckets B1, B7, B8)</text><rect x="370" y="150" width="565" height="44" rx="8" fill="#663825" fill-opacity="0.12" stroke="none" stroke-width="2"/><text x="388" y="179" font-size="20" fill="#663825" font-weight="bold" text-anchor="start">HEAT: shade + transpiration</text><rect x="975" y="150" width="565" height="44" rx="8" fill="#283F66" fill-opacity="0.12" stroke="none" stroke-width="2"/><text x="993" y="179" font-size="20" fill="#283F66" font-weight="bold" text-anchor="start">RUNOFF: canopy interception</text><text x="60" y="224" font-size="15" fill="#3F663E" font-weight="bold" text-anchor="start">HELP BOTH</text><line x1="160" y1="219" x2="1540" y2="219" stroke="#3F663E" stroke-width="1.5"/><rect x="370" y="238" width="565" height="80" rx="6" fill="#3F663E" fill-opacity="0.07" stroke="none" stroke-width="2"/><rect x="975" y="238" width="565" height="80" rx="6" fill="#3F663E" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="262" font-size="20" fill="#3F663E" font-weight="bold" text-anchor="start">Leaf area (LAI, crown</text><text x="60" y="288" font-size="20" fill="#3F663E" font-weight="bold" text-anchor="start">density)</text><text x="382" y="260" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Canopy density is the strongest driver of cooling (Rahman et</text><text x="382" y="282" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">al. 2019); LAI ranks among the top shade predictors and wide</text><text x="382" y="304" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">crowns help (Speak et al. 2020)</text><text x="987" y="260" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Interception rises with LAI / PAI (Anys &amp; Weiler 2024);</text><text x="987" y="282" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">leaf-area density drives storage capacity (Baptista et al.</text><text x="987" y="304" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">2018)</text><rect x="370" y="326" width="565" height="58" rx="6" fill="#3F663E" fill-opacity="0.07" stroke="none" stroke-width="2"/><rect x="975" y="326" width="565" height="58" rx="6" fill="#3F663E" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="350" font-size="20" fill="#3F663E" font-weight="bold" text-anchor="start">Crown size</text><text x="382" y="348" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Big, dense crowns with a low base give the best shade and</text><text x="382" y="370" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">comfort (Helletsgruber et al. 2020)</text><text x="987" y="348" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">About 66 L of runoff avoided per m² of canopy per leaf-on</text><text x="987" y="370" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">season (Selbig et al. 2021; Coville et al. 2022)</text><text x="60" y="412" font-size="15" fill="#8C6A24" font-weight="bold" text-anchor="start">PULL APART</text><line x1="160" y1="408" x2="1540" y2="408" stroke="#8C6A24" stroke-width="1.5"/><rect x="370" y="426" width="565" height="102" rx="6" fill="#8C6A24" fill-opacity="0.07" stroke="none" stroke-width="2"/><rect x="975" y="426" width="565" height="102" rx="6" fill="#8C6A24" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="450" font-size="20" fill="#8C6A24" font-weight="bold" text-anchor="start">Leaf habit and season</text><text x="382" y="448" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Dense LAI is best in summer, sparse LAI in winter (Peng et</text><text x="382" y="471" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">al. 2026); evergreen street trees were the weakest summer</text><text x="382" y="493" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">option for both heat and runoff (Wu et al. 2024)</text><text x="987" y="448" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Bare crowns hold far less rain: a Zelkova holds 85% of a</text><text x="987" y="471" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">2-yr storm in leaf, 16% leaf-off (Xiao &amp; McPherson 2016);</text><text x="987" y="493" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Barcelona's intense storms come mainly in autumn (Resilience</text><text x="987" y="515" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Atlas)</text><rect x="370" y="537" width="565" height="80" rx="6" fill="#8C6A24" fill-opacity="0.07" stroke="none" stroke-width="2"/><rect x="975" y="537" width="565" height="80" rx="6" fill="#8C6A24" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="561" font-size="20" fill="#8C6A24" font-weight="bold" text-anchor="start">Water use</text><text x="382" y="559" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Transpiration cools the air more than shade: 1.15 vs 0.43 °C</text><text x="382" y="581" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">(Park et al. 2026); diffuse-porous Platanus transpires 2-3x</text><text x="382" y="603" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">ring-porous species (Bachofen et al. 2025)</text><text x="987" y="559" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Dry soils before a storm give ~10% more runoff reduction;</text><text x="987" y="581" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">wet soils give more cooling (Pace et al. 2025)</text><text x="60" y="645" font-size="15" fill="#665E4F" font-weight="bold" text-anchor="start">LIMITS</text><line x1="160" y1="640" x2="1540" y2="640" stroke="#665E4F" stroke-width="1.5"/><rect x="370" y="659" width="565" height="80" rx="6" fill="#665E4F" fill-opacity="0.07" stroke="none" stroke-width="2"/><rect x="975" y="659" width="565" height="80" rx="6" fill="#665E4F" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="683" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="start">Context</text><text x="382" y="681" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Surface material can outweigh tree traits for surface</text><text x="382" y="703" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">cooling (Kaluarachchi et al. 2020)</text><text x="987" y="681" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Leafy crowns hold only the first 2-4 mm of a storm, so</text><text x="987" y="703" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">canopies work best in short, light storms (Kuehler et al.</text><text x="987" y="725" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">2017)</text><text x="60" y="785" font-size="21" fill="#2A2622" font-weight="bold" text-anchor="start">Leaf area and crown size push both goals the same way; leaf habit and water use pull them apart. Species choice therefore needs a</text><text x="60" y="813" font-size="21" fill="#2A2622" font-weight="bold" text-anchor="start">multi-objective search, not a single score.</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: literature_matrix.csv rows 1, 3, 6, 9-11, 13, 38-40, 42, 43, 45, 53, 56; Barcelona Resilience Atlas.</text></svg>