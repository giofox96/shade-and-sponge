<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">The research question, part by part</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">v5, 19 Oct — what is chosen, against what, measured how</text><rect x="60" y="160" width="1480" height="340" rx="12" fill="#1F2933" fill-opacity="0.05" stroke="none" stroke-width="2"/><text x="84" y="206" font-size="26" fill="#6B7280" font-weight="normal" text-anchor="start">In Porta, as plane trees are replaced under the city's tree plan,</text><text x="84" y="250" font-size="30" fill="#1F2933" font-weight="bold" text-anchor="start">which replacement species and positions jointly reduce</text><rect x="84" y="278" width="700" height="96" rx="10" fill="#D9622B" fill-opacity="0.1" stroke="none" stroke-width="2"/><text x="104" y="310" font-size="23" fill="#D9622B" font-weight="bold" text-anchor="start">(a)  pedestrian heat stress</text><text x="104" y="342" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">mean UTCI over 12–17 h on a hot design day, sun-exposed routes</text><rect x="816" y="278" width="700" height="96" rx="10" fill="#2F6DB5" fill-opacity="0.1" stroke="none" stroke-width="2"/><text x="836" y="310" font-size="23" fill="#2F6DB5" font-weight="bold" text-anchor="start">(b)  event runoff volume</text><text x="836" y="342" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">sealed street surfaces, 1-, 2- and 10-year PDISBA design storms</text><text x="84" y="418" font-size="30" fill="#1F2933" font-weight="bold" text-anchor="start">How large is the trade-off between the two,</text><text x="84" y="456" font-size="22" fill="#1F2933" font-weight="normal" text-anchor="start">compared with the current trees, a like-for-like replacement with the city's named palette, and single-objective layouts?</text><text x="84" y="484" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Without those three baselines the question is not answerable — they are scenarios S0, S1 and S2/S3.</text><text x="60" y="560" font-size="18" fill="#3B7F4A" font-weight="bold" text-anchor="start">Every term is fixed before the runs</text><text x="60" y="598" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">WHERE</text><text x="60" y="628" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">Porta, Nou Barris: 0.84 km², 832 plane</text><text x="60" y="653" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">positions, the city's own replacement palette</text><text x="560" y="598" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">WHAT IS CHOSEN</text><text x="560" y="628" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">one species per position — the positions</text><text x="560" y="653" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">themselves are given by the existing pits</text><text x="1060" y="598" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">AGAINST WHAT</text><text x="1060" y="628" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">S0 the trees standing today · S1 like-for-like ·</text><text x="1060" y="653" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">S2/S3 each single-objective optimum</text><rect x="60" y="700" width="1480" height="88" rx="12" fill="#3B7F4A" fill-opacity="0.08" stroke="none" stroke-width="2"/><text x="84" y="736" font-size="18" fill="#3B7F4A" font-weight="bold" text-anchor="start">Changed on 19 Oct (your decision):</text><text x="84" y="766" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">the heat metric is the 12–17 h mean, not the peak summer hour — at the peak even full shade is above 32 °C in 5 of 6 afternoon hours, so the metric</text><text x="84" y="791" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">saturated and no layout could show a benefit.</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: notes/topic_decision.md sections 7 and 8; notes/decisions/heat_objective.md (DECIDED 19 Oct); notes/methodology.md section 7 (scenarios S0-S4).</text></svg>