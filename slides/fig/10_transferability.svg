<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">The code travels, the evidence does not</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">What the method needs at a new site: Porta (calibration) vs the two inventoried transfer candidates</text><text x="780" y="196" font-size="19" fill="#3B7F4A" font-weight="bold" text-anchor="middle">Barcelona</text><text x="780" y="216" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="middle">Porta, calibration</text><text x="900" y="196" font-size="19" fill="#B7791F" font-weight="bold" text-anchor="middle">Florence</text><text x="900" y="216" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="middle">planned transfer</text><text x="1020" y="196" font-size="19" fill="#6B7280" font-weight="bold" text-anchor="middle">Bologna</text><text x="1020" y="216" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="middle">inventoried fallback</text><text x="1090" y="206" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="start">What it costs to move the method</text><rect x="45" y="232" width="1510" height="50" rx="8" fill="#B7791F" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="254" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Boundary, buildings, DTM</text><text x="60" y="274" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">domain, building shadows, flow routing</text><circle cx="780" cy="258" r="14" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="780" cy="258" r="14" fill="#3B7F4A"/><circle cx="900" cy="258" r="14" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.5"/><circle cx="900" cy="258" r="14" fill="#B7791F"/><circle cx="1020" cy="258" r="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="2.5"/><path d="M1020,244 A14,14 0 0,0 1020,272 Z" fill="#6B7280"/><text x="1090" y="262" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">OSM footprints and a national DEM exist nearly everywhere; a</text><text x="1090" y="282" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">10 m DEM degrades the routing</text><rect x="45" y="284" width="1510" height="50" rx="8" fill="#3B7F4A" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="306" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Tree inventory: species + position</text><text x="60" y="326" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">baseline stock and the positions to replace</text><circle cx="780" cy="310" r="14" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="780" cy="310" r="14" fill="#3B7F4A"/><circle cx="900" cy="310" r="14" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.5"/><circle cx="900" cy="310" r="14" fill="#B7791F"/><circle cx="1020" cy="310" r="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="2.5"/><circle cx="1020" cy="310" r="14" fill="#6B7280"/><text x="1090" y="314" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">140,404 / 82,226 / 87,796 trees. The one input the method</text><text x="1090" y="334" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">cannot derive itself</text><rect x="45" y="336" width="1510" height="50" rx="8" fill="#B7791F" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="358" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Classified leaf-on point cloud</text><text x="60" y="378" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">crown, crown base, LAI proxy from gap fraction</text><circle cx="780" cy="362" r="14" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="780" cy="362" r="14" fill="#3B7F4A"/><circle cx="900" cy="362" r="14" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.5"/><path d="M900,348 A14,14 0 0,0 900,376 Z" fill="#B7791F"/><circle cx="1020" cy="362" r="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="2.5"/><path d="M1020,348 A14,14 0 0,0 1020,376 Z" fill="#6B7280"/><text x="1090" y="366" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">A 1 m DSM gives height, not gap fraction: species differences</text><text x="1090" y="386" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">collapse to crown size</text><rect x="45" y="388" width="1510" height="50" rx="8" fill="#B7791F" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="410" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Design rainfall (IDF)</text><text x="60" y="430" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">design storms T = 1, 2, 10 yr</text><circle cx="780" cy="414" r="14" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="780" cy="414" r="14" fill="#3B7F4A"/><circle cx="900" cy="414" r="14" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.5"/><circle cx="900" cy="414" r="14" fill="#B7791F"/><circle cx="1020" cy="414" r="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="2.5"/><text x="1090" y="418" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">Barcelona PDISBA, Florence a 1 km a-n grid; Bologna has no</text><text x="1090" y="438" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">grid: fit it from gauge maxima</text><rect x="45" y="440" width="1510" height="50" rx="8" fill="#B7791F" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="462" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Pluvial flood map</text><text x="60" y="482" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">where runoff matters: the hotspot target</text><circle cx="780" cy="466" r="14" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="780" cy="466" r="14" fill="#3B7F4A"/><circle cx="900" cy="466" r="14" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.5"/><path d="M900,452 A14,14 0 0,0 900,480 Z" fill="#B7791F"/><circle cx="1020" cy="466" r="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="2.5"/><path d="M1020,452 A14,14 0 0,0 1020,480 Z" fill="#6B7280"/><text x="1090" y="470" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">Our own routing is not one: ROC AUC 0.52 against RESCCUE</text><text x="1090" y="490" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">depth in Porta</text><rect x="45" y="492" width="1510" height="50" rx="8" fill="#3B7F4A" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="514" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Weather file (EPW)</text><text x="60" y="534" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">UTCI inputs and design hours</text><circle cx="780" cy="518" r="14" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="780" cy="518" r="14" fill="#3B7F4A"/><circle cx="900" cy="518" r="14" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.5"/><circle cx="900" cy="518" r="14" fill="#B7791F"/><circle cx="1020" cy="518" r="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="2.5"/><circle cx="1020" cy="518" r="14" fill="#6B7280"/><text x="1090" y="522" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">TMYx coverage is global; the airport-vs-centre bias is a</text><text x="1090" y="542" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">stated limit everywhere</text><rect x="45" y="544" width="1510" height="50" rx="8" fill="#B7791F" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="566" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Measured species traits</text><text x="60" y="586" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">trait table and gap-filling classes</text><circle cx="780" cy="570" r="14" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><path d="M780,556 A14,14 0 0,0 780,584 Z" fill="#3B7F4A"/><circle cx="900" cy="570" r="14" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.5"/><path d="M900,556 A14,14 0 0,0 900,584 Z" fill="#B7791F"/><circle cx="1020" cy="570" r="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="2.5"/><text x="1090" y="574" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">A runoff or heat value for 40% of trees in Barcelona, 19% in</text><text x="1090" y="594" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">Florence, both for 7%</text><rect x="45" y="596" width="1510" height="50" rx="8" fill="#B7791F" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="618" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Leaf calendar + storm season</text><text x="60" y="638" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">LAI per month, storm weighting</text><circle cx="780" cy="622" r="14" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="780" cy="622" r="14" fill="#3B7F4A"/><circle cx="900" cy="622" r="14" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.5"/><circle cx="1020" cy="622" r="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="2.5"/><text x="1090" y="626" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">City-specific: 78% of Barcelona's intense storm days fall in</text><text x="1090" y="646" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">May-Oct, all in full leaf</text><rect x="45" y="648" width="1510" height="50" rx="8" fill="#B7791F" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="670" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Policy cap + replacement palette</text><text x="60" y="690" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">the feasible species set</text><circle cx="780" cy="674" r="14" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="780" cy="674" r="14" fill="#3B7F4A"/><circle cx="900" cy="674" r="14" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.5"/><circle cx="1020" cy="674" r="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="2.5"/><text x="1090" y="678" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">The 15% cap and the plane replacement are Barcelona's:</text><text x="1090" y="698" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">elsewhere the decision variable changes</text><circle cx="66" cy="730" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><circle cx="66" cy="730" r="10" fill="#1F2933"/><text x="84" y="736" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">available</text><circle cx="216" cy="730" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><path d="M216,720 A10,10 0 0,0 216,740 Z" fill="#1F2933"/><text x="234" y="736" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">to confirm</text><circle cx="366" cy="730" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><text x="384" y="736" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">not found</text><rect x="540" y="714" width="325" height="112" rx="10" fill="#3B7F4A" fill-opacity="0.1" stroke="none" stroke-width="2"/><text x="558" y="740" font-size="17" fill="#3B7F4A" font-weight="bold" text-anchor="start">SITE-AGNOSTIC</text><text x="558" y="754" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">flow routing · sun and shadow geometry</text><text x="558" y="774" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">· SCS-CN runoff</text><rect x="885" y="714" width="325" height="112" rx="10" fill="#B7791F" fill-opacity="0.1" stroke="none" stroke-width="2"/><text x="903" y="740" font-size="17" fill="#B7791F" font-weight="bold" text-anchor="start">NEEDS LOCAL INPUTS</text><text x="903" y="754" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">site adapter and thresholds · leaf</text><text x="903" y="774" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">calendar and storms · palette and cap</text><rect x="1230" y="714" width="325" height="112" rx="10" fill="#2F6DB5" fill-opacity="0.1" stroke="none" stroke-width="2"/><text x="1248" y="740" font-size="17" fill="#2F6DB5" font-weight="bold" text-anchor="start">DESIGN MODE NEEDS LESS</text><text x="1248" y="754" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">the designer supplies the positions:</text><text x="1248" y="774" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">only an EPW, a DTM and traits stay</text><text x="1248" y="793" font-size="15" fill="#1F2933" font-weight="normal" text-anchor="start">mandatory</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: data_inventory_barcelona.md A1, A3, A7, B1-B2, C4, D1-D2, G; data_inventory.md B1, B3, B5-B7, F1, F3, F5-F7; topic_decision.md 6.1 (trait coverage); methodology.md 4 validation (iii) (routing vs RESCCUE depth);</text><text x="60" y="869" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">transfer_species_overlap.csv; Esbri et al. 2026 (storm months); notes/transferability.md.</text></svg>