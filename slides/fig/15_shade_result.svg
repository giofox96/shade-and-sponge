<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">First result: the shade trade-off is real</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">Tool v0 over the seven candidate species, with the photo-based leaf calendar (re-run 15 Oct)</text><image x="60" y="150" width="1480" height="520" preserveAspectRatio="xMidYMid meet" href="../../notes/figures/tool_v0.png"/><rect x="60" y="690" width="355" height="112" rx="12" fill="#3B7F4A" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="690" width="355" height="6" rx="0" fill="#3B7F4A" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="80" y="736" font-size="30" fill="#3B7F4A" font-weight="bold" text-anchor="start">+16%</text><text x="80" y="762" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">summer shade, optimised against a random</text><text x="80" y="780" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">palette — robust across all 8 sensitivity</text><text x="80" y="798" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">variants</text><rect x="435" y="690" width="355" height="112" rx="12" fill="#B7791F" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="435" y="690" width="355" height="6" rx="0" fill="#B7791F" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="455" y="736" font-size="30" fill="#B7791F" font-weight="bold" text-anchor="start">no winter gain</text><text x="455" y="762" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">the same layout is about equal or worse in</text><text x="455" y="780" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">winter shade (−0.8 to +7.9%)</text><rect x="810" y="690" width="355" height="112" rx="12" fill="#D9622B" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="810" y="690" width="355" height="6" rx="0" fill="#D9622B" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="830" y="736" font-size="30" fill="#D9622B" font-weight="bold" text-anchor="start">−18% / −18%</text><text x="830" y="762" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">beyond the balanced layout, winter shade</text><text x="830" y="780" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">bought with summer shade: one for one in the</text><text x="830" y="798" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">base run, 0.6–1.0 across variants</text><rect x="1185" y="690" width="355" height="112" rx="12" fill="#1F2933" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="1185" y="690" width="355" height="6" rx="0" fill="#1F2933" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1205" y="736" font-size="30" fill="#1F2933" font-weight="bold" text-anchor="start">−7.5%</text><text x="1205" y="762" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">even with mature replacement crowns, no</text><text x="1205" y="780" font-size="14" fill="#1F2933" font-weight="normal" text-anchor="start">layout reaches the planes standing today</text><text x="60" y="814" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">Shade is the fast proxy, not UTCI: the Ladybug module comes next. Positions are fixed at the 832 plane pits, so this compares species composition, not placement — and the leaf calendar it rests on</text><text x="60" y="834" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">is photo-based evidence for January only.</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: shade_sponge/README.md (tool v0 run and its sensitivity table); scripts/sensitivity_tool_v0.py, plot_tool_v0.py; databases/barcelona/tool_v0_summary.csv and tool_v0_sensitivity.csv; leaf calendar</text><text x="60" y="869" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">notes/decisions/leaf_state_inat.md.</text></svg>