<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">The replacement palette: crowns we can measure, rain and cooling mostly not</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">Plane tree vs the six replacement species the city names (all already grow in Porta)</text><text x="700" y="175" font-size="16" fill="#3B7F4A" font-weight="bold" text-anchor="middle">Crown size + LAI</text><text x="700" y="196" font-size="16" fill="#3B7F4A" font-weight="bold" text-anchor="middle">(LiDAR, this study)</text><text x="880" y="175" font-size="16" fill="#3B7F4A" font-weight="bold" text-anchor="middle">Leaf + wood traits</text><text x="880" y="196" font-size="16" fill="#3B7F4A" font-weight="bold" text-anchor="middle">(SLA, wood density)</text><text x="1060" y="175" font-size="16" fill="#3B7F4A" font-weight="bold" text-anchor="middle">Drought vulnerability</text><text x="1060" y="196" font-size="16" fill="#3B7F4A" font-weight="bold" text-anchor="middle">(P50)</text><text x="1240" y="175" font-size="16" fill="#2F6DB5" font-weight="bold" text-anchor="middle">Rain storage</text><text x="1240" y="196" font-size="16" fill="#2F6DB5" font-weight="bold" text-anchor="middle">(measured)</text><text x="1420" y="175" font-size="16" fill="#D9622B" font-weight="bold" text-anchor="middle">Cooling (measured)</text><text x="60" y="247" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Platanus × acerifolia</text><text x="60" y="269" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">current tree, 829 in Porta</tex