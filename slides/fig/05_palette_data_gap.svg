" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="385" r="15" fill="#3B7F4A"/><circle cx="880" cy="385" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="385" r="15" fill="#3B7F4A"/><circle cx="1060" cy="385" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="385" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1420" cy="385" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><text x="60" y="447" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Pyrus calleryana</text><text x="60" y="469" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 147 in Porta</text><circle cx="700" cy="447" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="447" r="15" fill="#3B7F4A"/><circle cx="880" cy="447" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="447" r="15" fill="#3B7F4A"/><circle cx="1060" cy="447" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="447" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1240" cy="447" r="15" fill="#2F6DB5"/><circle cx="1420" cy="447" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M1420,432 A15,15 0 0,0 1420,462 Z" fill="#D9622B"/><text x="1442" y="437" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">b</text><text x="60" y="509" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Jacaranda mimosifolia</text><text x="60" y="531" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 145 in Porta</text><circle cx="700" cy="509" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="509" r="15" fill="#3B7F4A"/><circle cx="880" cy="509" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="509" r="15" fill="#3B7F4A"/><circle cx="1060" cy="509" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="509" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1420" cy="509" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><text x="60" y="571" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Tipuana tipu</text><text x="60" y="593" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 139 in Porta</text><circle cx="700" cy="571" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="571" r="15" fill="#3B7F4A"/><circle cx="880" cy="571" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="571" r="15" fill="#3B7F4A"/><circle cx="1060" cy="571" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="571" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1420" cy="571" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M1420,556 A15,15 0 0,0 1420,586 Z" fill="#D9622B"/><text x="1442" y="561" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">c</text><text x="60" y="633" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Brachychiton populneus</text><text x="60" y="655" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 103 in Porta</text><circle cx="700" cy="633" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="633" r="15" fill="#3B7F4A"/><circle cx="880" cy="633" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="633" r="15" fill="#3B7F4A"/><circle cx="1060" cy="633" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="633" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1420" cy="633" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="60" cy="683" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><circle cx="60" cy="683" r="10" fill="#1F2933"/><text x="78" y="689" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">yes / measured</text><circle cx="250" cy="683" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><path d="M250,673 A10,10 0 0,0 250,693 Z" fill="#1F2933"/><text x="268" y="689" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">partly</text><circle cx="440" cy="683" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><text x="458" y="689" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">no</text><text x="60" y="713" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(a) Celtis: only the congener C. sinensis is measured (0.71 mm; Xiao &amp; McPherson 2016)</text><text x="60" y="731" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(b) Pyrus: UTCI -3.5 to -6.3 °C, but modelled as a default ENVI-met tree, so it reflects size, not species (Silva et al. 2025)</text><text x="60" y="749" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(c) Tipuana: PET -15.6 °C, second-hand only (Santos Nouri et al. 2018, cited in Silva et al. 2025)</text><text x="60" y="785" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Every candidate's crown can be measured on site. Rain storage is measured for one candidate (Pyrus), plus Celtis through a congener; no candidate has a</text><text x="60" y="810" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">measured cooling value. The method fills the gaps with trait proxies and sensitivity ranges, and reports them as a finding.</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: databases/traits/porta_trait_table.csv (ICGC LiDAR 2021; 3TF v1.3; BROT 2.0; notes/lit/species_measurements.csv). TRY and i-Tree requests pending.</text></svg>