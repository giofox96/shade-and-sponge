0" cy="455" r="15" fill="#3B7F4A"/><circle cx="1060" cy="455" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="455" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><path d="M1240,440 A15,15 0 0,0 1240,470 Z" fill="#2F6DB5"/><text x="1262" y="445" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">d</text><circle cx="1420" cy="455" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M1420,440 A15,15 0 0,0 1420,470 Z" fill="#D9622B"/><text x="1442" y="445" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">e</text><text x="60" y="501" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Tipuana tipu</text><text x="60" y="523" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 139 in Porta</text><circle cx="700" cy="501" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="501" r="15" fill="#3B7F4A"/><circle cx="880" cy="501" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="501" r="15" fill="#3B7F4A"/><circle cx="1060" cy="501" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="501" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1420" cy="501" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M1420,486 A15,15 0 0,0 1420,516 Z" fill="#D9622B"/><text x="1442" y="491" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">c</text><text x="60" y="547" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Brachychiton populneus</text><text x="60" y="569" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 103 in Porta</text><circle cx="700" cy="547" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="547" r="15" fill="#3B7F4A"/><circle cx="880" cy="547" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="547" r="15" fill="#3B7F4A"/><circle cx="1060" cy="547" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="547" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1420" cy="547" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M1420,532 A15,15 0 0,0 1420,562 Z" fill="#D9622B"/><text x="1442" y="537" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">e</text><text x="60" y="593" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Styphnolobium japonicum</text><text x="60" y="615" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 5 in Porta</text><circle cx="700" cy="593" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><path d="M700,578 A15,15 0 0,0 700,608 Z" fill="#3B7F4A"/><text x="722" y="583" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">f</text><circle cx="880" cy="593" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="593" r="15" fill="#3B7F4A"/><circle cx="1060" cy="593" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="593" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><path d="M1240,578 A15,15 0 0,0 1240,608 Z" fill="#2F6DB5"/><text x="1262" y="583" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">g</text><circle cx="1420" cy="593" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="60" cy="633" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><circle cx="60" cy="633" r="10" fill="#1F2933"/><text x="78" y="639" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">yes / measured</text><circle cx="250" cy="633" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><path d="M250,623 A10,10 0 0,0 250,643 Z" fill="#1F2933"/><text x="268" y="639" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">partly</text><circle cx="440" cy="633" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><text x="458" y="639" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">no</text><text x="60" y="661" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(a) Celtis: only the congener C. sinensis is measured (0.71 mm; Xiao &amp; McPherson 2016)</text><text x="60" y="679" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(b) Pyrus: UTCI -3.5 to -6.3 °C, but modelled as a default ENVI-met tree, so it reflects size, not species (Silva et al. 2025)</text><text x="60" y="697" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(c) Tipuana: PET up to -15.6 °C in summer, but up to -2.7 °C in winter (leafed, as cited); modelled with measured under-crown radiation (Santos Nouri et al. 2018)</text><text x="60" y="715" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(d) Jacaranda: 15.3% interception for a small tree, city-scale model, second-hand (Xiao &amp; McPherson 2003, cited in Huang et al. 2017)</text><text x="60" y="733" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(e) Brachychiton, Jacaranda: water use only, second-hand (McCarthy et al. 2011 via Berland et al. 2017; Pataki et al. 2011 via Thom et al. 2022)</text><text x="60" y="751" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(f) Styphnolobium: crown and LAI from only 5 LiDAR trees on one street (estimate; porta_species_lidar_summary.csv)</text><text x="60" y="769" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(g) Styphnolobium: event interception 35.8% on one tree in Seoul, not a storage value (Yang et al. 2019)</text><text x="60" y="811" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Crowns are measured on site for every candidate (Styphnolobium: 5 trees). Rain storage is measured for Pyrus only, Celtis via a congener; cooling only</text><text x="60" y="836" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">modelled or second-hand. Gaps get trait proxies and sensitivity ranges.</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: databases/traits/porta_trait_table.csv (ICGC LiDAR 2021; 3TF v1.3; BROT 2.0; notes/lit/species_measurements.csv); Styphnolobium crown from porta_species_lidar_summary.csv (n = 5; the trait table keeps n &gt;= 10). TRY and</text><text x="60" y="869" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">i-Tree requests pending.</text></svg>