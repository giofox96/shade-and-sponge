0" cy="461" r="15" fill="#3B7F4A"/><circle cx="1060" cy="461" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="461" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><path d="M1240,446 A15,15 0 0,0 1240,476 Z" fill="#2F6DB5"/><text x="1262" y="451" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">d</text><circle cx="1420" cy="461" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M1420,446 A15,15 0 0,0 1420,476 Z" fill="#D9622B"/><text x="1442" y="451" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">e</text><text x="60" y="509" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Tipuana tipu</text><text x="60" y="531" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 139 in Porta</text><circle cx="700" cy="509" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="509" r="15" fill="#3B7F4A"/><circle cx="880" cy="509" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="509" r="15" fill="#3B7F4A"/><circle cx="1060" cy="509" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="509" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1420" cy="509" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M1420,494 A15,15 0 0,0 1420,524 Z" fill="#D9622B"/><text x="1442" y="499" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">c</text><text x="60" y="557" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Brachychiton populneus</text><text x="60" y="579" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 103 in Porta</text><circle cx="700" cy="557" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="557" r="15" fill="#3B7F4A"/><circle cx="880" cy="557" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="557" r="15" fill="#3B7F4A"/><circle cx="1060" cy="557" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="557" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1420" cy="557" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M1420,542 A15,15 0 0,0 1420,572 Z" fill="#D9622B"/><text x="1442" y="547" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">e</text><text x="60" y="605" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Styphnolobium japonicum</text><text x="60" y="627" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 5 in Porta</text><circle cx="700" cy="605" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><path d="M700,590 A15,15 0 0,0 700,620 Z" fill="#3B7F4A"/><text x="722" y="595" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">f</text><circle cx="880" cy="605" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="605" r="15" fill="#3B7F4A"/><circle cx="1060" cy="605" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="605" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1240" cy="605" r="15" fill="#2F6DB5"/><circle cx="1420" cy="605" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="60" cy="647" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><circle cx="60" cy="647" r="10" fill="#1F2933"/><text x="78" y="653" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">yes / measured</text><circle cx="250" cy="647" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><path d="M250,637 A10,10 0 0,0 250,657 Z" fill="#1F2933"/><text x="268" y="653" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">partly</text><circle cx="440" cy="647" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><text x="458" y="653" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">no</text><text x="60" y="675" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(a) Celtis: only the congener C. sinensis is measured (0.71 mm; Xiao &amp; McPherson 2016)</text><text x="60" y="693" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(b) Pyrus: UTCI -3.5 to -6.3 °C, but modelled as a default ENVI-met tree, so it reflects size, not species (Silva et al. 2025)</text><text x="60" y="711" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(c) Tipuana: PET up to -15.6 °C in summer, but up to -2.7 °C in winter (leafed, as cited); modelled with measured under-crown radiation (Santos Nouri et al. 2018)</text><text x="60" y="729" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(d) Jacaranda: 15.3% interception for a small tree, city-scale model, second-hand (Xiao &amp; McPherson 2003, cited in Huang et al. 2017)</text><text x="60" y="747" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(e) Brachychiton, Jacaranda: water use only, second-hand (McCarthy et al. 2011 via Berland et al. 2017; Pataki et al. 2011 via Thom et al. 2022)</text><text x="60" y="765" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(f) Styphnolobium: crown and LAI from only 5 LiDAR trees on one street (estimate); interception measured on one tree in Seoul (Yang et al. 2019)</text><text x="60" y="807" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Crowns are measured on site for every candidate (Styphnolobium: 5 trees). Rain interception is measured for Pyrus and Styphnolobium, Celtis via a congener;</text><text x="60" y="832" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">cooling only modelled or second-hand. Gaps get trait proxies and sensitivity ranges.</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: databases/traits/porta_trait_table.csv (ICGC LiDAR 2021; 3TF v1.3; BROT 2.0; notes/lit/species_measurements.csv). TRY and i-Tree requests pending.</text></svg>