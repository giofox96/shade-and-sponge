<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">The replacement palette: crowns we can measure, rain and cooling mostly not</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">Plane tree vs the six replacement species the city names (all already grow in Porta)</text><text x="700" y="175" font-size="16" fill="#3B7F4A" font-weight="bold" text-anchor="middle">Crown size + LAI</text><text x="700" y="196" font-size="16" fill="#3B7F4A" font-weight="bold" text-anchor="middle">(LiDAR, this study)</text><text x="880" y="175" font-size="16" fill="#3B7F4A" font-weight="bold" text-anchor="middle">Leaf + wood traits</text><text x="880" y="196" font-size="16" fill="#3B7F4A" font-weight="bold" text-anchor="middle">(SLA, wood density)</text><text x="1060" y="175" font-size="16" fill="#3B7F4A" font-weight="bold" text-anchor="middle">Drought vulnerability</text><text x="1060" y="196" font-size="16" fill="#3B7F4A" font-weight="bold" text-anchor="middle">(P50)</text><text x="1240" y="175" font-size="16" fill="#2F6DB5" font-weight="bold" text-anchor="middle">Rain storage</text><text x="1240" y="196" font-size="16" fill="#2F6DB5" font-weight="bold" text-anchor="middle">(measured)</text><text x="1420" y="175" font-size="16" fill="#D9622B" font-weight="bold" text-anchor="middle">Cooling (measured)</text><text x="60" y="247" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Platanus × acerifolia</text><text x="60" y="269" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">current tree, 829 in Porta</text><circle cx="700" cy="247" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="247" r="15" fill="#3B7F4A"/><circle cx="880" cy="247" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="247" r="15" fill="#3B7F4A"/><circle cx="1060" cy="247" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="247" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1240" cy="247" r="15" fill="#2F6DB5"/><circle cx="1420" cy="247" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="1420" cy="247" r="15" fill="#D9622B"/><line x1="60" y1="287" x2="1540" y2="287" stroke="#E5E7EB" stroke-width="2"/><text x="60" y="317" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Celtis australis</text><text x="60" y="339" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 296 in Porta</text><circle cx="700" cy="317" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="317" r="15" fill="#3B7F4A"/><circle cx="880" cy="317" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="317" r="15" fill="#3B7F4A"/><circle cx="1060" cy="317" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1060" cy="317" r="15" fill="#3B7F4A"/><circle cx="1240" cy="317" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><path d="M1240,302 A15,15 0 0,0 1240,332 Z" fill="#2F6DB5"/><text x="1262" y="307" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">a</text><circle cx="1420" cy="317" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><text x="60" y="373" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Melia azedarach</text><text x="60" y="395" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 167 in Porta</text><circle cx="700" cy="373" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="373" r="15" fill="#3B7F4A"/><circle cx="880" cy="373" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="373" r="15" fill="#3B7F4A"/><circle cx="1060" cy="373" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="373" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1420" cy="373" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><text x="60" y="429" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Pyrus calleryana</text><text x="60" y="451" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 147 in Porta</text><circle cx="700" cy="429" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="429" r="15" fill="#3B7F4A"/><circle cx="880" cy="429" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="429" r="15" fill="#3B7F4A"/><circle cx="1060" cy="429" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="429" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1240" cy="429" r="15" fill="#2F6DB5"/><circle cx="1420" cy="429" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M1420,414 A15,15 0 0,0 1420,444 Z" fill="#D9622B"/><text x="1442" y="419" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">b</text><text x="60" y="485" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Jacaranda mimosifolia</text><text x="60" y="507" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 145 in Porta</text><circle cx="700" cy="485" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="485" r="15" fill="#3B7F4A"/><circle cx="880" cy="485" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="485" r="15" fill="#3B7F4A"/><circle cx="1060" cy="485" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="485" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><path d="M1240,470 A15,15 0 0,0 1240,500 Z" fill="#2F6DB5"/><text x="1262" y="475" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">d</text><circle cx="1420" cy="485" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M1420,470 A15,15 0 0,0 1420,500 Z" fill="#D9622B"/><text x="1442" y="475" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">e</text><text x="60" y="541" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Tipuana tipu</text><text x="60" y="563" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 139 in Porta</text><circle cx="700" cy="541" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="541" r="15" fill="#3B7F4A"/><circle cx="880" cy="541" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="541" r="15" fill="#3B7F4A"/><circle cx="1060" cy="541" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="541" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1420" cy="541" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M1420,526 A15,15 0 0,0 1420,556 Z" fill="#D9622B"/><text x="1442" y="531" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">c</text><text x="60" y="597" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start" font-style="italic">Brachychiton populneus</text><text x="60" y="619" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">candidate, 103 in Porta</text><circle cx="700" cy="597" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="700" cy="597" r="15" fill="#3B7F4A"/><circle cx="880" cy="597" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="880" cy="597" r="15" fill="#3B7F4A"/><circle cx="1060" cy="597" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="597" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1420" cy="597" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M1420,582 A15,15 0 0,0 1420,612 Z" fill="#D9622B"/><text x="1442" y="587" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">e</text><circle cx="60" cy="641" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><circle cx="60" cy="641" r="10" fill="#1F2933"/><text x="78" y="647" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">yes / measured</text><circle cx="250" cy="641" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><path d="M250,631 A10,10 0 0,0 250,651 Z" fill="#1F2933"/><text x="268" y="647" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">partly</text><circle cx="440" cy="641" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><text x="458" y="647" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">no</text><text x="60" y="671" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(a) Celtis: only the congener C. sinensis is measured (0.71 mm; Xiao &amp; McPherson 2016)</text><text x="60" y="689" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(b) Pyrus: UTCI -3.5 to -6.3 °C, but modelled as a default ENVI-met tree, so it reflects size, not species (Silva et al. 2025)</text><text x="60" y="707" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(c) Tipuana: PET up to -15.6 °C in summer, but up to -2.7 °C in winter (leafed, as cited); modelled with measured under-crown radiation (Santos Nouri et al. 2018)</text><text x="60" y="725" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(d) Jacaranda: 15.3% interception for a small tree, city-scale model, second-hand (Xiao &amp; McPherson 2003, cited in Huang et al. 2017)</text><text x="60" y="743" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">(e) Brachychiton, Jacaranda: water use only, second-hand (McCarthy et al. 2011 via Berland et al. 2017; Pataki et al. 2011 via Thom et al. 2022)</text><text x="60" y="791" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Every candidate's crown can be measured on site. Rain storage is measured for one candidate (Pyrus), plus Celtis through a congener; cooling values are</text><text x="60" y="816" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">only modelled or second-hand. The method fills the gaps with trait proxies and sensitivity ranges, and reports them as a finding.</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: databases/traits/porta_trait_table.csv (ICGC LiDAR 2021; 3TF v1.3; BROT 2.0; notes/lit/species_measurements.csv). TRY and i-Tree requests pending.</text></svg>