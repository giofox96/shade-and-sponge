<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">No method yet chooses species and positions for heat and runoff together</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">Closest precedents from the review vs this thesis</text><text x="880" y="190" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">Heat stress (UTCI</text><text x="880" y="212" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">/ MRT)</text><text x="1060" y="190" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">Pluvial runoff</text><text x="1240" y="190" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">Species traits</text><text x="1240" y="212" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">drive results</text><text x="1420" y="190" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">Optimises species</text><text x="1420" y="212" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">and positions</text><text x="60" y="254" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">Nicol et al. 2026: SylvCiT</text><text x="60" y="275" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">Trait-based species recommender, Montreal; runoff module disabled; diversity traits only</text><circle cx="880" cy="260" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="1060" cy="260" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1240" cy="260" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><path d="M1240,245 A15,15 0 0,0 1240,275 Z" fill="#3B7F4A"/><circle cx="1420" cy="260" r="15" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><path d="M1420,245 A15,15 0 0,0 1420,275 Z" fill="#1F2933"/><text x="60" y="308" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">Pacetti et al. 2022</text><text x="60" y="329" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">Pluvial-flood hotspot index for siting NBS, Florence; no runoff simulation</text><circle cx="880" cy="314" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="1060" cy="314" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><path d="M1060,299 A15,15 0 0,0 1060,329 Z" fill="#2F6DB5"/><circle cx="1240" cy="314" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1420" cy="314" r="15" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><path d="M1420,299 A15,15 0 0,0 1420,329 Z" fill="#1F2933"/><text x="60" y="362" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">Cortinovis et al. 2022</text><text x="60" y="383" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">Barcelona-wide NBS scenarios: InVEST heat index + curve-number runoff; trees as land cover</text><circle cx="880" cy="368" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M880,353 A15,15 0 0,0 880,383 Z" fill="#D9622B"/><circle cx="1060" cy="368" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1060" cy="368" r="15" fill="#2F6DB5"/><circle cx="1240" cy="368" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1420" cy="368" r="15" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><text x="60" y="416" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">Hao et al. 2023</text><text x="60" y="437" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">Genetic algorithm places identical trees in a Hong Kong park for UTCI; no species</text><circle cx="880" cy="422" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="880" cy="422" r="15" fill="#D9622B"/><circle cx="1060" cy="422" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1240" cy="422" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1420" cy="422" r="15" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><path d="M1420,407 A15,15 0 0,0 1420,437 Z" fill="#1F2933"/><text x="60" y="470" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">Wu et al. 2024</text><text x="60" y="491" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">Canopy energy balance + SWMM, Sendai; LAI and greening scenarios, surface temperature</text><circle cx="880" cy="476" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M880,461 A15,15 0 0,0 880,491 Z" fill="#D9622B"/><circle cx="1060" cy="476" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1060" cy="476" r="15" fill="#2F6DB5"/><circle cx="1240" cy="476" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><path d="M1240,461 A15,15 0 0,0 1240,491 Z" fill="#3B7F4A"/><circle cx="1420" cy="476" r="15" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><text x="60" y="524" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">Mannucci et al. 2025</text><text x="60" y="545" font-size="15" fill="#6B7280" font-weight="normal" text-anchor="start">Grasshopper + Ladybug + curve number, one square in Rome; scenarios, trees as shade only</text><circle cx="880" cy="530" r="15" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="880" cy="530" r="15" fill="#D9622B"/><circle cx="1060" cy="530" r="15" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1060" cy="530" r="15" fill="#2F6DB5"/><circle cx="1240" cy="530" r="15" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1420" cy="530" r="15" fill="#FFFFFF" 