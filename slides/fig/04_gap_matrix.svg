<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">No method yet chooses species and positions for heat and runoff together</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">Closest precedents from the review vs this thesis</text><text x="880" y="190" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">Heat stress (UTCI</text><text x="880" y="212" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">/ MRT)</text><text x="1060" y="190" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">Pluvial runoff</text><text x="1240" y="190" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">Species traits</text><text x="1240" y="212" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">drive results</text><text x="1420" y="190" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">Optimises species</text><text x="1420" y="212" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">and positions</text><text x="60" y="270" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Nicol et al. 2026: SylvCiT</text><text x="60" y="296" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Trait-based species recommender, Montreal; runoff module disabled; diversity traits only</text><circle cx="880" cy="280" r="17" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="1060" cy="280" r="17" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1240" cy="280" r="17" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><path d="M1240,263 A17,17 0 0,0 1240,297 Z" fill="#3B7F4A"/><circle cx="1420" cy="280" r="17" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><path d="M1420,263 A17,17 0 0,0 1420,297 Z" fill="#1F2933"/><text x="60" y="344" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Pacetti et al. 2022</text><text x="60" y="370" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Pluvial-flood hotspot index for siting NBS, Florence; no runoff simulation</text><circle cx="880" cy="354" r="17" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="1060" cy="354" r="17" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><path d="M1060,337 A17,17 0 0,0 1060,371 Z" fill="#2F6DB5"/><circle cx="1240" cy="354" r="17" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1420" cy="354" r="17" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><path d="M1420,337 A17,17 0 0,0 1420,371 Z" fill="#1F2933"/><text x="60" y="418" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Wu et al. 2024</text><text x="60" y="444" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Canopy energy balance + SWMM, Sendai; LAI and greening scenarios, surface temperature</text><circle cx="880" cy="428" r="17" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M880,411 A17,17 0 0,0 880,445 Z" fill="#D9622B"/><circle cx="1060" cy="428" r="17" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1060" cy="428" r="17" fill="#2F6DB5"/><circle cx="1240" cy="428" r="17" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><path d="M1240,411 A17,17 0 0,0 1240,445 Z" fill="#3B7F4A"/><circle cx="1420" cy="428" r="17" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><text x="60" y="492" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Mannucci et al. 2025</text><text x="60" y="518" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Grasshopper + Ladybug + curve number, one square in Rome; scenarios, trees as shade only</text><circle cx="880" cy="502" r="17" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="880" cy="502" r="17" fill="#D9622B"/><circle cx="1060" cy="502" r="17" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1060" cy="502" r="17" fill="#2F6DB5"/><circle cx="1240" cy="502" r="17" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1420" cy="502" r="17" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><text x="60" y="566" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Shaamala et al. 2025</text><text x="60" y="592" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Ant-colony optimisation of 42 trees and 4 species (chosen by crown shape) against UTCI</text><circle cx="880" cy="576" r="17" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="880" cy="576" r="17" fill="#D9622B"/><circle cx="1060" cy="576" r="17" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1240" cy="576" r="17" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><path d="M1240,559 A17,17 0 0,0 1240,593 Z" fill="#3B7F4A"/><circle cx="1420" cy="576" r="17" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><circle cx="1420" cy="576" r="17" fill="#1F2933"/><text x="60" y="640" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Peng et al. 2026</text><text x="60" y="666" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Ladybug + NSGA-II with LAI-based canopy transmittance; generic tree types, UTCI and cost</text><circle cx="880" cy="650" r="17" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="880" cy="650" r="17" fill="#D9622B"/><circle cx="1060" cy="650" r="17" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1240" cy="650" r="17" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><path d="M1240,633 A17,17 0 0,0 1240,667 Z" fill="#3B7F4A"/><circle cx="1420" cy="650" r="17" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><circle cx="1420" cy="650" r="17" fill="#1F2933"/><rect x="45" y="686" width="1510" height="70" rx="8" fill="#3B7F4A" fill-opacity="0.1" stroke="none" stroke-width="2"/><text x="60" y="714" font-size="21" fill="#3B7F4A" font-weight="bold" text-anchor="start">This thesis</text><text x="60" y="740" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Plane-tree replacement in Porta, Barcelona: species and positions for UTCI and runoff</text><circle cx="880" cy="724" r="17" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="880" cy="724" r="17" fill="#D9622B"/><circle cx="1060" cy="724" r="17" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1060" cy="724" r="17" fill="#2F6DB5"/><circle cx="1240" cy="724" r="17" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="724" r="17" fill="#3B7F4A"/><circle cx="1420" cy="724" r="17" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><circle cx="1420" cy="724" r="17" fill="#1F2933"/><circle cx="60" cy="788" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><circle cx="60" cy="788" r="10" fill="#1F2933"/><text x="78" y="794" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">yes / measured</text><circle cx="250" cy="788" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><path d="M250,778 A10,10 0 0,0 250,798 Z" fill="#1F2933"/><text x="268" y="794" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">partly</text><circle cx="440" cy="788" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><text x="458" y="794" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">no</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: literature_matrix.csv rows 18, 28, 51-53, 56 (all read in full). Half ball: Wu = surface temperature, not UTCI; Shaamala = crown shape only; Peng = generic LAI classes. Still to screen: Tan et al. 2026.</text></svg>