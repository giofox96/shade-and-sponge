<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">No method yet chooses species and positions for heat and runoff together</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">Closest precedents from the review vs this thesis</text><text x="880" y="190" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">Heat stress (UTCI</text><text x="880" y="212" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">/ MRT)</text><text x="1060" y="190" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">Pluvial runoff</text><text x="1240" y="190" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">Species traits</text><text x="1240" y="212" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">drive results</text><text x="1420" y="190" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">Optimises species</text><text x="1420" y="212" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="middle">and positions</text><text x="60" y="260" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Nicol et al. 2026: SylvCiT</text><text x="60" y="284" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Trait-based species recommender, Montreal; runoff module disabled; diversity traits only</text><circle cx="880" cy="268" r="16" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="1060" cy="268" r="16" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1240" cy="268" r="16" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><path d="M1240,252 A16,16 0 0,0 1240,284 Z" fill="#3B7F4A"/><circle cx="1420" cy="268" r="16" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><path d="M1420,252 A16,16 0 0,0 1420,284 Z" fill="#1F2933"/><text x="60" y="320" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Pacetti et al. 2022</text><text x="60" y="344" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Pluvial-flood hotspot index for siting NBS, Florence; no runoff simulation</text><circle cx="880" cy="328" r="16" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="1060" cy="328" r="16" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><path d="M1060,312 A16,16 0 0,0 1060,344 Z" fill="#2F6DB5"/><circle cx="1240" cy="328" r="16" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1420" cy="328" r="16" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><path d="M1420,312 A16,16 0 0,0 1420,344 Z" fill="#1F2933"/><text x="60" y="380" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Cortinovis et al. 2022</text><text x="60" y="404" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Barcelona-wide NBS scenarios: InVEST heat index + curve-number runoff; trees as land cover</text><circle cx="880" cy="388" r="16" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M880,372 A16,16 0 0,0 880,404 Z" fill="#D9622B"/><circle cx="1060" cy="388" r="16" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1060" cy="388" r="16" fill="#2F6DB5"/><circle cx="1240" cy="388" r="16" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1420" cy="388" r="16" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><text x="60" y="440" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Hao et al. 2023</text><text x="60" y="464" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Genetic algorithm places identical trees in a Hong Kong park for UTCI; no species</text><circle cx="880" cy="448" r="16" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="880" cy="448" r="16" fill="#D9622B"/><circle cx="1060" cy="448" r="16" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1240" cy="448" r="16" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1420" cy="448" r="16" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><path d="M1420,432 A16,16 0 0,0 1420,464 Z" fill="#1F2933"/><text x="60" y="500" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Wu et al. 2024</text><text x="60" y="524" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Canopy energy balance + SWMM, Sendai; LAI and greening scenarios, surface temperature</text><circle cx="880" cy="508" r="16" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><path d="M880,492 A16,16 0 0,0 880,524 Z" fill="#D9622B"/><circle cx="1060" cy="508" r="16" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1060" cy="508" r="16" fill="#2F6DB5"/><circle cx="1240" cy="508" r="16" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><path d="M1240,492 A16,16 0 0,0 1240,524 Z" fill="#3B7F4A"/><circle cx="1420" cy="508" r="16" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><text x="60" y="560" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Mannucci et al. 2025</text><text x="60" y="584" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Grasshopper + Ladybug + curve number, one square in Rome; scenarios, trees as shade only</text><circle cx="880" cy="568" r="16" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="880" cy="568" r="16" fill="#D9622B"/><circle cx="1060" cy="568" r="16" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1060" cy="568" r="16" fill="#2F6DB5"/><circle cx="1240" cy="568" r="16" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1420" cy="568" r="16" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><text x="60" y="620" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Shaamala et al. 2025</text><text x="60" y="644" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Ant-colony optimisation of 42 trees and 4 species (chosen by crown shape) against UTCI</text><circle cx="880" cy="628" r="16" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="880" cy="628" r="16" fill="#D9622B"/><circle cx="1060" cy="628" r="16" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1240" cy="628" r="16" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><path d="M1240,612 A16,16 0 0,0 1240,644 Z" fill="#3B7F4A"/><circle cx="1420" cy="628" r="16" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><circle cx="1420" cy="628" r="16" fill="#1F2933"/><text x="60" y="680" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Peng et al. 2026</text><text x="60" y="704" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Ladybug + NSGA-II with LAI-based canopy transmittance; generic tree types, UTCI and cost</text><circle cx="880" cy="688" r="16" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="880" cy="688" r="16" fill="#D9622B"/><circle cx="1060" cy="688" r="16" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1240" cy="688" r="16" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><path d="M1240,672 A16,16 0 0,0 1240,704 Z" fill="#3B7F4A"/><circle cx="1420" cy="688" r="16" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><circle cx="1420" cy="688" r="16" fill="#1F2933"/><rect x="45" y="714" width="1510" height="60" rx="8" fill="#3B7F4A" fill-opacity="0.1" stroke="none" stroke-width="2"/><text x="60" y="740" font-size="21" fill="#3B7F4A" font-weight="bold" text-anchor="start">This thesis</text><text x="60" y="764" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">Plane-tree replacement in Porta, Barcelona: species and positions for UTCI and runoff</text><circle cx="880" cy="748" r="16" fill="#FFFFFF" stroke="#D9622B" stroke-width="2.5"/><circle cx="880" cy="748" r="16" fill="#D9622B"/><circle cx="1060" cy="748" r="16" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="2.5"/><circle cx="1060" cy="748" r="16" fill="#2F6DB5"/><circle cx="1240" cy="748" r="16" fill="#FFFFFF" stroke="#3B7F4A" stroke-width="2.5"/><circle cx="1240" cy="748" r="16" fill="#3B7F4A"/><circle cx="1420" cy="748" r="16" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><circle cx="1420" cy="748" r="16" fill="#1F2933"/><circle cx="60" cy="800" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><circle cx="60" cy="800" r="10" fill="#1F2933"/><text x="78" y="806" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">yes / measured</text><circle cx="250" cy="800" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><path d="M250,790 A10,10 0 0,0 250,810 Z" fill="#1F2933"/><text x="268" y="806" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">partly</text><circle cx="440" cy="800" r="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/><text x="458" y="806" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">no</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: literature_matrix.csv rows 18, 28, 51-53, 56, 62, 69 (all read in full). Half ball: Wu = surface temperature, not UTCI; Cortinovis = heat index, not UTCI; Hao = positions only; Shaamala = crown shape only; Peng =</text><text x="60" y="869" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">generic LAI classes. Still to screen: Tan et al. 2026.</text></svg>