<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">What I cannot do yet, and what would unblock me</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">Limits first, then three asks and the plan to 18 December</text><rect x="60" y="170" width="860" height="520" rx="12" fill="#B7791F" fill-opacity="0.07" stroke="none" stroke-width="2"/><rect x="60" y="170" width="860" height="6" rx="0" fill="#B7791F" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="82" y="208" font-size="18" fill="#B7791F" font-weight="bold" text-anchor="start">LIMITS I STATE BEFORE YOU ASK</text><text x="82" y="246" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">Hazard index, not water depth</text><text x="82" y="271" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">the site was chosen on an index; our own routing is not a flood map (ROC AUC 0.52 against</text><text x="82" y="293" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">RESCCUE)</text><text x="82" y="329" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">Volume only</text><text x="82" y="354" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">no sewer, no routing to outlets, no ponding, and no peak flow</text><text x="82" y="390" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">The LiDAR LAI proxy is probably low</text><text x="82" y="415" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">so canopy storage is underestimated, and s is the same for every species</text><text x="82" y="451" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">H3 is true by construction</text><text x="82" y="476" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">with a full crown at every storm the falling percentage is arithmetic: I declare it a boundary</text><text x="82" y="512" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">Runoff may not separate the palettes</text><text x="82" y="538" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">if the best palette stays under Δmin = 91 m³ the runoff half of H1 is "not resolved" — which is</text><text x="82" y="560" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">still a result</text><text x="82" y="596" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">Surface temperature ≠ pedestrian UTCI</text><text x="82" y="621" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">and the EPW is the airport, not the street; the design hour misses the night</text><text x="82" y="657" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">Most palette species have no measured traits</text><text x="82" y="682" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">ranges and sensitivity instead — and that gap is itself a finding</text><rect x="960" y="170" width="580" height="520" rx="12" fill="#3B7F4A" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="960" y="170" width="580" height="6" rx="0" fill="#3B7F4A" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="982" y="208" font-size="18" fill="#3B7F4A" font-weight="bold" text-anchor="start">WHAT WOULD UNBLOCK ME</text><text x="982" y="252" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">1.  The RESCCUE depth maps, usable in a thesis</text><text x="982" y="279" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">the T10/T100 tables are public; what I lack is a licence</text><text x="982" y="301" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">statement for thesis use</text><rect x="982" y="327" width="205" height="26" rx="13" fill="#B7791F" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="1084" y="345" font-size="14" fill="#B7791F" font-weight="bold" text-anchor="middle">asked 13 Oct, no reply</text><text x="982" y="379" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">2.  Access to Infrared City</text><text x="982" y="406" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">it would replace the fast heat proxy inside the optimiser, with</text><text x="982" y="428" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">Ladybug kept as the cross-check</text><rect x="982" y="454" width="163" height="26" rx="13" fill="#2F6DB5" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="1063" y="472" font-size="14" fill="#2F6DB5" font-weight="bold" text-anchor="middle">you co-founded it</text><text x="982" y="506" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">3.  The Florence point cloud</text><text x="982" y="533" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">the decisive missing input for the transfer case (Florence also</text><text x="982" y="556" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">has a 1 h IDF floor and an NC-ND licence)</text><rect x="982" y="582" width="230" height="26" rx="13" fill="#B7791F" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="1097" y="600" font-size="14" fill="#B7791F" font-weight="bold" text-anchor="middle">request drafted, not sent</text><text x="60" y="738" font-size="18" fill="#1F2933" font-weight="bold" text-anchor="start">Plan to 18 December</text><rect x="60" y="756" width="282" height="62" rx="8" fill="#1F2933" fill-opacity="0.06" stroke="none" stroke-width="2"/><text x="74" y="780" font-size="16" fill="#1F2933" font-weight="bold" text-anchor="start">21 Oct – 3 Nov</text><text x="74" y="800" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">LiDAR trees, trait table, runoff</text><text x="74" y="818" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">validation</text><rect x="360" y="756" width="282" height="62" rx="8" fill="#1F2933" fill-opacity="0.06" stroke="none" stroke-width="2"/><text x="374" y="780" font-size="16" fill="#1F2933" font-weight="bold" text-anchor="start">4 – 17 Nov</text><text x="374" y="800" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">Ladybug Tier 1, heat proxy</text><text x="374" y="818" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">calibration</text><rect x="660" y="756" width="282" height="62" rx="8" fill="#1F2933" fill-opacity="0.06" stroke="none" stroke-width="2"/><text x="674" y="780" font-size="16" fill="#1F2933" font-weight="bold" text-anchor="start">18 Nov – 1 Dec</text><text x="674" y="800" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">optimisation S2–S4, Tier 2 checks</text><rect x="960" y="756" width="282" height="62" rx="8" fill="#1F2933" fill-opacity="0.06" stroke="none" stroke-width="2"/><text x="974" y="780" font-size="16" fill="#1F2933" font-weight="bold" text-anchor="start">2 – 10 Dec</text><text x="974" y="800" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">Sant Antoni and the transfer city,</text><text x="974" y="818" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">sensitivity</text><rect x="1260" y="756" width="282" height="62" rx="8" fill="#1F2933" fill-opacity="0.06" stroke="none" stroke-width="2"/><text x="1274" y="780" font-size="16" fill="#1F2933" font-weight="bold" text-anchor="start">11 – 18 Dec</text><text x="1274" y="800" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">booklet, figures, final presentation</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: notes/methodology.md sections 10 and 11; notes/decisions/hypothesis_tests.md and runoff_metric_sensitivity.md; notes/resccue_data_request.md; notes/firenze_lidar_request.md; notes/todo_manual.md;</text><text x="60" y="869" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">scripts/compare_resccue_runoff.py (AUC 0.52).</text></svg>