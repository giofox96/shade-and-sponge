<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">What I cannot do yet, and what would unblock me</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Limits first, then three asks and the plan to 18 December</text><rect x="60" y="170" width="860" height="520" rx="12" fill="#8C6A24" fill-opacity="0.07" stroke="none" stroke-width="2"/><rect x="60" y="170" width="860" height="6" rx="0" fill="#8C6A24" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="82" y="208" font-size="18" fill="#8C6A24" font-weight="bold" text-anchor="start">LIMITS I STATE</text><text x="82" y="244" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="start">Hazard index, not water depth</text><text x="82" y="269" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">the site was chosen on an index; our own routing is not a flood map (ROC AUC 0.52 against</text><text x="82" y="291" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">RESCCUE)</text><text x="82" y="321" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="start">Volume only</text><text x="82" y="346" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">no sewer, no routing to outlets, no ponding, and no peak flow</text><text x="82" y="376" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="start">The LiDAR LAI proxy is probably low</text><text x="82" y="401" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">so canopy storage is underestimated, and s is the same for every species</text><text x="82" y="431" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="start">One hypothesis withdrawn (19 Oct)</text><text x="82" y="456" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">H3 could not fail: with a full crown at every storm the falling percentage is arithmetic,</text><text x="82" y="479" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">so it is a declared boundary, not a test</text><text x="82" y="509" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="start">Runoff may not separate the palettes</text><text x="82" y="534" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">if the best palette stays under Δmin = 91 m³ the runoff half of H1 is "not resolved" —</text><text x="82" y="556" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">which is still a result</text><text x="82" y="586" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="start">Surface temperature ≠ pedestrian UTCI</text><text x="82" y="611" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">and the EPW is the airport, not the street; the design hour misses the night</text><text x="82" y="641" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="start">Most palette species have no measured traits</text><text x="82" y="666" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">ranges and sensitivity instead — and that gap is itself a finding</text><rect x="960" y="170" width="580" height="520" rx="12" fill="#3F663E" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="960" y="170" width="580" height="6" rx="0" fill="#3F663E" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="982" y="208" font-size="18" fill="#3F663E" font-weight="bold" text-anchor="start">WHAT WOULD UNBLOCK ME</text><text x="982" y="256" font-size="21" fill="#2A2622" font-weight="bold" text-anchor="start">1.  The RESCCUE depth maps, usable in a thesis</text><text x="982" y="283" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">the T10/T100 tables are public; what I lack is a licence</text><text x="982" y="305" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">statement for thesis use</text><text x="982" y="357" font-size="21" fill="#2A2622" font-weight="bold" text-anchor="start">2.  Access to Infrared City</text><text x="982" y="384" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">it would replace the fast heat proxy inside the optimiser,</text><text x="982" y="406" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">with Ladybug kept as the cross-check</text><text x="982" y="458" font-size="21" fill="#2A2622" font-weight="bold" text-anchor="start">3.  The Florence point cloud</text><text x="982" y="485" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">the decisive missing input for the transfer case (Florence</text><text x="982" y="508" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">also has a 1 h IDF floor and an NC-ND licence)</text><text x="60" y="738" font-size="18" fill="#2A2622" font-weight="bold" text-anchor="start">Plan to 18 December</text><rect x="60" y="756" width="282" height="62" rx="8" fill="#2A2622" fill-opacity="0.06" stroke="none" stroke-width="2"/><text x="74" y="780" font-size="16" fill="#2A2622" font-weight="bold" text-anchor="start">21 Oct – 3 Nov</text><text x="74" y="800" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">LiDAR trees, trait table, runoff</text><text x="74" y="818" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">validation</text><rect x="360" y="756" width="282" height="62" rx="8" fill="#2A2622" fill-opacity="0.06" stroke="none" stroke-width="2"/><text x="374" y="780" font-size="16" fill="#2A2622" font-weight="bold" text-anchor="start">4 – 17 Nov</text><text x="374" y="800" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">Ladybug Tier 1, heat proxy</text><text x="374" y="818" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">calibration</text><rect x="660" y="756" width="282" height="62" rx="8" fill="#2A2622" fill-opacity="0.06" stroke="none" stroke-width="2"/><text x="674" y="780" font-size="16" fill="#2A2622" font-weight="bold" text-anchor="start">18 Nov – 1 Dec</text><text x="674" y="800" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">optimisation S2–S4, Tier 2 checks</text><rect x="960" y="756" width="282" height="62" rx="8" fill="#2A2622" fill-opacity="0.06" stroke="none" stroke-width="2"/><text x="974" y="780" font-size="16" fill="#2A2622" font-weight="bold" text-anchor="start">2 – 10 Dec</text><text x="974" y="800" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">Sant Antoni and the transfer city,</text><text x="974" y="818" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">sensitivity</text><rect x="1260" y="756" width="282" height="62" rx="8" fill="#2A2622" fill-opacity="0.06" stroke="none" stroke-width="2"/><text x="1274" y="780" font-size="16" fill="#2A2622" font-weight="bold" text-anchor="start">11 – 18 Dec</text><text x="1274" y="800" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">booklet, figures, final</text><text x="1274" y="818" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">presentation</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: notes/methodology.md sections 10 and 11; notes/decisions/hypothesis_tests.md and runoff_metric_sensitivity.md; notes/resccue_data_request.md; notes/firenze_lidar_request.md; notes/todo_manual.md;</text><text x="60" y="869" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">scripts/compare_resccue_runoff.py (AUC 0.52).</text></svg>