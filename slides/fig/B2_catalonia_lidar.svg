<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">22 Catalan cities, screened on the one input that decides a transfer</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">ICGC Territorial LiDAR v3: the per-sheet metadata gives only the flight YEAR, so each date was read from PER-POINT GPS time in the cloud itself</text><rect x="45" y="170" width="1510" height="104" rx="8" fill="#3F663E" fill-opacity="0.1" stroke="none" stroke-width="2"/><rect x="45" y="170" width="6" height="104" rx="0" fill="#3F663E" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="70" y="198" font-size="19" fill="#3F663E" font-weight="bold" text-anchor="start">SAME MISSION DAY AS PORTA — 26 September 2021</text><text x="70" y="222" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">zero season, sensor or campaign-year difference from the calibration site</text><text x="70" y="252" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Porta, Barcelona — control</text><text x="70" y="271" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-09-26</text><text x="440" y="252" font-size="17" fill="#3F663E" font-weight="bold" text-anchor="start">Badalona</text><text x="440" y="271" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-09-26   12.3-15.7 pts/m²</text><text x="810" y="252" font-size="17" fill="#3F663E" font-weight="bold" text-anchor="start">Santa Coloma de Gramenet</text><text x="810" y="271" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-09-26   12.9 pts/m²</text><text x="1180" y="252" font-size="17" fill="#3F663E" font-weight="bold" text-anchor="start">Sant Cugat</text><text x="1180" y="271" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-09-26   13.5 pts/m²</text><rect x="45" y="292" width="1510" height="300" rx="8" fill="#3F663E" fill-opacity="0.05" stroke="none" stroke-width="2"/><rect x="45" y="292" width="6" height="300" rx="0" fill="#3F663E" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="70" y="320" font-size="19" fill="#3F663E" font-weight="bold" text-anchor="start">LEAF-ON AND CLASSIFIED — 15 more cities, other 2021–22 missions</text><text x="70" y="344" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">usable for the gap-fraction LAI proxy; densities exclude the class-12 overlap strips</text><text x="70" y="376" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Reus</text><text x="70" y="395" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-09-17 + 08-01   11.8-14.1 pts/m²</text><text x="440" y="376" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Vilanova</text><text x="440" y="395" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-08-01   12.0 pts/m²</text><text x="810" y="376" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Tarragona</text><text x="810" y="395" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-07-27   11.7-15.8 pts/m²</text><text x="1180" y="376" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Igualada</text><text x="1180" y="395" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-07-21   12.3 pts/m²</text><text x="70" y="430" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Sabadell</text><text x="70" y="449" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-07-20   10.3-14.0 pts/m²</text><text x="440" y="430" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Terrassa</text><text x="440" y="449" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-07-20   14.2-17.9 pts/m²</text><text x="810" y="430" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Mataro</text><text x="810" y="449" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-07-20   12.5-13.6 pts/m²</text><text x="1180" y="430" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Rubi</text><text x="1180" y="449" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-07-20 + 09-26   12.8 pts/m²</text><text x="70" y="484" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Granollers</text><text x="70" y="503" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-06-26 + 07-20   13.3 pts/m²</text><text x="440" y="484" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Tortosa</text><text x="440" y="503" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-07-19   11.9 pts/m²</text><text x="810" y="484" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">L'Hospitalet</text><text x="810" y="503" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2022-06-01   11.7 pts/m²</text><text x="1180" y="484" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Cornella</text><text x="1180" y="503" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2022-06-01   12.7 pts/m²</text><text x="70" y="538" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Lleida</text><text x="70" y="557" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2022-05-23   14.3 pts/m²</text><text x="440" y="538" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">Castelldefels</text><text x="440" y="557" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2022-10-01   12.8 pts/m²</text><text x="810" y="538" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">El Prat</text><text x="810" y="557" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2022-10-01   12.1 pts/m²</text><rect x="45" y="610" width="735" height="150" rx="8" fill="#8C6A24" fill-opacity="0.1" stroke="none" stroke-width="2"/><rect x="45" y="610" width="6" height="150" rx="0" fill="#8C6A24" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="70" y="638" font-size="19" fill="#8C6A24" font-weight="bold" text-anchor="start">LEAF-ON BUT UNCLASSIFIED — 3</text><text x="70" y="662" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">no ground / vegetation / building classes in the clip: no gap fraction</text><text x="70" y="690" font-size="17" fill="#8C6A24" font-weight="bold" text-anchor="start">Girona</text><text x="70" y="709" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-08-26</text><text x="305" y="690" font-size="17" fill="#8C6A24" font-weight="bold" text-anchor="start">Vic</text><text x="305" y="709" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2023-07-19</text><text x="540" y="690" font-size="17" fill="#8C6A24" font-weight="bold" text-anchor="start">Figueres</text><text x="540" y="709" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-04-24 + 05-04</text><text x="70" y="740" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">Figueres is excluded by classification, not by phenology: April is leaf-on for 6 of the 8 palette species</text><rect x="810" y="610" width="745" height="150" rx="8" fill="#665E4F" fill-opacity="0.1" stroke="none" stroke-width="2"/><rect x="810" y="610" width="6" height="150" rx="0" fill="#665E4F" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="835" y="638" font-size="19" fill="#665E4F" font-weight="bold" text-anchor="start">LEAF-OFF — 1</text><text x="835" y="662" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">ruled out on season, and unclassified as well</text><text x="835" y="690" font-size="17" fill="#665E4F" font-weight="bold" text-anchor="start">Manresa</text><text x="835" y="709" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">2021-11-18</text><text x="835" y="740" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">November: outside the May-October leaf-on window of every palette species</text><rect x="45" y="768" width="1510" height="70" rx="8" fill="#8C6A24" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="45" y="768" width="6" height="70" rx="0" fill="#8C6A24" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="70" y="792" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">How to read this: each date is from ONE 150x150 m clip at the city centre, so it is the date AT THE SAMPLED CLIP, not across the city. Rubi and Granollers split two missions inside a</text><text x="70" y="812" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">single clip, and a mission boundary runs through Porta's own tile.</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: databases/catalonia_lidar_dates.csv (see its header). LIMIT: one 150x150 m clip per city (~0.0225 km2) in municipalities of 10-100+ km2 — read each date as 'at the sampled clip', not 'the city'; Rubi and</text><text x="60" y="869" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Granollers split missions inside one clip. Control: the Porta clip returned 867,739 points, 100% 2021-09-26, agreeing with the date derived by a different route in data_inventory_barcelona.md section G. Leaf-on</text><text x="60" y="886" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">judged against databases/traits/phenology_palette.csv. Full screening: notes/catalan_transfer_city.md.</text></svg>