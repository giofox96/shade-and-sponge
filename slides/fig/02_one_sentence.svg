<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">species × position → heat + runoff → trade-off</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">The whole thesis in one line, and its boundaries</text><rect x="60" y="180" width="420" height="300" rx="12" fill="#1F2933" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="180" width="420" height="6" rx="0" fill="#1F2933" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="82" y="218" font-size="18" fill="#1F2933" font-weight="bold" text-anchor="start">1  THE DECISION</text><text x="82" y="262" font-size="34" fill="#1F2933" font-weight="bold" text-anchor="start">832 plane positions</text><text x="82" y="308" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">Which of 7 candidate species goes at</text><text x="82" y="333" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">each position, as the planes come out.</text><text x="82" y="369" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">Positions are given: the existing pits.</text><rect x="590" y="180" width="420" height="300" rx="12" fill="#D9622B" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="590" y="180" width="420" height="6" rx="0" fill="#D9622B" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="612" y="218" font-size="18" fill="#D9622B" font-weight="bold" text-anchor="start">2  TWO SCORES, SEPARATELY</text><text x="612" y="262" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">f1  pedestrian heat stress: mean UTCI</text><text x="612" y="287" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">over 12–17 h on a hot design day</text><text x="612" y="311" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">(decided 19 Oct; the peak hour</text><text x="612" y="336" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">saturates).</text><text x="612" y="373" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">f2  event runoff volume: design storms</text><text x="612" y="398" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">T = 1, 2 and 10 yr.</text><rect x="1120" y="180" width="420" height="300" rx="12" fill="#3B7F4A" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="1120" y="180" width="420" height="6" rx="0" fill="#3B7F4A" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1142" y="218" font-size="18" fill="#3B7F4A" font-weight="bold" text-anchor="start">3  THE ANSWER</text><text x="1142" y="262" font-size="34" fill="#3B7F4A" font-weight="bold" text-anchor="start">the trade-off</text><text x="1142" y="308" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">A Pareto front: every layout on it is</text><text x="1142" y="333" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">optimal, and the shape of the front is</text><text x="1142" y="357" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">the trade-off itself.</text><text x="1142" y="394" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">Plus the price of each goal, in the</text><text x="1142" y="419" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">other.</text><line x1="490" y1="330" x2="578" y2="330" stroke="#6B7280" stroke-width="3" marker-end="url(#arr)"/><line x1="1020" y1="330" x2="1108" y2="330" stroke="#6B7280" stroke-width="3" marker-end="url(#arr)"/><rect x="60" y="520" width="1480" height="112" rx="12" fill="#2F6DB5" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="82" y="556" font-size="16" fill="#2F6DB5" font-weight="bold" text-anchor="start">CONSTRAINTS, NOT OBJECTIVES</text><text x="82" y="592" font-size="21" fill="#1F2933" font-weight="normal" text-anchor="start">≤ 15% per species  ·  Shannon diversity floor  ·  no invasive or pest-host species  ·  crown clearance from façades</text><text x="82" y="618" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">The city's own rules bound the search; they are not things the optimiser trades away.</text><text x="60" y="700" font-size="18" fill="#B7791F" font-weight="bold" text-anchor="start">What it is NOT</text><text x="60" y="740" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">not a flood model</text><text x="60" y="772" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">hotspots come from the city's own depth map, not from</text><text x="60" y="794" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">my routing</text><text x="560" y="740" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">not a city-wide plan</text><text x="560" y="772" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">one 0.84 km² neighbourhood, calibrated, with the</text><text x="560" y="794" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">transfer cost stated</text><text x="1060" y="740" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">not a species ranking</text><text x="1060" y="772" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">a layout is scored, not a species: the same tree is</text><text x="1060" y="794" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">good or bad by where it stands</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: notes/topic_decision.md section 7; notes/methodology.md sections 1, 6 and 7; shade_sponge/README.md.</text></svg>