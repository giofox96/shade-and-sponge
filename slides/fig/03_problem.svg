<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">Two hazards, one street, one decision</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Why this is a design decision and not a slogan</text><rect x="60" y="170" width="480" height="480" rx="12" fill="#283F66" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="170" width="480" height="6" rx="0" fill="#283F66" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="82" y="208" font-size="18" fill="#283F66" font-weight="bold" text-anchor="start">RAIN</text><text x="82" y="258" font-size="32" fill="#283F66" font-weight="bold" text-anchor="start">45% → 72%</text><text x="82" y="290" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">sealed surface of the municipality, 1956–2009</text><text x="82" y="339" font-size="32" fill="#283F66" font-weight="bold" text-anchor="start">~3 storms a year</text><text x="82" y="371" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">exceed 60 mm/h in their first 20 minutes, and</text><text x="82" y="395" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">flood streets where the sewer lacks capacity</text><text x="82" y="444" font-size="32" fill="#283F66" font-weight="bold" text-anchor="start">T = 10 yr</text><text x="82" y="476" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">is what the sewer is sized for, per the city</text><text x="82" y="500" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">resilience atlas: above that, the surface</text><text x="82" y="523" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">carries the water</text><rect x="570" y="170" width="480" height="480" rx="12" fill="#663825" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="570" y="170" width="480" height="6" rx="0" fill="#663825" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="592" y="208" font-size="18" fill="#663825" font-weight="bold" text-anchor="start">HEAT</text><text x="592" y="258" font-size="32" fill="#663825" font-weight="bold" text-anchor="start">among the highest</text><text x="592" y="290" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">urban-heat-island mortality burdens in Europe</text><text x="592" y="313" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">(Iungman et al. 2023)</text><text x="592" y="363" font-size="32" fill="#663825" font-weight="bold" text-anchor="start">UTCI &gt; 32 °C</text><text x="592" y="395" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">strong heat stress for a pedestrian; on the</text><text x="592" y="418" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">hottest day even full shade is above it in 5</text><text x="592" y="442" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">of 6 afternoon hours</text><text x="592" y="491" font-size="32" fill="#663825" font-weight="bold" text-anchor="start">+1.36 °C</text><text x="592" y="523" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Porta's summer surface-temperature anomaly</text><text x="592" y="546" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">against the city</text><rect x="1080" y="170" width="460" height="480" rx="12" fill="#3F663E" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="1080" y="170" width="460" height="6" rx="0" fill="#3F663E" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1102" y="208" font-size="18" fill="#3F663E" font-weight="bold" text-anchor="start">THE DECISION ALREADY TAKEN</text><text x="1102" y="258" font-size="32" fill="#3F663E" font-weight="bold" text-anchor="start">15%</text><text x="1102" y="290" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">maximum share of any one species, under the</text><text x="1102" y="313" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">tree master plan</text><text x="1102" y="363" font-size="32" fill="#3F663E" font-weight="bold" text-anchor="start">27.6%</text><text x="1102" y="395" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">share of Platanus x acerifolia among</text><text x="1102" y="418" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Barcelona's 145,176 street trees, and 29%</text><text x="1102" y="442" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">inside Porta, so many must go</text><text x="1102" y="491" font-size="32" fill="#3F663E" font-weight="bold" text-anchor="start">6 + 1 species</text><text x="1102" y="523" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">named by the city as replacements, plus</text><text x="1102" y="546" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Styphnolobium from the press</text><rect x="60" y="684" width="1480" height="96" rx="12" fill="#2A2622" fill-opacity="0.06" stroke="none" stroke-width="2"/><text x="82" y="722" font-size="24" fill="#2A2622" font-weight="bold" text-anchor="start">The two hazards and the decision land on the same streets, in the same years.</text><text x="82" y="756" font-size="18" fill="#665E4F" font-weight="normal" text-anchor="start">That is the opening: not "trees are good", but a replacement programme that has to be decided species by species, position by position.</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: Barcelona Resilience Atlas (sealed surface, citing Barcelona Regional; storm frequency); notes/city_screening.md (sewer return period); Iungman et al. 2023; Bröde et al. 2012 (UTCI classes);</text><text x="60" y="869" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">notes/site_selection.md (Porta anomaly); tree master plan via BCNROC, databases/data_inventory_barcelona.md D1 (press figures conflict).</text></svg>