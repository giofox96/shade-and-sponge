<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">The code travels, the evidence does not</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">What the method needs at a new site: Porta (calibration) vs three transfer options, verified 19 Oct</text><text x="730" y="196" font-size="19" fill="#3F663E" font-weight="bold" text-anchor="middle">Barcelona</text><text x="730" y="216" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="middle">calibration</text><text x="860" y="196" font-size="19" fill="#8C6A24" font-weight="bold" text-anchor="middle">Florence</text><text x="860" y="216" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="middle">1st choice</text><text x="990" y="196" font-size="19" fill="#283F66" font-weight="bold" text-anchor="middle">Mataro</text><text x="990" y="216" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="middle">fallback</text><text x="1120" y="196" font-size="19" fill="#665E4F" font-weight="bold" text-anchor="middle">Bologna</text><text x="1120" y="216" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="middle">dropped</text><text x="1180" y="206" font-size="17" fill="#2A2622" font-weight="bold" text-anchor="start">What it costs to move the method</text><rect x="45" y="232" width="1510" height="50" rx="8" fill="#3F663E" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="254" font-size="19" fill="#2A2622" font-weight="bold" text-anchor="start">Boundary, buildings, DTM</text><text x="60" y="274" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">domain, building shadows, flow routing</text><circle cx="730" cy="258" r="14" fill="#F2F0EA" stroke="#3F663E" stroke-width="2.5"/><circle cx="730" cy="258" r="14" fill="#3F663E"/><circle cx="860" cy="258" r="14" fill="#F2F0EA" stroke="#8C6A24" stroke-width="2.5"/><circle cx="860" cy="258" r="14" fill="#8C6A24"/><circle cx="990" cy="258" r="14" fill="#F2F0EA" stroke="#283F66" stroke-width="2.5"/><circle cx="990" cy="258" r="14" fill="#283F66"/><circle cx="1120" cy="258" r="14" fill="#F2F0EA" stroke="#665E4F" stroke-width="2.5"/><path d="M1120,244 A14,14 0 0,0 1120,272 Z" fill="#665E4F"/><text x="1180" y="262" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">OSM plus a municipal or national terrain</text><text x="1180" y="282" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">product nearly everywhere</text><rect x="45" y="284" width="1510" height="50" rx="8" fill="#8C6A24" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="306" font-size="19" fill="#2A2622" font-weight="bold" text-anchor="start">Tree inventory: species + position</text><text x="60" y="326" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">baseline stock and the positions to replace</text><circle cx="730" cy="310" r="14" fill="#F2F0EA" stroke="#3F663E" stroke-width="2.5"/><circle cx="730" cy="310" r="14" fill="#3F663E"/><circle cx="860" cy="310" r="14" fill="#F2F0EA" stroke="#8C6A24" stroke-width="2.5"/><circle cx="860" cy="310" r="14" fill="#8C6A24"/><circle cx="990" cy="310" r="14" fill="#F2F0EA" stroke="#283F66" stroke-width="2.5"/><path d="M990,296 A14,14 0 0,0 990,324 Z" fill="#283F66"/><circle cx="1120" cy="310" r="14" fill="#F2F0EA" stroke="#665E4F" stroke-width="2.5"/><circle cx="1120" cy="310" r="14" fill="#665E4F"/><text x="1180" y="314" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">140,404 / 82,324 / 87,285 trees. Mataro:</text><text x="1180" y="334" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">species and positions published, but in</text><text x="1180" y="353" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">separate files</text><rect x="45" y="336" width="1510" height="50" rx="8" fill="#8C6A24" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="358" font-size="19" fill="#2A2622" font-weight="bold" text-anchor="start">Classified leaf-on point cloud</text><text x="60" y="378" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">crown, crown base, LAI proxy from gap fraction</text><circle cx="730" cy="362" r="14" fill="#F2F0EA" stroke="#3F663E" stroke-width="2.5"/><circle cx="730" cy="362" r="14" fill="#3F663E"/><circle cx="860" cy="362" r="14" fill="#F2F0EA" stroke="#8C6A24" stroke-width="2.5"/><circle cx="990" cy="362" r="14" fill="#F2F0EA" stroke="#283F66" stroke-width="2.5"/><circle cx="990" cy="362" r="14" fill="#283F66"/><circle cx="1120" cy="362" r="14" fill="#F2F0EA" stroke="#665E4F" stroke-width="2.5"/><path d="M1120,348 A14,14 0 0,0 1120,376 Z" fill="#665E4F"/><text x="1180" y="366" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">THE binding input. Florence has rasters only;</text><text x="1180" y="386" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">ICGC covers all Catalonia</text><rect x="45" y="388" width="1510" height="50" rx="8" fill="#3F663E" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="410" font-size="19" fill="#2A2622" font-weight="bold" text-anchor="start">Design rainfall (IDF)</text><text x="60" y="430" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">design storms T = 2, 10 yr (T = 1 only in Barcelona)</text><circle cx="730" cy="414" r="14" fill="#F2F0EA" stroke="#3F663E" stroke-width="2.5"/><circle cx="730" cy="414" r="14" fill="#3F663E"/><circle cx="860" cy="414" r="14" fill="#F2F0EA" stroke="#8C6A24" stroke-width="2.5"/><circle cx="860" cy="414" r="14" fill="#8C6A24"/><circle cx="990" cy="414" r="14" fill="#F2F0EA" stroke="#283F66" stroke-width="2.5"/><circle cx="990" cy="414" r="14" fill="#283F66"/><circle cx="1120" cy="414" r="14" fill="#F2F0EA" stroke="#665E4F" stroke-width="2.5"/><text x="1180" y="418" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">Barcelona PDISBA, Florence a 1 km a-n grid,</text><text x="1180" y="438" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">Mataro a full 5-120 min table of its own</text><rect x="45" y="440" width="1510" height="50" rx="8" fill="#8C6A24" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="462" font-size="19" fill="#2A2622" font-weight="bold" text-anchor="start">Pluvial flood map</text><text x="60" y="482" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">where runoff matters: the hotspot target</text><circle cx="730" cy="466" r="14" fill="#F2F0EA" stroke="#3F663E" stroke-width="2.5"/><circle cx="730" cy="466" r="14" fill="#3F663E"/><circle cx="860" cy="466" r="14" fill="#F2F0EA" stroke="#8C6A24" stroke-width="2.5"/><path d="M860,452 A14,14 0 0,0 860,480 Z" fill="#8C6A24"/><circle cx="990" cy="466" r="14" fill="#F2F0EA" stroke="#283F66" stroke-width="2.5"/><circle cx="1120" cy="466" r="14" fill="#F2F0EA" stroke="#665E4F" stroke-width="2.5"/><text x="1180" y="470" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">NO Catalan city has one: the ACA pluvial</text><text x="1180" y="490" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">polygon IS the municipal boundary</text><rect x="45" y="492" width="1510" height="50" rx="8" fill="#8C6A24" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="514" font-size="19" fill="#2A2622" font-weight="bold" text-anchor="start">Weather file (EPW)</text><text x="60" y="534" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">UTCI inputs and design hours</text><circle cx="730" cy="518" r="14" fill="#F2F0EA" stroke="#3F663E" stroke-width="2.5"/><circle cx="730" cy="518" r="14" fill="#3F663E"/><circle cx="860" cy="518" r="14" fill="#F2F0EA" stroke="#8C6A24" stroke-width="2.5"/><path d="M860,504 A14,14 0 0,0 860,532 Z" fill="#8C6A24"/><circle cx="990" cy="518" r="14" fill="#F2F0EA" stroke="#283F66" stroke-width="2.5"/><circle cx="990" cy="518" r="14" fill="#283F66"/><circle cx="1120" cy="518" r="14" fill="#F2F0EA" stroke="#665E4F" stroke-width="2.5"/><path d="M1120,504 A14,14 0 0,0 1120,532 Z" fill="#665E4F"/><text x="1180" y="522" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">TMYx verified for Spain; the airport-vs-centre</text><text x="1180" y="542" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">bias is a stated limit everywhere</text><rect x="45" y="544" width="1510" height="50" rx="8" fill="#8C6A24" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="566" font-size="19" fill="#2A2622" font-weight="bold" text-anchor="start">Measured species traits</text><text x="60" y="586" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">trait table and gap-filling classes</text><circle cx="730" cy="570" r="14" fill="#F2F0EA" stroke="#3F663E" stroke-width="2.5"/><path d="M730,556 A14,14 0 0,0 730,584 Z" fill="#3F663E"/><circle cx="860" cy="570" r="14" fill="#F2F0EA" stroke="#8C6A24" stroke-width="2.5"/><path d="M860,556 A14,14 0 0,0 860,584 Z" fill="#8C6A24"/><circle cx="990" cy="570" r="14" fill="#F2F0EA" stroke="#283F66" stroke-width="2.5"/><path d="M990,556 A14,14 0 0,0 990,584 Z" fill="#283F66"/><circle cx="1120" cy="570" r="14" fill="#F2F0EA" stroke="#665E4F" stroke-width="2.5"/><path d="M1120,556 A14,14 0 0,0 1120,584 Z" fill="#665E4F"/><text x="1180" y="574" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">40% in Barcelona, 19% in Florence. Porta-</text><text x="1180" y="594" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">measured species cover 52% of Mataro streets</text><rect x="45" y="596" width="1510" height="50" rx="8" fill="#8C6A24" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="618" font-size="19" fill="#2A2622" font-weight="bold" text-anchor="start">Leaf calendar + storm season</text><text x="60" y="638" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">LAI per month, storm weighting</text><circle cx="730" cy="622" r="14" fill="#F2F0EA" stroke="#3F663E" stroke-width="2.5"/><circle cx="730" cy="622" r="14" fill="#3F663E"/><circle cx="860" cy="622" r="14" fill="#F2F0EA" stroke="#8C6A24" stroke-width="2.5"/><path d="M860,608 A14,14 0 0,0 860,636 Z" fill="#8C6A24"/><circle cx="990" cy="622" r="14" fill="#F2F0EA" stroke="#283F66" stroke-width="2.5"/><circle cx="990" cy="622" r="14" fill="#283F66"/><circle cx="1120" cy="622" r="14" fill="#F2F0EA" stroke="#665E4F" stroke-width="2.5"/><path d="M1120,608 A14,14 0 0,0 1120,636 Z" fill="#665E4F"/><text x="1180" y="626" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">City-specific - but Mataro inherits</text><text x="1180" y="646" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">Barcelona's calendar and storm months</text><text x="1180" y="665" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">unchanged</text><rect x="45" y="648" width="1510" height="50" rx="8" fill="#8C6A24" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="60" y="670" font-size="19" fill="#2A2622" font-weight="bold" text-anchor="start">Policy cap + replacement palette</text><text x="60" y="690" font-size="15" fill="#665E4F" font-weight="normal" text-anchor="start">the feasible species set</text><circle cx="730" cy="674" r="14" fill="#F2F0EA" stroke="#3F663E" stroke-width="2.5"/><path d="M730,660 A14,14 0 0,0 730,688 Z" fill="#3F663E"/><circle cx="860" cy="674" r="14" fill="#F2F0EA" stroke="#8C6A24" stroke-width="2.5"/><path d="M860,660 A14,14 0 0,0 860,688 Z" fill="#8C6A24"/><circle cx="990" cy="674" r="14" fill="#F2F0EA" stroke="#283F66" stroke-width="2.5"/><path d="M990,660 A14,14 0 0,0 990,688 Z" fill="#283F66"/><circle cx="1120" cy="674" r="14" fill="#F2F0EA" stroke="#665E4F" stroke-width="2.5"/><path d="M1120,660 A14,14 0 0,0 1120,688 Z" fill="#665E4F"/><text x="1180" y="678" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">The 15% cap is Barcelona's own; Sabadell</text><text x="1180" y="698" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">proposes one, Florence has none</text><circle cx="66" cy="730" r="10" fill="#F2F0EA" stroke="#2A2622" stroke-width="2.5"/><circle cx="66" cy="730" r="10" fill="#2A2622"/><text x="84" y="736" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">available</text><circle cx="226" cy="730" r="10" fill="#F2F0EA" stroke="#2A2622" stroke-width="2.5"/><path d="M226,720 A10,10 0 0,0 226,740 Z" fill="#2A2622"/><text x="244" y="736" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">to confirm / to derive</text><circle cx="386" cy="730" r="10" fill="#F2F0EA" stroke="#2A2622" stroke-width="2.5"/><text x="404" y="736" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">looked for, not found</text><rect x="540" y="714" width="325" height="112" rx="10" fill="#3F663E" fill-opacity="0.1" stroke="none" stroke-width="2"/><text x="558" y="740" font-size="17" fill="#3F663E" font-weight="bold" text-anchor="start">SITE-AGNOSTIC KERNELS</text><text x="558" y="754" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">flow routing · sun and shadow</text><text x="558" y="774" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">geometry · SCS-CN runoff</text><rect x="885" y="714" width="325" height="112" rx="10" fill="#8C6A24" fill-opacity="0.1" stroke="none" stroke-width="2"/><text x="903" y="740" font-size="17" fill="#8C6A24" font-weight="bold" text-anchor="start">LOCAL IN EVERY DATA MODULE</text><text x="903" y="754" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">site adapter · design days and</text><text x="903" y="774" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">OP_BARE · calibrated s and IDF ·</text><text x="903" y="793" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">leaf calendar · palette and cap</text><rect x="1230" y="714" width="325" height="112" rx="10" fill="#283F66" fill-opacity="0.1" stroke="none" stroke-width="2"/><text x="1248" y="740" font-size="17" fill="#283F66" font-weight="bold" text-anchor="start">DESIGN MODE NEEDS LESS</text><text x="1248" y="754" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">the designer supplies the positions;</text><text x="1248" y="774" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">an EPW, terrain, traits, an IDF</text><text x="1248" y="793" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">curve and a leaf calendar stay</text><text x="1248" y="812" font-size="15" fill="#2A2622" font-weight="normal" text-anchor="start">mandatory</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: data_inventory_barcelona.md A1, A3, A7, B1-B2, C4, D1-D2, G; data_inventory.md B1, B3, B5-B7, F1, F3, F5-F7; topic_decision.md 6.1 (trait coverage); methodology.md 4 validation (iii) (routing vs RESCCUE</text><text x="60" y="869" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">depth); transfer_species_overlap.csv; catalan_transfer_city.md (ACA 3rd-cycle Annex 8 Taula 1; ICGC per-point GPS dates, sampled clips); Esbri et al. 2026 (storm months); phenology_palette.csv;</text><text x="60" y="886" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">notes/transferability.md.</text></svg>