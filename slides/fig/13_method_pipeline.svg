<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">Method: from LiDAR trees to a heat-runoff trade-off</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Python modules + Grasshopper; status on 8 Oct 2026</text><rect x="60" y="160" width="290" height="600" rx="10" fill="#2A2622" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="160" width="290" height="6" rx="0" fill="#2A2622" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="76" y="198" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="start">1  DATA</text><text x="76" y="230" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Street trees: species,</text><text x="76" y="253" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">position, size (Ajuntament)</text><text x="76" y="287" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">LiDAR 2021, leaf-on (ICGC)</text><text x="76" y="320" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Buildings: OSM footprints +</text><text x="76" y="344" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">LiDAR height</text><text x="76" y="377" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Pervious ground: NDVI 2017</text><text x="76" y="400" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">+ parks</text><text x="76" y="434" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Design storms: PDISBA</text><text x="76" y="457" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">rainfall curves</text><text x="76" y="491" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Weather: EPW Barcelona</text><text x="76" y="514" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">(Ladybug)</text><text x="76" y="547" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Traits: BROT 2, 3TF,</text><text x="76" y="571" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">literature; TRY, i-Tree</text><text x="76" y="594" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">requested</text><rect x="76" y="720" width="96" height="26" rx="13" fill="#3F663E" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="124" y="738" font-size="14" fill="#3F663E" font-weight="bold" text-anchor="middle">collected</text><rect x="400" y="160" width="260" height="600" rx="10" fill="#2A2622" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="400" y="160" width="260" height="6" rx="0" fill="#2A2622" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="416" y="198" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="start">2  TREE MODEL</text><text x="416" y="230" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Per tree: height, crown</text><text x="416" y="253" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">diameter, crown base,</text><text x="416" y="277" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">LAI proxy (2,600 LiDAR</text><text x="416" y="300" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">crowns)</text><text x="416" y="334" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Per species: traits</text><text x="416" y="357" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">from databases; gaps</text><text x="416" y="380" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">filled by genus or leaf</text><text x="416" y="404" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">habit, with ranges</text><text x="416" y="437" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Young vs mature crowns</text><text x="416" y="461" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">for replacements</text><rect x="416" y="720" width="171" height="26" rx="13" fill="#8C6A24" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="502" y="738" font-size="14" fill="#8C6A24" font-weight="bold" text-anchor="middle">traits in progress</text><rect x="710" y="160" width="360" height="285" rx="10" fill="#283F66" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="710" y="160" width="360" height="6" rx="0" fill="#283F66" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="726" y="198" font-size="20" fill="#283F66" font-weight="bold" text-anchor="start">3a  RUNOFF (Python)</text><text x="726" y="230" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">1 m grid, design storms T = 1, 2,</text><text x="726" y="253" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">10 yr</text><text x="726" y="287" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Canopy storage S = 1.75 mm x LAI,</text><text x="726" y="310" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">calibrated on Freiburg field data</text><text x="726" y="344" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">SCS curve number → event runoff</text><text x="726" y="367" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">(m³)</text><rect x="726" y="405" width="79" height="26" rx="13" fill="#3F663E" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="765" y="423" font-size="14" fill="#3F663E" font-weight="bold" text-anchor="middle">v1 done</text><rect x="710" y="475" width="360" height="285" rx="10" fill="#663825" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="710" y="475" width="360" height="6" rx="0" fill="#663825" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="726" y="513" font-size="20" fill="#663825" font-weight="bold" text-anchor="start">3b  HEAT (Grasshopper)</text><text x="726" y="545" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Ladybug: sky view + solar MRT →</text><text x="726" y="568" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">UTCI at 1.1 m on sidewalks</text><text x="726" y="602" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Honeybee check of final layouts</text><text x="726" y="635" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Infrared City API if access is</text><text x="726" y="659" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">granted</text><rect x="726" y="720" width="54" height="26" rx="13" fill="#8C6A24" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="753" y="738" font-size="14" fill="#8C6A24" font-weight="bold" text-anchor="middle">next</text><rect x="1120" y="160" width="200" height="600" rx="10" fill="#2A2622" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="1120" y="160" width="200" height="6" rx="0" fill="#2A2622" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1136" y="198" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="start">4  SEARCH</text><text x="1136" y="230" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">NSGA-II</text><text x="1136" y="263" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Decision: species</text><text x="1136" y="287" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">at each of the</text><text x="1136" y="310" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">832 plane</text><text x="1136" y="334" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">positions</text><text x="1136" y="367" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Constraints: ≤</text><text x="1136" y="390" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">15% per species,</text><text x="1136" y="414" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">diversity floor,</text><text x="1136" y="437" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">no invasive or</text><text x="1136" y="461" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">pest hosts</text><rect x="1136" y="720" width="79" height="26" rx="13" fill="#665E4F" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="1175" y="738" font-size="14" fill="#665E4F" font-weight="bold" text-anchor="middle">planned</text><rect x="1370" y="160" width="170" height="600" rx="10" fill="#3F663E" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="1370" y="160" width="170" height="6" rx="0" fill="#3F663E" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1386" y="198" font-size="20" fill="#3F663E" font-weight="bold" text-anchor="start">5  RESULT</text><text x="1386" y="230" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Pareto front:</text><text x="1386" y="253" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">heat vs runoff</text><text x="1386" y="287" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Scenarios</text><text x="1386" y="310" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">S0-S4</text><text x="1386" y="344" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Tests H1 and</text><text x="1386" y="367" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">H2</text><text x="1386" y="400" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Transfer: Sant</text><text x="1386" y="424" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Antoni,</text><text x="1386" y="447" font-size="18" fill="#2A2622" font-weight="normal" text-anchor="start">Florence</text><rect x="1386" y="720" width="79" height="26" rx="13" fill="#665E4F" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="1425" y="738" font-size="14" fill="#665E4F" font-weight="bold" text-anchor="middle">planned</text><line x1="350" y1="460" x2="398" y2="460" stroke="#665E4F" stroke-width="2.5" marker-end="url(#arr)"/><line x1="660" y1="380" x2="708" y2="300" stroke="#665E4F" stroke-width="2.5" marker-end="url(#arr)"/><line x1="660" y1="540" x2="708" y2="620" stroke="#665E4F" stroke-width="2.5" marker-end="url(#arr)"/><line x1="1070" y1="300" x2="1118" y2="400" stroke="#665E4F" stroke-width="2.5" marker-end="url(#arr)"/><line x1="1070" y1="620" x2="1118" y2="520" stroke="#665E4F" stroke-width="2.5" marker-end="url(#arr)"/><line x1="1320" y1="460" x2="1368" y2="460" stroke="#665E4F" stroke-width="2.5" marker-end="url(#arr)"/><text x="60" y="800" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">Validation: interception vs Freiburg field data (done); runoff vs the Selbig 2021 field benchmark (same order, done); Ladybug fast vs detailed runs; sensitivity on</text><text x="60" y="822" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">every assumed parameter.</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: notes/methodology.md; scripts/bcn_lidar_porta.py, runoff_model.py, calibrate_interception.py.</text></svg>