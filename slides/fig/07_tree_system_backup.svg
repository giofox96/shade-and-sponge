<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">If broader: from the crown to the tree as a system</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">Backup slide: one added design variable (the pit), soil as a parameter, carbon as an output</text><rect x="70" y="600" width="680" height="18" rx="0" fill="#9CA3AF" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="80" y="640" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">sealed pavement</text><rect x="70" y="618" width="680" height="150" rx="0" fill="#A47148" fill-opacity="0.12" stroke="none" stroke-width="2"/><text x="520" y="660" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="start">compacted fill: no survey data</text><rect x="330" y="600" width="170" height="160" rx="4" fill="#A47148" fill-opacity="0.45" stroke="none" stroke-width="2"/><text x="415" y="750" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">pit soil</text><rect x="405" y="390" width="20" height="210" rx="3" fill="#6B4F3A" fill-opacity="1.0" stroke="none" stroke-width="2"/><ellipse cx="415" cy="300" rx="210" ry="115" fill="#3B7F4A" fill-opacity="0.55"/><line x1="300" y1="165" x2="292" y2="188" stroke="#2F6DB5" stroke-width="3"/><line x1="340" y1="165" x2="332" y2="188" stroke="#2F6DB5" stroke-width="3"/><line x1="380" y1="165" x2="372" y2="188" stroke="#2F6DB5" stroke-width="3"/><line x1="420" y1="165" x2="412" y2="188" stroke="#2F6DB5" stroke-width="3"/><line x1="460" y1="165" x2="452" y2="188" stroke="#2F6DB5" stroke-width="3"/><line x1="500" y1="165" x2="492" y2="188" stroke="#2F6DB5" stroke-width="3"/><line x1="540" y1="165" x2="532" y2="188" stroke="#2F6DB5" stroke-width="3"/><line x1="110" y1="470" x2="102" y2="495" stroke="#2F6DB5" stroke-width="3"/><line x1="150" y1="470" x2="142" y2="495" stroke="#2F6DB5" stroke-width="3"/><line x1="190" y1="470" x2="182" y2="495" stroke="#2F6DB5" stroke-width="3"/><line x1="230" y1="470" x2="222" y2="495" stroke="#2F6DB5" stroke-width="3"/><circle cx="700" cy="190" r="34" fill="#D9622B" fill-opacity="0.85"/><line x1="665" y1="215" x2="600" y2="255" stroke="#D9622B" stroke-width="3" marker-end="url(#arr)"/><line x1="110" y1="590" x2="320" y2="590" stroke="#2F6DB5" stroke-width="4" marker-end="url(#arr)"/><text x="110" y="572" font-size="16" fill="#2F6DB5" font-weight="bold" text-anchor="start">① runoff into the pit</text><line x1="450" y1="640" x2="450" y2="735" stroke="#2F6DB5" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="510" y="715" font-size="16" fill="#2F6DB5" font-weight="bold" text-anchor="start">② infiltration</text><line x1="432" y1="580" x2="432" y2="420" stroke="#3B7F4A" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="395" y="535" font-size="16" fill="#3B7F4A" font-weight="bold" text-anchor="end">③ water for transpiration</text><text x="290" y="180" font-size="16" fill="#2F6DB5" font-weight="bold" text-anchor="end">④ interception</text><line x1="560" y1="380" x2="660" y2="520" stroke="#D9622B" stroke-width="3" marker-end="url(#arr)"/><text x="622" y="448" font-size="16" fill="#D9622B" font-weight="bold" text-anchor="start">⑤ shade + cooling</text><circle cx="690" cy="555" r="9" fill="#1F2933"/><line x1="690" y1="564" x2="690" y2="598" stroke="#1F2933" stroke-width="4"/><text x="705" y="582" font-size="14" fill="#1F2933" font-weight="bold" text-anchor="start">UTCI</text><rect x="830" y="160" width="710" height="106" rx="10" fill="#3B7F4A" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="830" y="160" width="6" height="106" rx="0" fill="#3B7F4A" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="860" y="198" font-size="22" fill="#3B7F4A" font-weight="bold" text-anchor="start">CROWN</text><rect x="1000" y="178" width="54" height="26" rx="13" fill="#3B7F4A" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="1027" y="196" font-size="14" fill="#3B7F4A" font-weight="bold" text-anchor="middle">core</text><text x="860" y="226" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">Species × position, as in the method today. Data: LiDAR crowns, trait</text><text x="860" y="248" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">tables.</text><rect x="830" y="278" width="710" height="195" rx="10" fill="#2F6DB5" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="830" y="278" width="6" height="195" rx="0" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="860" y="316" font-size="22" fill="#2F6DB5" font-weight="bold" text-anchor="start">PIT</text><rect x="1000" y="296" width="96" height="26" rx="13" fill="#2F6DB5" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="1048" y="314" font-size="14" fill="#2F6DB5" font-weight="bold" text-anchor="middle">extension</text><text x="860" y="344" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">Open area, soil volume, surface: one added design variable. Pit size is not</text><text x="860" y="366" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">in the open inventory: municipal spec or a tape survey of ~30 pits in</text><text x="860" y="388" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">Porta. Once sealed surfaces drain onto the tree's soil, the canopy benefit</text><text x="860" y="410" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">fades and soil infiltration controls runoff (Marrazzo &amp; Raimondi 2025,</text><text x="860" y="433" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">model). A 0.72 m² pit draining ~200 m² kept ~11% of its runoff; ~90% needs</text><text x="860" y="455" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">a pit of 2.5-8% of its catchment (Grey et al. 2018).</text><rect x="830" y="485" width="710" height="150" rx="10" fill="#A47148" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="830" y="485" width="6" height="150" rx="0" fill="#A47148" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="860" y="523" font-size="22" fill="#A47148" font-weight="bold" text-anchor="start">SOIL</text><rect x="1000" y="503" width="96" height="26" rx="13" fill="#A47148" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="1048" y="521" font-size="14" fill="#A47148" font-weight="bold" text-anchor="middle">parameter</text><text x="860" y="551" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">2-3 pit-soil options (e.g. standard vs structural soil) from the</text><text x="860" y="573" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">literature, with sensitivity. Structural soil: ~78:22 stone:soil, 30-35%</text><text x="860" y="595" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">porosity (Bartens et al. 2008). No stratigraphy data exists under the</text><text x="860" y="617" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">streets.</text><rect x="830" y="647" width="710" height="106" rx="10" fill="#1F2933" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="830" y="647" width="6" height="106" rx="0" fill="#1F2933" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="860" y="685" font-size="22" fill="#1F2933" font-weight="bold" text-anchor="start">CARBON</text><rect x="1000" y="665" width="70" height="26" rx="13" fill="#1F2933" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="1035" y="683" font-size="14" fill="#1F2933" font-weight="bold" text-anchor="middle">output</text><text x="860" y="713" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">Reported, not optimised: carbon lost when mature planes are replaced by</text><text x="860" y="735" font-size="17" fill="#1F2933" font-weight="normal" text-anchor="start">young trees. LiDAR allometry or i-Tree Eco.</text><text x="60" y="796" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Hypothesis for the extension: the pit could link the goals, turning street runoff into water for transpiration. Mixed evidence: trees transpired the</text><text x="60" y="821" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">equivalent of 17% of their catchment's runoff, but the trench did not raise it (Thom et al. 2020).</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: Park et al. 2026 (transpiration vs shade); Pace et al. 2025 (soil moisture); Mannucci et al. 2025 (irrigation trade-off); data_inventory_barcelona.md A1, B4. Bartens et al. 2008; Marrazzo &amp; Raimondi 2025; Grey et al.</text><text x="60" y="869" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">2018; Thom et al. 2020, 2022 (all read).</text></svg>