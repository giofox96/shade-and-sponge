<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">Method: from LiDAR trees to a heat-runoff trade-off</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">Python modules + Grasshopper; status on 8 Oct 2026</text><rect x="60" y="160" width="290" height="600" rx="10" fill="#1F2933" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="60" y="160" width="290" height="6" rx="0" fill="#1F2933" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="76" y="198" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">1  DATA</text><text x="76" y="230" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Street trees: species,</text><text x="76" y="253" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">position, size (Ajuntament)</text><text x="76" y="287" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">LiDAR 2021, leaf-on (ICGC)</text><text x="76" y="320" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Buildings: OSM footprints +</text><text x="76" y="344" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">LiDAR height</text><text x="76" y="377" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Pervious ground: NDVI 2017 +</text><text x="76" y="400" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">parks</text><text x="76" y="434" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Design storms: PDISBA</text><text x="76" y="457" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">rainfall curves</text><text x="76" y="491" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Weather: EPW Barcelona</text><text x="76" y="514" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">(Ladybug)</text><text x="76" y="547" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Traits: BROT 2, 3TF,</text><text x="76" y="571" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">literature; TRY, i-Tree</text><text x="76" y="594" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">requested</text><rect x="76" y="720" width="96" height="26" rx="13" fill="#3B7F4A" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="124" y="738" font-size="14" fill="#3B7F4A" font-weight="bold" text-anchor="middle">collected</text><rect x="400" y="160" width="260" height="600" rx="10" fill="#1F2933" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="400" y="160" width="260" height="6" rx="0" fill="#1F2933" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="416" y="198" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">2  TREE MODEL</text><text x="416" y="230" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Per tree: height, crown</text><text x="416" y="253" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">diameter, crown base, LAI</text><text x="416" y="277" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">proxy (2,600 LiDAR</text><text x="416" y="300" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">crowns)</text><text x="416" y="334" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Per species: traits from</text><text x="416" y="357" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">databases; gaps filled by</text><text x="416" y="380" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">genus or leaf habit, with</text><text x="416" y="404" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">ranges</text><text x="416" y="437" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Young vs mature crowns</text><text x="416" y="461" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">for replacements</text><rect x="416" y="720" width="171" height="26" rx="13" fill="#B7791F" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="502" y="738" font-size="14" fill="#B7791F" font-weight="bold" text-anchor="middle">traits in progress</text><rect x="710" y="160" width="360" height="285" rx="10" fill="#2F6DB5" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="710" y="160" width="360" height="6" rx="0" fill="#2F6DB5" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="726" y="198" font-size="20" fill="#2F6DB5" font-weight="bold" text-anchor="start">3a  RUNOFF (Python)</text><text x="726" y="230" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">1 m grid, design storms T = 1, 2, 10</text><text x="726" y="253" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">yr</text><text x="726" y="287" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Canopy storage S = 1.75 mm x LAI,</text><text x="726" y="310" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">calibrated on Freiburg field data</text><text x="726" y="344" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">SCS curve number → event runoff (m³)</text><rect x="726" y="405" width="79" height="26" rx="13" fill="#3B7F4A" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="765" y="423" font-size="14" fill="#3B7F4A" font-weight="bold" text-anchor="middle">v1 done</text><rect x="710" y="475" width="360" height="285" rx="10" fill="#D9622B" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="710" y="475" width="360" height="6" rx="0" fill="#D9622B" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="726" y="513" font-size="20" fill="#D9622B" font-weight="bold" text-anchor="start">3b  HEAT (Grasshopper)</text><text x="726" y="545" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Ladybug: sky view + solar MRT → UTCI</text><text x="726" y="568" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">at 1.1 m on sidewalks</text><text x="726" y="602" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Honeybee check of final layouts</text><text x="726" y="635" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Infrared City API if access is</text><text x="726" y="659" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">granted</text><rect x="726" y="720" width="54" height="26" rx="13" fill="#B7791F" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="753" y="738" font-size="14" fill="#B7791F" font-weight="bold" text-anchor="middle">next</text><rect x="1120" y="160" width="200" height="600" rx="10" fill="#1F2933" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="1120" y="160" width="200" height="6" rx="0" fill="#1F2933" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1136" y="198" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">4  SEARCH</text><text x="1136" y="230" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">NSGA-II</text><text x="1136" y="263" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Decision: species</text><text x="1136" y="287" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">at each of the 832</text><text x="1136" y="310" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">plane positions</text><text x="1136" y="344" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Constraints: ≤ 15%</text><text x="1136" y="367" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">per species,</text><text x="1136" y="390" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">diversity floor,</text><text x="1136" y="414" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">no invasive or</text><text x="1136" y="437" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">pest hosts</text><rect x="1136" y="720" width="79" height="26" rx="13" fill="#6B7280" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="1175" y="738" font-size="14" fill="#6B7280" font-weight="bold" text-anchor="middle">planned</text><rect x="1370" y="160" width="170" height="600" rx="10" fill="#3B7F4A" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="1370" y="160" width="170" height="6" rx="0" fill="#3B7F4A" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1386" y="198" font-size="20" fill="#3B7F4A" font-weight="bold" text-anchor="start">5  RESULT</text><text x="1386" y="230" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Pareto front:</text><text x="1386" y="253" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">heat vs runoff</text><text x="1386" y="287" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Scenarios S0-S4</text><text x="1386" y="320" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Tests H1-H3</text><text x="1386" y="354" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Transfer: Sant</text><text x="1386" y="377" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Antoni,</text><text x="1386" y="400" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Florence</text><rect x="1386" y="720" width="79" height="26" rx="13" fill="#6B7280" fill-opacity="0.15" stroke="none" stroke-width="2"/><text x="1425" y="738" font-size="14" fill="#6B7280" font-weight="bold" text-anchor="middle">planned</text><line x1="350" y1="460" x2="398" y2="460" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/><line x1="660" y1="380" x2="708" y2="300" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/><line x1="660" y1="540" x2="708" y2="620" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/><line x1="1070" y1="300" x2="1118" y2="400" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/><line x1="1070" y1="620" x2="1118" y2="520" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/><line x1="1320" y1="460" x2="1368" y2="460" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/><text x="60" y="800" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">Validation: interception vs Freiburg field data (done); runoff vs the Selbig 2021 field benchmark (same order, done); Ladybug fast vs detailed runs; sensitivity on every</text><text x="60" y="822" font-size="17" fill="#6B7280" font-weight="normal" text-anchor="start">assumed parameter.</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: notes/methodology.md; scripts/bcn_lidar_porta.py, runoff_model.py, calibrate_interception.py.</text></svg>