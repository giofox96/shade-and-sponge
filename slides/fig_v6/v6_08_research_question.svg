<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">The research question (v6)</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">Rebuilt on the tree master plan, 21 Oct</text><rect x="60" y="160" width="1480" height="400" rx="12" fill="#1F2933" fill-opacity="0.05" stroke="none" stroke-width="2"/><text x="84" y="206" font-size="26" fill="#6B7280" font-weight="normal" text-anchor="start">In Porta, as plane trees are replaced under Barcelona's tree master plan,</text><text x="84" y="250" font-size="28" fill="#1F2933" font-weight="bold" text-anchor="start">which replacement species, chosen within the plan's rules, and at which plane positions,</text><rect x="84" y="272" width="450" height="44" rx="22" fill="#3B7F4A" fill-opacity="0.12" stroke="none" stroke-width="2"/><text x="309" y="301" font-size="19" fill="#3B7F4A" font-weight="bold" text-anchor="middle">≤ 15% per species</text><rect x="564" y="272" width="450" height="44" rx="22" fill="#3B7F4A" fill-opacity="0.12" stroke="none" stroke-width="2"/><text x="789" y="301" font-size="19" fill="#3B7F4A" font-weight="bold" text-anchor="middle">size class set by sidewalk width</text><rect x="1044" y="272" width="450" height="44" rx="22" fill="#3B7F4A" fill-opacity="0.12" stroke="none" stroke-width="2"/><text x="1269" y="301" font-size="19" fill="#3B7F4A" font-weight="bold" text-anchor="middle">the city's species catalogue</text><text x="84" y="356" font-size="26" fill="#1F2933" font-weight="bold" text-anchor="start">jointly reduce</text><rect x="84" y="372" width="700" height="92" rx="10" fill="#D9622B" fill-opacity="0.1" stroke="none" stroke-width="2"/><text x="104" y="404" font-size="23" fill="#D9622B" font-weight="bold" text-anchor="start">(a)  pedestrian heat stress</text><text x="104" y="436" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">mean UTCI over 12–17 h on a hot design day, sun-exposed routes</text><rect x="816" y="372" width="700" height="92" rx="10" fill="#2F6DB5" fill-opacity="0.1" stroke="none" stroke-width="2"/><text x="836" y="404" font-size="23" fill="#2F6DB5" font-weight="bold" text-anchor="start">(b)  event runoff volume</text><text x="836" y="436" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">sealed street surfaces, 1-, 2- and 10-year PDISBA design storms</text><text x="84" y="508" font-size="24" fill="#1F2933" font-weight="bold" text-anchor="start">How large is the trade-off, and how far do rule-compliant optimised choices differ</text><text x="84" y="540" font-size="24" fill="#1F2933" font-weight="bold" text-anchor="start">from the current trees (S0) and from the city's own replacement (S1)?</text><text x="60" y="610" font-size="18" fill="#3B7F4A" font-weight="bold" text-anchor="start">What changed from v5 (21 Oct)</text><text x="60" y="648" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">THE RULES ARE EXPLICIT</text><text x="60" y="678" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">the 15% cap, the sizing rule and the catalogue</text><text x="60" y="703" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">are hard constraints, not background</text><text x="560" y="648" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">S1 IS THE CITY</text><text x="560" y="678" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">the 2026 target mix, placed by the city's own</text><text x="560" y="703" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">sizing rule at random — what happens anyway, not</text><text x="560" y="727" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">a like-for-like swap</text><text x="1060" y="648" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="start">ONE OPPORTUNITY AT A TIME</text><text x="1060" y="678" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">the method must work for any subset of</text><text x="1060" y="703" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">positions: one street rebuild, not all 832 at</text><text x="1060" y="727" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">once</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: notes/topic_decision.md 9.4 (RQ v6), 9.6 (S1), 9.7 (scope); heat metric: section 8 and notes/decisions/heat_objective.md.</text></svg>