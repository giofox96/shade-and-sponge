<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">The city decided how much, not which species where</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Barcelona's tree master plan (2017–2037) and street-tree guide (2011), read 20 Oct</text><text x="60" y="175" font-size="18" fill="#3F663E" font-weight="bold" text-anchor="start">DECIDED BY THE CITY</text><rect x="60" y="200" width="720" height="106" rx="10" fill="#3F663E" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="82" y="240" font-size="30" fill="#3F663E" font-weight="bold" text-anchor="start">✓</text><text x="124" y="236" font-size="22" fill="#2A2622" font-weight="bold" text-anchor="start">How much of each species</text><text x="124" y="264" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">No species above 15% of the urban fabric by 2037; planes cut by 56%,</text><text x="124" y="286" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">to 12%, in ten years</text><text x="750" y="294" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="end" font-style="italic">plan target 3; press May 2026</text><rect x="60" y="320" width="720" height="106" rx="10" fill="#3F663E" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="82" y="360" font-size="30" fill="#3F663E" font-weight="bold" text-anchor="start">✓</text><text x="124" y="356" font-size="22" fill="#2A2622" font-weight="bold" text-anchor="start">How and when</text><text x="124" y="384" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Gradually, as trees die and when streets are rebuilt</text><text x="750" y="414" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="end" font-style="italic">press 2022, 2026</text><rect x="60" y="440" width="720" height="106" rx="10" fill="#3F663E" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="82" y="480" font-size="30" fill="#3F663E" font-weight="bold" text-anchor="start">✓</text><text x="124" y="476" font-size="22" fill="#2A2622" font-weight="bold" text-anchor="start">Which species may be used</text><text x="124" y="504" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">The species catalogue, plus a target mix for the replacements</text><text x="750" y="534" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="end" font-style="italic">2011 guide pp. 49–56; press 2026</text><rect x="60" y="560" width="720" height="106" rx="10" fill="#3F663E" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="82" y="600" font-size="30" fill="#3F663E" font-weight="bold" text-anchor="start">✓</text><text x="124" y="596" font-size="22" fill="#2A2622" font-weight="bold" text-anchor="start">Which tree size fits which street</text><text x="124" y="624" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Sidewalk width sets the size class and the spacing</text><text x="750" y="654" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="end" font-style="italic">2011 guide pp. 22–23</text><text x="820" y="175" font-size="18" fill="#663825" font-weight="bold" text-anchor="start">LEFT OPEN</text><rect x="820" y="200" width="720" height="121" rx="10" fill="#663825" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="842" y="240" font-size="30" fill="#663825" font-weight="bold" text-anchor="start">✗</text><text x="884" y="236" font-size="22" fill="#2A2622" font-weight="bold" text-anchor="start">Which species at each position</text><text x="884" y="264" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">Chosen one tree at a time from qualitative criteria (orientation,</text><text x="884" y="286" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">space, soil, desired shade); no public list</text><text x="1510" y="309" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="end" font-style="italic">press 2022</text><rect x="820" y="335" width="720" height="121" rx="10" fill="#663825" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="842" y="375" font-size="30" fill="#663825" font-weight="bold" text-anchor="start">✗</text><text x="884" y="371" font-size="22" fill="#2A2622" font-weight="bold" text-anchor="start">What each choice does to heat and runoff</text><text x="884" y="399" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">No document quantifies it, per species or per position</text><text x="1510" y="444" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="end" font-style="italic">plan; 2011 guide</text><rect x="820" y="470" width="720" height="121" rx="10" fill="#663825" fill-opacity="0.07" stroke="none" stroke-width="2"/><text x="842" y="510" font-size="30" fill="#663825" font-weight="bold" text-anchor="start">✗</text><text x="884" y="506" font-size="22" fill="#2A2622" font-weight="bold" text-anchor="start">Where heat and flooding overlap</text><text x="884" y="534" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">The plan is city-wide, with no link to the flood or heat-</text><text x="884" y="556" font-size="17" fill="#2A2622" font-weight="normal" text-anchor="start">vulnerability maps</text><text x="1510" y="579" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="end" font-style="italic">plan</text><rect x="820" y="640" width="720" height="150" rx="12" fill="#2A2622" fill-opacity="0.05" stroke="none" stroke-width="2"/><text x="844" y="680" font-size="21" fill="#2A2622" font-weight="bold" text-anchor="start">The thesis sits in the right-hand column: a method that takes</text><text x="844" y="707" font-size="21" fill="#2A2622" font-weight="bold" text-anchor="start">the left-hand column as hard constraints and fills in the</text><text x="844" y="735" font-size="21" fill="#2A2622" font-weight="bold" text-anchor="start">three open questions with numbers.</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: Ajuntament de Barcelona, Pla director de l'arbrat 2017-2037; Gestio de l'arbrat viari de Barcelona (2011); press marked as such (Time Out 2022, Beteve May 2026). notes/topic_decision.md 9.1,</text><text x="60" y="869" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">notes/tree_master_plan.md.</text></svg>