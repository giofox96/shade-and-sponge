<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="78" font-size="38" fill="#1F2933" font-weight="bold" text-anchor="start">The sizing rule leaves the optimisation room</text><text x="60" y="116" font-size="21" fill="#6B7280" font-weight="normal" text-anchor="start">Sidewalk width at each Porta plane, from the city's 1:1000 map; 2011 guide: &lt; 2.5 m none, &lt; 3.5 small, 3.5–6 medium, &gt; 6 m large</text><image x="40" y="140" width="1000" height="680" preserveAspectRatio="xMidYMid meet" href="../../notes/figures/porta_sidewalk_classes.png"/><rect x="1080" y="160" width="460" height="132" rx="12" fill="#3B7F4A" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="1080" y="160" width="6" height="132" rx="0" fill="#3B7F4A" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1106" y="210" font-size="34" fill="#3B7F4A" font-weight="bold" text-anchor="start">400 of 832</text><text x="1106" y="242" font-size="16" fill="#1F2933" font-weight="normal" text-anchor="start">plane positions with a façade-bounded sidewalk</text><text x="1106" y="263" font-size="16" fill="#1F2933" font-weight="normal" text-anchor="start">(measured façade to kerb)</text><rect x="1080" y="310" width="460" height="132" rx="12" fill="#3B7F4A" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="1080" y="310" width="6" height="132" rx="0" fill="#3B7F4A" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1106" y="360" font-size="34" fill="#3B7F4A" font-weight="bold" text-anchor="start">259 + 126</text><text x="1106" y="392" font-size="16" fill="#1F2933" font-weight="normal" text-anchor="start">keep a real choice: three large or three medium</text><text x="1106" y="413" font-size="16" fill="#1F2933" font-weight="normal" text-anchor="start">species</text><rect x="1080" y="460" width="460" height="132" rx="12" fill="#D9622B" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="1080" y="460" width="6" height="132" rx="0" fill="#D9622B" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1106" y="510" font-size="34" fill="#D9622B" font-weight="bold" text-anchor="start">15</text><text x="1106" y="542" font-size="16" fill="#1F2933" font-weight="normal" text-anchor="start">forced to Pyrus (14) or to no tree (1) by the</text><text x="1106" y="563" font-size="16" fill="#1F2933" font-weight="normal" text-anchor="start">literal rule</text><rect x="1080" y="610" width="460" height="132" rx="12" fill="#6B7280" fill-opacity="0.08" stroke="none" stroke-width="2"/><rect x="1080" y="610" width="6" height="132" rx="0" fill="#6B7280" fill-opacity="1.0" stroke="none" stroke-width="2"/><text x="1106" y="660" font-size="34" fill="#6B7280" font-weight="bold" text-anchor="start">432</text><text x="1106" y="692" font-size="16" fill="#1F2933" font-weight="normal" text-anchor="start">medians, boulevards, plaza edges (176 on Av.</text><text x="1106" y="713" font-size="16" fill="#1F2933" font-weight="normal" text-anchor="start">Meridiana): no size filter, an ASSUMPTION</text><text x="60" y="852" font-size="13" fill="#6B7280" font-weight="normal" text-anchor="start">Sources: databases/barcelona/porta_sidewalk_width.csv (scripts/porta_sidewalk_width.py; Mapa base topografic 1:1000, Ajuntament de Barcelona, CC BY 4.0); 20-tree check 18/20 correct (notes/sidewalk_width.md).</text></svg>