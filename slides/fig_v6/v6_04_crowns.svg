<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'IBM Plex Sans', Arial, sans-serif"><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=block");</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#665E4F"/></marker></defs><rect width="1600" height="900" fill="#F2F0EA"/><text x="60" y="78" font-size="38" fill="#2A2622" font-weight="bold" text-anchor="start">The replacements differ: from a full crown to a quarter of one</text><text x="60" y="116" font-size="21" fill="#665E4F" font-weight="normal" text-anchor="start">Same trunk size, very different shade and interception — the choice of species decides the canopy</text><line x1="480" y1="170" x2="480" y2="690" stroke="#DCD8CE" stroke-width="1"/><text x="480" y="715" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="middle">0%</text><line x1="685" y1="170" x2="685" y2="690" stroke="#DCD8CE" stroke-width="1"/><text x="685" y="715" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="middle">25%</text><line x1="890" y1="170" x2="890" y2="690" stroke="#DCD8CE" stroke-width="1"/><text x="890" y="715" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="middle">50%</text><line x1="1095" y1="170" x2="1095" y2="690" stroke="#DCD8CE" stroke-width="1"/><text x="1095" y="715" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="middle">75%</text><line x1="1300" y1="170" x2="1300" y2="690" stroke="#DCD8CE" stroke-width="1"/><text x="1300" y="715" font-size="16" fill="#665E4F" font-weight="normal" text-anchor="middle">100%</text><line x1="1300" y1="170" x2="1300" y2="690" stroke="#2A2622" stroke-width="2" stroke-dasharray="6 4"/><text x="60" y="208" font-size="22" fill="#2A2622" font-weight="bold" text-anchor="start" font-style="italic">Platanus × acerifolia</text><text x="60" y="232" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">plane (reference)</text><rect x="480" y="186" width="820" height="30" rx="6" fill="#2A2622" fill-opacity="0.25" stroke="none" stroke-width="2"/><rect x="480" y="186" width="820" height="30" rx="6" fill="#2A2622" fill-opacity="0.8" stroke="none" stroke-width="2"/><text x="1318" y="208" font-size="20" fill="#2A2622" font-weight="bold" text-anchor="start">100%</text><text x="1318" y="228" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">n = 326/341</text><text x="60" y="280" font-size="22" fill="#3F663E" font-weight="bold" text-anchor="start" font-style="italic">Tipuana tipu</text><text x="60" y="304" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">named by the city</text><rect x="480" y="258" width="877" height="30" rx="6" fill="#3F663E" fill-opacity="0.25" stroke="none" stroke-width="2"/><rect x="480" y="258" width="746" height="30" rx="6" fill="#3F663E" fill-opacity="0.8" stroke="none" stroke-width="2"/><text x="1375" y="280" font-size="20" fill="#3F663E" font-weight="bold" text-anchor="start">91%–107%</text><text x="1375" y="300" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">n = 62/58</text><text x="60" y="352" font-size="22" fill="#8C6A24" font-weight="bold" text-anchor="start" font-style="italic">Jacaranda mimosifolia</text><text x="60" y="376" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">not named</text><rect x="480" y="330" width="787" height="30" rx="6" fill="#8C6A24" fill-opacity="0.25" stroke="none" stroke-width="2"/><rect x="480" y="330" width="730" height="30" rx="6" fill="#8C6A24" fill-opacity="0.8" stroke="none" stroke-width="2"/><text x="1318" y="352" font-size="20" fill="#8C6A24" font-weight="bold" text-anchor="start">89%–96%</text><text x="1318" y="372" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">n = 73/55</text><text x="60" y="424" font-size="22" fill="#3F663E" font-weight="bold" text-anchor="start" font-style="italic">Melia azedarach</text><text x="60" y="448" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">named by the city</text><rect x="480" y="402" width="664" height="30" rx="6" fill="#3F663E" fill-opacity="0.25" stroke="none" stroke-width="2"/><rect x="480" y="402" width="582" height="30" rx="6" fill="#3F663E" fill-opacity="0.8" stroke="none" stroke-width="2"/><text x="1158" y="424" font-size="20" fill="#3F663E" font-weight="bold" text-anchor="start">71%–81%</text><text x="1158" y="444" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">n = 33/70</text><text x="60" y="496" font-size="22" fill="#3F663E" font-weight="bold" text-anchor="start" font-style="italic">Celtis australis</text><text x="60" y="520" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">named by the city</text><rect x="480" y="474" width="426" height="30" rx="6" fill="#3F663E" fill-opacity="0.25" stroke="none" stroke-width="2"/><rect x="480" y="474" width="262" height="30" rx="6" fill="#3F663E" fill-opacity="0.8" stroke="none" stroke-width="2"/><text x="920" y="496" font-size="20" fill="#3F663E" font-weight="bold" text-anchor="start">32%–52%</text><text x="920" y="516" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">n = 149/79</text><text x="60" y="568" font-size="22" fill="#3F663E" font-weight="bold" text-anchor="start" font-style="italic">Pyrus calleryana</text><text x="60" y="592" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">named by the city</text><rect x="480" y="546" width="287" height="30" rx="6" fill="#3F663E" fill-opacity="0.25" stroke="none" stroke-width="2"/><rect x="480" y="546" width="287" height="30" rx="6" fill="#3F663E" fill-opacity="0.8" stroke="none" stroke-width="2"/><text x="781" y="568" font-size="20" fill="#3F663E" font-weight="bold" text-anchor="start">35%</text><text x="781" y="588" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">n = 48</text><text x="60" y="640" font-size="22" fill="#8C6A24" font-weight="bold" text-anchor="start" font-style="italic">Brachychiton populneus</text><text x="60" y="664" font-size="14" fill="#665E4F" font-weight="normal" text-anchor="start">not named</text><rect x="480" y="618" width="221" height="30" rx="6" fill="#8C6A24" fill-opacity="0.25" stroke="none" stroke-width="2"/><rect x="480" y="618" width="197" height="30" rx="6" fill="#8C6A24" fill-opacity="0.8" stroke="none" stroke-width="2"/><text x="715" y="640" font-size="20" fill="#8C6A24" font-weight="bold" text-anchor="start">24%–27%</text><text x="715" y="660" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">n = 55/25</text><text x="60" y="760" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">Crown area as a share of a plane's, in the same trunk class (2nd and 3rd: 41–110 cm perimeter), as the trees stand in Porta (LiDAR 2021). Dark bar = the lower of</text><text x="60" y="782" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">the two class values, light = the higher; n = trees in the 2nd/3rd class. Equal trunk size is not equal age, and street trees are pruned: this is not mature</text><text x="60" y="804" font-size="17" fill="#665E4F" font-weight="normal" text-anchor="start">potential.</text><text x="60" y="852" font-size="13" fill="#665E4F" font-weight="normal" text-anchor="start">Sources: databases/barcelona/crown_by_trunk_class.csv (scripts/crown_by_trunk_class.py), Porta street trees, ICGC LiDAR 26 Sept 2021; notes/topic_decision.md 9.9. Styphnolobium left out (5 trees in Porta).</text></svg>